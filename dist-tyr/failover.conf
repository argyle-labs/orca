# orca-failover configuration for tyr.
# One line per re-exported share. Fields are colon-separated:
#   <share>:<primary_host>:<replica_host>:<remote_path>:<local_path>:<mount_opts>
#
# The orchestrator probes <primary_host> first; on N consecutive failures it
# umounts <local_path> and remounts from <replica_host>. Failback is manual
# (run: orca-failover failback <share>) until the operator confirms primary
# is stable.
#
# Mount opts MUST include `soft,softreval` so a primary outage produces fast
# EIO instead of a kernel hang during swap.

data:10.10.10.10:10.10.10.11:/mnt/user/data:/srv/pool/data:vers=4.2,rsize=1048576,wsize=1048576,nconnect=16,soft,softreval,timeo=50,retrans=2
backups:10.10.10.10:10.10.10.11:/mnt/user/backups:/srv/pool/backups:vers=4.2,rsize=1048576,wsize=1048576,nconnect=16,soft,softreval,timeo=50,retrans=2
downloads:10.10.10.10:10.10.10.11:/mnt/user/downloads:/srv/pool/downloads:vers=4.2,rsize=1048576,wsize=1048576,nconnect=16,soft,softreval,timeo=50,retrans=2

# orca is maple-primary today (no willow source-of-truth); kept here so the
# orchestrator can manage it uniformly. Primary == replica is a no-op probe.
orca:10.10.10.11:10.10.10.11:/mnt/user/orca:/srv/pool/orca:vers=4.2,rsize=1048576,wsize=1048576,nconnect=16,soft,softreval,timeo=50,retrans=2
