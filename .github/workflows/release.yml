name: Release — orca

# Manual release: you choose the bump type and channel.
# Version number is auto-computed from the latest release tag — no manual
# editing of Cargo.toml or version strings required.
#
# Typical flow:
#   1. Run Pipeline workflow to validate everything.
#   2. Run this workflow (patch/minor/major + alpha/rc/stable).
#   3. If pre-release: run Promote workflow when ready to go stable.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
      channel:
        description: "Release channel"
        required: true
        type: choice
        options: [stable, alpha, beta, rc]
        default: stable
      notes:
        description: "Additional release notes (optional, prepended to changelog)"
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── 1. Compute version, commit to Cargo.toml, tag ────────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      version:       ${{ steps.bump.outputs.version }}
      tag:           ${{ steps.bump.outputs.tag }}
      is_prerelease: ${{ steps.bump.outputs.is_prerelease }}
      previous:      ${{ steps.bump.outputs.previous }}
      channel:       ${{ steps.bump.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Compute version
        id: bump
        run: |
          set -euo pipefail
          git fetch --tags --quiet

          CHANNEL="${{ inputs.channel }}"
          BUMP="${{ inputs.bump }}"

          # Latest stable tag as the version base
          LATEST_STABLE=$(git tag -l 'v[0-9]*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          LATEST_STABLE=${LATEST_STABLE:-v0.0.0}

          VERSION="${LATEST_STABLE#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac

          NEXT_STABLE="${MAJOR}.${MINOR}.${PATCH}"

          if [ "$CHANNEL" = "stable" ]; then
            NEW="$NEXT_STABLE"
            IS_PRERELEASE=false
            PREV="$LATEST_STABLE"
          else
            LATEST_PRE=$(git tag -l "v${NEXT_STABLE}-${CHANNEL}.*" | sort -V | tail -1)
            if [ -z "$LATEST_PRE" ]; then
              N=1; PREV="$LATEST_STABLE"
            else
              N=$(echo "$LATEST_PRE" | sed "s/.*${CHANNEL}\.//"); N=$((N+1))
              PREV="$LATEST_PRE"
            fi
            NEW="${NEXT_STABLE}-${CHANNEL}.${N}"
            IS_PRERELEASE=true
          fi

          echo "Releasing: $LATEST_STABLE → v$NEW  (bump=$BUMP, channel=$CHANNEL)"
          echo "version=$NEW"               >> $GITHUB_OUTPUT
          echo "tag=v${NEW}"               >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "previous=v${PREV#v}"       >> $GITHUB_OUTPUT
          echo "channel=$CHANNEL"           >> $GITHUB_OUTPUT

      - name: Write version to Cargo.toml
        run: |
          NEW="${{ steps.bump.outputs.version }}"
          TOML=projects/server/Cargo.toml
          CURRENT=$(grep '^version' "$TOML" | head -1 | sed 's/version = "\(.*\)"/\1/')
          sed -i "0,/^version = \"${CURRENT}\"/s//version = \"${NEW}\"/" "$TOML"
          cargo update -p orca --precise "$NEW" 2>/dev/null || cargo update -p orca || true

      - name: Commit and tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add projects/server/Cargo.toml Cargo.lock
          git diff --cached --quiet || git commit -m "chore: release ${{ steps.bump.outputs.tag }}"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "orca ${{ steps.bump.outputs.tag }}"
          git push origin HEAD --tags

  # ── 2. Build across all targets ──────────────────────────────────────────
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-13
            target: x86_64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --manifest-path projects/server/Cargo.toml

      - name: Stage binary
        run: |
          ASSET="orca-${{ matrix.target }}"
          cp target/${{ matrix.target }}/release/orca "$ASSET"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET" > "${ASSET}.sha256"
          else
            shasum -a 256 "$ASSET" > "${ASSET}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: orca-${{ matrix.target }}
          path: |
            orca-${{ matrix.target }}
            orca-${{ matrix.target }}.sha256
          retention-days: 1

  # ── 3. Changelog + release ───────────────────────────────────────────────
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Merge checksums
        run: cat artifacts/*.sha256 > artifacts/checksums.sha256

      - name: Generate changelog
        run: |
          PREV="${{ needs.version.outputs.previous }}"
          NEW="v${{ needs.version.outputs.version }}"
          CHANNEL="${{ needs.version.outputs.channel }}"

          [ "$PREV" = "v0.0.0" ] && RANGE="HEAD" || RANGE="${PREV}..HEAD"
          COMMITS=$(git log "$RANGE" --pretty=format:"%s" \
            | grep -v '^chore: release v' | head -100)

          section() {
            local title="$1"; shift
            local items=""
            for prefix in "$@"; do
              items="$items$(echo "$COMMITS" | grep -i "^${prefix}[:(]" | sed 's/^/- /' || true)"$'\n'
            done
            [ -n "$(echo "$items" | tr -d '[:space:]')" ] && printf "### %s\n%s\n" "$title" "$items"
          }

          EXTRA="${{ inputs.notes }}"
          HEADER=""
          [ -n "$EXTRA" ] && HEADER="${EXTRA}\n\n---\n\n"
          [ "$CHANNEL" != "stable" ] && \
            HEADER="${HEADER}> **Pre-release** \`${CHANNEL}\` — not recommended for production.\n\n"

          BODY="${HEADER}## What's Changed\n\n"
          BODY="${BODY}$(section 'Features'    feat feature)"
          BODY="${BODY}$(section 'Bug Fixes'   fix bug)"
          BODY="${BODY}$(section 'Performance' perf)"
          BODY="${BODY}$(section 'Refactoring' refactor refact)"
          BODY="${BODY}$(section 'Build / CI'  build ci chore)"
          BODY="${BODY}$(section 'Docs'        docs)"

          COUNT=$(printf "%b" "$BODY" | grep -c '^- ' || true)
          if [ "${COUNT:-0}" -eq 0 ]; then
            BODY="${HEADER}## What's Changed\n\n$(echo "$COMMITS" | head -50 | sed 's/^/- /')\n\n"
          fi

          REPO="${{ github.repository }}"
          BODY="${BODY}\n## Installation\n\n\`\`\`sh\n"
          BODY="${BODY}# Apple Silicon\ncurl -Lo orca https://github.com/${REPO}/releases/download/${NEW}/orca-aarch64-apple-darwin\n\n"
          BODY="${BODY}# Intel Mac\ncurl -Lo orca https://github.com/${REPO}/releases/download/${NEW}/orca-x86_64-apple-darwin\n\n"
          BODY="${BODY}chmod +x orca && mv orca ~/.local/bin/orca\n"
          BODY="${BODY}xattr -d com.apple.quarantine ~/.local/bin/orca  # clear Gatekeeper flag\n\`\`\`\n\n"
          BODY="${BODY}**Full diff:** [$PREV → $NEW](https://github.com/${REPO}/compare/${PREV}...${NEW})"

          printf "%b" "$BODY" > /tmp/changelog.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: orca ${{ needs.version.outputs.tag }}
          body_path: /tmp/changelog.md
          prerelease: ${{ needs.version.outputs.is_prerelease }}
          files: |
            artifacts/orca-*
            artifacts/checksums.sha256
