name: Release

# Orca's release runs on the SHARED Gitea-native pipeline in argyle-labs/.github
# (see [[unified-cicd-pipeline-architecture]]). This file is a thin caller — all
# build/package/publish logic lives in the shared reusable release.yml.
#
# This file owns the GATED release stages ONLY, triggered by operator dispatch:
#   dispatch rc-publish     → cut vX.Y.Z-rc.N → Gitea Releases (canonical) → mirror GitHub
#   dispatch promote-stable → cut vX.Y.Z stable → Gitea → mirror GitHub
#
# The rolling rc-draft-on-push pipeline was removed in favor of simpler
# pipelines; releases are cut only via the operator dispatch stages above.
#
# Gates = the operator dispatch itself (Gitea has no environment: reviewers).

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Release gate'
        type: choice
        options: [rc-publish, promote-stable]
        default: rc-publish
      bump:
        description: 'Version bump from latest stable tag'
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  release:
    uses: argyle-labs/.github/.github/workflows/release.yml@main
    with:
      stage: ${{ inputs.stage }}
      bump: ${{ inputs.bump }}
      asset-profile: full
      # Build the macOS .pkg on our mint mac runner (label `macos`).
      # Without this the shared pipeline skips package-macos-pkg.
      mint-runner-label: macos
      # Ship ONLY the orca daemon. The workspace also has a `uniffi-bindgen`
      # helper bin (in app-kit); without this the shared pipeline's derive-all-
      # bins logic tries to build it as a release artifact and fails with
      # "no bin target named `uniffi-bindgen` in default-run packages".
      bins: '["orca"]'
      # Linux targets only. The aarch64-apple-darwin binary is built NATIVELY on
      # the mac runner leg (mint-runner-label) — the zigbuild cross-compile emits
      # a duplicate-libiconv Mach-O that macOS dyld refuses to load.
      targets: '["x86_64-unknown-linux-gnu","x86_64-unknown-linux-musl"]'
    secrets: inherit

  # Publishes the orca-* crates to the Gitea cargo registry from the release
  # tag. The branch tip carries the version bump; the tag pins the exact commit
  # released, so a later push to the branch can't change what gets published.
  publish-crates:
    name: Publish crates to Gitea registry
    needs: [release]
    runs-on: ci-large
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out release branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Check out release tag
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          tag="v$version"
          [ -n "$version" ] || { echo "no [workspace.package] version in Cargo.toml" >&2; exit 1; }
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null || { echo "tag $tag not found" >&2; exit 1; }
          git checkout -q "$tag"
          [ "$(git rev-parse HEAD)" = "$(git rev-parse "$tag^{commit}")" ] || { echo "HEAD is not $tag" >&2; exit 1; }
          echo "Publishing from $tag ($(git rev-parse HEAD))"
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRIES_GITEA_TOKEN: Bearer ${{ secrets.CI_REGISTRY_TOKEN }}
        run: scripts/publish-crates.sh
