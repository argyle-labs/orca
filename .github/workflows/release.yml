name: Release
run-name: Release ${{ github.event.release.tag_name || inputs.version }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Already-published tag to rebuild: vX.Y.Z-rc.N or vX.Y.Z'
        type: string
        required: true

concurrency:
  group: ${{ github.repository }}-release-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.version }}
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_REGISTRIES_GITEA_INDEX: sparse+https://gitea.scottkey.me/api/packages/argyle-labs/cargo/

jobs:
  build-x86_64-linux-gnu:
    runs-on: ci-large
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Build x86_64-unknown-linux-gnu
        uses: argyle-labs/.github/.github/actions/job-release-build@main
        with:
          target: x86_64-unknown-linux-gnu
          tag: ${{ env.TAG }}
          asset-profile: full
          # The workspace also has a uniffi-bindgen helper bin; ship only orca.
          bins: '["orca"]'
          orca-fetch-token: ${{ secrets.ORCA_FETCH_TOKEN }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}

  build-x86_64-linux-musl:
    runs-on: ci-large
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Build x86_64-unknown-linux-musl
        uses: argyle-labs/.github/.github/actions/job-release-build@main
        with:
          target: x86_64-unknown-linux-musl
          tag: ${{ env.TAG }}
          asset-profile: full
          # The workspace also has a uniffi-bindgen helper bin; ship only orca.
          bins: '["orca"]'
          orca-fetch-token: ${{ secrets.ORCA_FETCH_TOKEN }}
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}

  build-aarch64-apple-darwin:
    runs-on: macos
    steps:
      - uses: actions/checkout@v4
      - name: Unlock codesign keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.ORCA_CODESIGN_KEYCHAIN_PASSWORD }}
          IDENTITY: Argyle Labs orca Code Signing
        run: |
          set -euo pipefail
          kc="$HOME/Library/Keychains/orca-codesign.keychain-db"
          echo "CODESIGN_KEYCHAIN_PATH=$kc" >> "$GITHUB_ENV"
          if [ -z "$KEYCHAIN_PASSWORD" ]; then
            case "$TAG" in
              *-rc.*)
                echo "::warning::ORCA_CODESIGN_KEYCHAIN_PASSWORD unset; darwin build is ad-hoc signed and macOS TCC grants will not persist across updates"
                exit 0
                ;;
              *)
                echo "::error::ORCA_CODESIGN_KEYCHAIN_PASSWORD unset; stable releases must be signed with the orca identity"
                exit 1
                ;;
            esac
          fi
          . scripts/release-lib.sh
          q_pw=$(secq "$KEYCHAIN_PASSWORD")
          q_kc=$(secq "$kc")
          printf 'unlock-keychain -p %s %s\n' "$q_pw" "$q_kc" | security -i
          security set-keychain-settings -lut 3600 "$kc"
          if ! security find-identity -v -p codesigning "$kc" | grep -qF "\"$IDENTITY\""; then
            echo "::error::codesigning identity '$IDENTITY' not found in $kc; run scripts/macos-codesign-setup.sh on the runner"
            exit 1
          fi
          echo "ORCA_CODESIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          echo "ORCA_CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
      - name: Build aarch64-apple-darwin
        uses: argyle-labs/.github/.github/actions/job-release-build-macos@main
        with:
          tag: ${{ env.TAG }}
      - name: Lock codesign keychain
        if: always()
        run: |
          kc="${CODESIGN_KEYCHAIN_PATH:-}"
          [ -z "$kc" ] || [ ! -f "$kc" ] || security lock-keychain "$kc" || true

  no-test-scope:
    runs-on: ci-large
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Shipped binaries exclude utils test-scope
        run: ./scripts/check-no-test-scope.sh

  package:
    needs: [no-test-scope, build-x86_64-linux-gnu, build-x86_64-linux-musl, build-aarch64-apple-darwin]
    runs-on: ubuntu-latest
    steps:
      - name: Package deb/rpm/PKGBUILD/homebrew/plg
        uses: argyle-labs/.github/.github/actions/job-release-package@main
        with:
          tag: ${{ env.TAG }}

  package-macos-pkg:
    needs: build-aarch64-apple-darwin
    runs-on: macos
    continue-on-error: true
    steps:
      - name: Package .pkg
        uses: argyle-labs/.github/.github/actions/job-release-package-macos@main
        with:
          tag: ${{ env.TAG }}

  # No `if:` on publish: Gitea's act never schedules a job whose `if` reads
  # needs.*.result, and hangs one that needs a skipped job.
  publish:
    needs: [package, package-macos-pkg]
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        uses: argyle-labs/.github/.github/actions/job-release-publish@main
        with:
          tag: ${{ env.TAG }}
          version-commit: "false"
          targets: '["x86_64-unknown-linux-gnu","x86_64-unknown-linux-musl","aarch64-apple-darwin"]'
          asset-profile: full
          release-token: ${{ secrets.ORCA_RELEASE_TOKEN }}
          github-token: ${{ secrets.GH_RELEASE_TOKEN }}

  stable-draft:
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.repository }}-stable
      cancel-in-progress: true
    steps:
      - name: Draft stable
        uses: argyle-labs/.github/.github/actions/job-release-stable-draft@main
        with:
          tag: ${{ env.TAG }}
          release-token: ${{ secrets.ORCA_RELEASE_TOKEN }}

  crates:
    needs: publish
    runs-on: ci-large
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Publish crates
        uses: argyle-labs/.github/.github/actions/job-release-crates@main
        with:
          tag: ${{ env.TAG }}
          registry-token: ${{ secrets.CI_REGISTRY_TOKEN }}
