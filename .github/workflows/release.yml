name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── 1. Bump version, commit, tag ──────────────────────────────────────────
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bump version
        id: bump
        run: |
          set -euo pipefail
          TOML=projects/server/Cargo.toml

          # Read current version
          current=$(grep '^version' "$TOML" | head -1 | sed 's/version = "\(.*\)"/\1/')
          IFS='.' read -r major minor patch <<< "$current"

          # Bump
          case "${{ inputs.bump }}" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          new="${major}.${minor}.${patch}"

          # Write back
          sed -i "0,/^version = \"${current}\"/s//version = \"${new}\"/" "$TOML"

          # Update lock file
          cargo update -p brain --precise "$new" 2>/dev/null || cargo update -p brain

          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "tag=v${new}" >> "$GITHUB_OUTPUT"
          echo "Bumped: $current → $new"

      - name: Commit and tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add projects/server/Cargo.toml Cargo.lock
          git commit -m "chore: release v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD --tags

  # ── 2. Build across all targets ──────────────────────────────────────────
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — Apple Silicon (native arm64)
          - runner: macos-14
            target: aarch64-apple-darwin
            asset_name: brain-aarch64-apple-darwin

          # macOS — Intel (native x86_64)
          - runner: macos-13
            target: x86_64-apple-darwin
            asset_name: brain-x86_64-apple-darwin

          # Linux — x86_64 GNU
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: brain-x86_64-unknown-linux-gnu

          # Linux — x86_64 musl (static, no glibc dependency)
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_name: brain-x86_64-unknown-linux-musl
            musl: true

          # Linux — arm64 GNU
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: brain-aarch64-unknown-linux-gnu

          # Linux — arm64 musl (static, no glibc dependency)
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset_name: brain-aarch64-unknown-linux-musl
            musl: true

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --manifest-path projects/server/Cargo.toml

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/brain ${{ matrix.asset_name }}

      - name: Checksum
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          else
            shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
          retention-days: 1

  # ── 3. Create GitHub release ──────────────────────────────────────────────
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Merge checksums
        run: cat artifacts/*.sha256 > artifacts/checksums.sha256

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Installation

            Download the binary for your platform, make it executable, and place it on your PATH:

            ```sh
            # Apple Silicon
            curl -Lo brain https://github.com/${{ github.repository }}/releases/download/v${{ needs.version.outputs.version }}/brain-aarch64-apple-darwin

            # Intel Mac
            curl -Lo brain https://github.com/${{ github.repository }}/releases/download/v${{ needs.version.outputs.version }}/brain-x86_64-apple-darwin

            chmod +x brain && mv brain ~/.local/bin/brain
            ```

            **macOS — clear the quarantine flag** before running (Gatekeeper blocks unsigned binaries downloaded from the internet):
            ```sh
            xattr -d com.apple.quarantine ~/.local/bin/brain
            ```

            Verify checksums against `checksums.sha256` before running.
          files: |
            artifacts/brain-*
            artifacts/checksums.sha256
