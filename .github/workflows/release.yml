name: Release

# Single, gated release pipeline.
#
# Each ecosystem follows: build → upload artifact → download → test.
# Tests run against built artifacts (not recompiled source). Release
# publishing consumes the same artifacts that the build jobs produced.
#
# Flow:
#   1. lint-rust + build-X (matrix per ecosystem) + test-X
#   2. version      — auto-compute next RC + corresponding stable tag
#   3. publish-rc   — gated by `release-rc` environment (manual approval)
#                     → tags vX.Y.Z-rc.N + creates GitHub pre-release
#   4. publish-stable — gated by `release-stable` environment
#                     → tags vX.Y.Z + creates stable release reusing RC artifacts
#                     → marks RC release as superseded
#
# Setup (one-time, in repo settings):
#   Settings → Environments → New environment:
#     - "release-rc"     — add yourself as required reviewer
#     - "release-stable" — add yourself as required reviewer
#
# Trigger:
#   Actions → Release → Run workflow → choose bump type → Run.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump from latest stable"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
      notes:
        description: "Extra release notes (optional, prepended to changelog)"
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_INCREMENTAL: 0
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  # ── Rust: lint ───────────────────────────────────────────────────────────
  lint-rust:
    name: Lint Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: mozilla-actions/sccache-action@v0.0.6

      # Share the linux-gnu build cache so lint reuses dependency artifacts
      # built by the build-rust matrix (lint runs on ubuntu-latest).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-rust-x86_64-unknown-linux-gnu
          cache-on-failure: true

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (all targets)
        run: RUSTFLAGS="-D warnings" cargo clippy --all-targets -- -D warnings

      - name: SDK isolation check
        run: |
          if cargo tree -p orca-sdk 2>&1 | grep -E "orca-server|orca-commands|orca-conversation|orca-agents|orca-llm|orca-scanner|rust-embed"; then
            echo "ERROR: server-only crate found in orca-sdk dependency tree"
            exit 1
          fi

  # ── Rust: build (matrix per target) ──────────────────────────────────────
  build-rust:
    name: Build Rust ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift
          sudo docker image prune -af || true
          df -h

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable

      # rust-toolchain.toml pins a specific channel; install the target
      # via rustup so it lands in the active toolchain (not stable).
      - name: Add cross-compile target
        run: rustup target add ${{ matrix.target }}

      - uses: mozilla-actions/sccache-action@v0.0.6

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-rust-${{ matrix.target }}
          cache-on-failure: true

      - name: Build orca (release)
        run: cargo build --release --target ${{ matrix.target }} --manifest-path projects/server/Cargo.toml

      - name: Build Rust example plugin (system-info)
        run: cargo build --release --target ${{ matrix.target }} -p orca-example-system-info

      - name: Compile workspace test binaries (no run)
        run: cargo test --workspace --no-run --release --target ${{ matrix.target }}

      - name: Stage release binaries + checksums
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            SUM="sha256sum"
          else
            SUM="shasum -a 256"
          fi
          for src in orca orca-example-system-info; do
            ASSET="${src}-${{ matrix.target }}"
            cp "target/${{ matrix.target }}/release/${src}" "$ASSET"
            $SUM "$ASSET" > "${ASSET}.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: orca-${{ matrix.target }}
          path: |
            orca-${{ matrix.target }}
            orca-${{ matrix.target }}.sha256
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: orca-example-system-info-${{ matrix.target }}
          path: |
            orca-example-system-info-${{ matrix.target }}
            orca-example-system-info-${{ matrix.target }}.sha256
          retention-days: 7

  # ── Rust: test ──────────────────────────────────────────────────────────
  # Single ubuntu-latest job. The per-target build matrix above produces
  # the release binaries; this job validates the workspace once. Shares the
  # linux-gnu Swatinem cache so cargo links against artifacts already built.
  test-rust:
    name: Test Rust
    needs: build-rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.6

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: projects/sdk-go/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: projects/sdk-ts/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-rust-x86_64-unknown-linux-gnu
          cache-on-failure: true

      - name: Run workspace tests
        run: cargo nextest run --workspace --release --no-fail-fast

      - name: Doctests
        run: cargo test --doc --workspace --release --no-fail-fast

  # ── TS SDK ───────────────────────────────────────────────────────────────
  build-sdk-ts:
    name: Build TS SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: projects/sdk-ts/package-lock.json

      - name: Build + pack
        working-directory: projects/sdk-ts
        run: |
          npm ci
          npm run build
          npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-ts-dist
          path: |
            projects/sdk-ts/dist/
            projects/sdk-ts/package.json
            projects/sdk-ts/orca-sdk-*.tgz
          retention-days: 7

  test-sdk-ts:
    name: Test TS SDK
    needs: build-sdk-ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: projects/sdk-ts/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: sdk-ts-dist
          path: projects/sdk-ts/

      - name: Install + test against built dist
        working-directory: projects/sdk-ts
        run: |
          npm ci
          node --test --experimental-strip-types test/*.test.ts

  # ── TS example: hackernews ───────────────────────────────────────────────
  build-example-hackernews:
    name: Build TS example (hackernews)
    needs: build-sdk-ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/download-artifact@v4
        with:
          name: sdk-ts-dist
          path: projects/sdk-ts/

      - name: Install SDK tarball + build example
        working-directory: projects/examples/hackernews
        run: |
          set -euo pipefail
          npm install ../../sdk-ts/orca-sdk-*.tgz --no-save
          npm install
          npm run build
          rm -rf node_modules
          npm install --omit=dev
          npm install ../../sdk-ts/orca-sdk-*.tgz --no-save --omit=dev
          mkdir -p ../../../staging
          tar czf ../../../staging/orca-example-hackernews.tgz \
            dist package.json node_modules
          ( cd ../../../staging && sha256sum orca-example-hackernews.tgz \
              > orca-example-hackernews.tgz.sha256 )

      - uses: actions/upload-artifact@v4
        with:
          name: example-hackernews
          path: |
            projects/examples/hackernews/dist/
            projects/examples/hackernews/package.json
            projects/examples/hackernews/package-lock.json
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: orca-example-hackernews
          path: staging/orca-example-hackernews.tgz*
          retention-days: 7

  test-example-hackernews:
    name: Test TS example (hackernews)
    needs: build-example-hackernews
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/download-artifact@v4
        with:
          name: example-hackernews
          path: hackernews/

      - uses: actions/download-artifact@v4
        with:
          name: sdk-ts-dist
          path: sdk-ts/

      - name: Install runtime deps + SDK tarball
        working-directory: hackernews
        run: |
          set -euo pipefail
          npm ci --omit=dev
          npm install ../sdk-ts/orca-sdk-*.tgz --no-save --omit=dev

      - name: Smoke test built artifact
        working-directory: hackernews
        run: |
          set -euo pipefail
          test -f dist/index.js
          node --check dist/index.js
          node -e "require.resolve('@orca/sdk', { paths: ['$(pwd)'] })"

  # ── Go SDK ───────────────────────────────────────────────────────────────
  build-sdk-go:
    name: Build Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: projects/sdk-go/go.sum

      - name: gofmt
        working-directory: projects/sdk-go
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "Unformatted Go files:"; echo "$diff"; exit 1
          fi

      - name: Compile packages + test binaries
        working-directory: projects/sdk-go
        run: |
          set -euo pipefail
          go build ./...
          mkdir -p ../../sdk-go-tests
          for pkg in $(go list ./...); do
            name=$(echo "$pkg" | tr '/' '_').test
            go test -c -o "../../sdk-go-tests/${name}" "$pkg" || true
          done
          ls -lh ../../sdk-go-tests/

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-go-tests
          path: sdk-go-tests/
          retention-days: 7

  test-sdk-go:
    name: Test Go SDK
    needs: build-sdk-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdk-go-tests
          path: sdk-go-tests/

      - name: Run prebuilt test binaries
        run: |
          set -euo pipefail
          chmod +x sdk-go-tests/*.test || true
          for t in sdk-go-tests/*.test; do
            [ -f "$t" ] || continue
            echo "── $t ──"
            "./$t" -test.v
          done

  # ── Go example: adguard-home (cross-compiled matrix) ─────────────────────
  build-example-adguard-home:
    name: Build Go example (adguard-home) ${{ matrix.os }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: projects/sdk-go/go.sum

      - name: Cross-compile
        working-directory: projects/examples/adguard-home
        run: |
          set -euo pipefail
          asset="orca-example-adguard-home-${{ matrix.os }}-${{ matrix.arch }}"
          GOOS="${{ matrix.os }}" GOARCH="${{ matrix.arch }}" GOFLAGS=-mod=mod \
            go build -trimpath -ldflags="-s -w" -o "../../../${asset}" .
          cd ../../..
          sha256sum "${asset}" > "${asset}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: orca-example-adguard-home-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            orca-example-adguard-home-${{ matrix.os }}-${{ matrix.arch }}
            orca-example-adguard-home-${{ matrix.os }}-${{ matrix.arch }}.sha256
          retention-days: 7

  test-example-adguard-home:
    name: Test Go example (adguard-home)
    needs: build-example-adguard-home
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: orca-example-adguard-home-linux-amd64

      - name: Smoke test linux/amd64 binary
        run: |
          set -euo pipefail
          bin="orca-example-adguard-home-linux-amd64"
          chmod +x "$bin"
          test -s "$bin"
          file "$bin"
          file "$bin" | grep -q ELF
          ./"$bin" --help >/dev/null 2>&1 \
            || ./"$bin" --version >/dev/null 2>&1 \
            || true

  # ── Kotlin SDK ───────────────────────────────────────────────────────────
  build-sdk-kotlin:
    name: Build Kotlin SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (no test)
        working-directory: projects/sdk-kotlin
        run: gradle --no-daemon build -x test

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-kotlin-jar
          path: |
            projects/sdk-kotlin/build/libs/
            projects/sdk-kotlin/build/classes/
          retention-days: 7

  test-sdk-kotlin:
    name: Test Kotlin SDK
    needs: build-sdk-kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with:
          name: sdk-kotlin-jar
          path: projects/sdk-kotlin/build/

      - name: Test against prebuilt classes
        working-directory: projects/sdk-kotlin
        run: gradle --no-daemon test

  # ── Kotlin example: github-releases ──────────────────────────────────────
  build-example-github-releases:
    name: Build Kotlin example (github-releases)
    needs: build-sdk-kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with:
          name: sdk-kotlin-jar
          path: projects/sdk-kotlin/build/

      - name: Build fat-JAR
        working-directory: projects/examples/github-releases
        run: |
          set -euo pipefail
          gradle --no-daemon appJar
          src=$(printf '%s\n' build/libs/*-all.jar | head -1)
          asset="../../../orca-example-github-releases.jar"
          cp "$src" "$asset"
          ( cd ../../.. && sha256sum orca-example-github-releases.jar \
              > orca-example-github-releases.jar.sha256 )

      - uses: actions/upload-artifact@v4
        with:
          name: orca-example-github-releases
          path: |
            orca-example-github-releases.jar
            orca-example-github-releases.jar.sha256
          retention-days: 7

  test-example-github-releases:
    name: Test Kotlin example (github-releases)
    needs: build-example-github-releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/download-artifact@v4
        with:
          name: orca-example-github-releases

      - name: Smoke test fat-JAR
        run: |
          set -euo pipefail
          jar="orca-example-github-releases.jar"
          test -s "$jar"
          unzip -l "$jar" | head
          unzip -l "$jar" | grep -qE '\.class$'
          java -jar "$jar" --help >/dev/null 2>&1 \
            || java -jar "$jar" --version >/dev/null 2>&1 \
            || true

  # ── Frontend ─────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: projects/frontend/package-lock.json

      - name: Install + build
        working-directory: projects/frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: projects/frontend/dist/
          retention-days: 7

  test-frontend:
    name: Test Frontend
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: projects/frontend/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: projects/frontend/dist/

      - name: Install + check + test
        working-directory: projects/frontend
        run: |
          npm ci
          npm run check
          npm run test:run

      - name: Assert built artifact exists
        run: test -f projects/frontend/dist/index.html

  # ── Compute next RC + stable versions ────────────────────────────────────
  version:
    name: Compute version
    needs:
      - lint-rust
      - test-rust
      - test-sdk-ts
      - test-example-hackernews
      - test-sdk-go
      - test-example-adguard-home
      - test-sdk-kotlin
      - test-example-github-releases
      - test-frontend
    runs-on: ubuntu-latest
    outputs:
      stable_version: ${{ steps.bump.outputs.stable_version }}
      stable_tag:     ${{ steps.bump.outputs.stable_tag }}
      rc_version:     ${{ steps.bump.outputs.rc_version }}
      rc_tag:         ${{ steps.bump.outputs.rc_tag }}
      previous_stable: ${{ steps.bump.outputs.previous_stable }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: bump
        run: |
          set -euo pipefail
          git fetch --tags --quiet

          BUMP="${{ inputs.bump }}"

          # Find latest stable tag (vX.Y.Z, no suffix).
          # `grep || true` so a fresh repo with no tags doesn't trip pipefail.
          LATEST_STABLE=$(git tag -l 'v[0-9]*' \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
            | sort -V | tail -1)
          LATEST_STABLE=${LATEST_STABLE:-v0.0.0}

          IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST_STABLE#v}"
          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          NEXT_STABLE="${MAJOR}.${MINOR}.${PATCH}"

          # Auto-increment RC number for this stable target.
          LATEST_RC=$(git tag -l "v${NEXT_STABLE}-rc.*" | sort -V | tail -1)
          if [ -z "$LATEST_RC" ]; then
            N=1
          else
            N=${LATEST_RC##*rc.}
            N=$((N+1))
          fi

          RC_VERSION="${NEXT_STABLE}-rc.${N}"

          echo "Latest stable : $LATEST_STABLE"
          echo "Next stable   : v${NEXT_STABLE}"
          echo "Next RC       : v${RC_VERSION}"

          {
            echo "stable_version=$NEXT_STABLE"
            echo "stable_tag=v${NEXT_STABLE}"
            echo "rc_version=$RC_VERSION"
            echo "rc_tag=v${RC_VERSION}"
            echo "previous_stable=$LATEST_STABLE"
          } >> "$GITHUB_OUTPUT"

  # ── Publish RC (manual approval) ─────────────────────────────────────────
  publish-rc:
    name: Publish RC (gate)
    needs: version
    runs-on: ubuntu-latest
    environment:
      name: release-rc
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.version.outputs.rc_tag }}
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Drop non-release artifacts from publish set
        run: |
          set -euo pipefail
          # The rust-target-* and sdk-*-tests artifacts are CI-internal; they
          # must not be uploaded to the GitHub release.
          rm -f artifacts/target-*.tar
          rm -rf artifacts/sdk-go-tests || true
          ls -lh artifacts/

      - name: Merge checksums
        run: cat artifacts/*.sha256 > artifacts/checksums.sha256

      - name: Write RC version to Cargo.toml
        run: |
          NEW="${{ needs.version.outputs.rc_version }}"
          TOML=projects/server/Cargo.toml
          CURRENT=$(grep '^version' "$TOML" | head -1 | sed 's/version = "\(.*\)"/\1/')
          sed -i "0,/^version = \"${CURRENT}\"/s//version = \"${NEW}\"/" "$TOML"
          cargo update -p orca --precise "$NEW" 2>/dev/null || cargo update -p orca || true

      - name: Commit and tag RC
        id: tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add projects/server/Cargo.toml Cargo.lock
          git diff --cached --quiet || git commit -m "chore: release ${{ needs.version.outputs.rc_tag }}"
          git tag -a "${{ needs.version.outputs.rc_tag }}" -m "orca ${{ needs.version.outputs.rc_tag }}"
          git push origin HEAD --tags
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate RC changelog
        run: |
          PREV="${{ needs.version.outputs.previous_stable }}"
          NEW="${{ needs.version.outputs.rc_tag }}"

          [ "$PREV" = "v0.0.0" ] && RANGE="HEAD" || RANGE="${PREV}..HEAD"
          COMMITS=$(git log "$RANGE" --pretty=format:"%s" \
            | grep -v '^chore: release v' | head -100)

          section() {
            local title="$1"; shift
            local items=""
            for prefix in "$@"; do
              items="$items$(echo "$COMMITS" | grep -i "^${prefix}[:(]" | sed 's/^/- /' || true)"$'\n'
            done
            [ -n "$(echo "$items" | tr -d '[:space:]')" ] && printf "### %s\n%s\n" "$title" "$items"
          }

          EXTRA="${{ inputs.notes }}"
          HEADER=""
          [ -n "$EXTRA" ] && HEADER="${EXTRA}\n\n---\n\n"
          HEADER="${HEADER}> **Pre-release** \`rc\` — pending stable promotion approval.\n\n"

          BODY="${HEADER}## What's Changed\n\n"
          BODY="${BODY}$(section 'Features'    feat feature)"
          BODY="${BODY}$(section 'Bug Fixes'   fix bug)"
          BODY="${BODY}$(section 'Performance' perf)"
          BODY="${BODY}$(section 'Refactoring' refactor refact)"
          BODY="${BODY}$(section 'Build / CI'  build ci chore)"
          BODY="${BODY}$(section 'Docs'        docs)"

          COUNT=$(printf "%b" "$BODY" | grep -c '^- ' || true)
          if [ "${COUNT:-0}" -eq 0 ]; then
            BODY="${HEADER}## What's Changed\n\n$(echo "$COMMITS" | head -50 | sed 's/^/- /')\n\n"
          fi

          REPO="${{ github.repository }}"
          BODY="${BODY}\n## Installation\n\n\`\`\`sh\n"
          BODY="${BODY}# Apple Silicon\ncurl -Lo orca https://github.com/${REPO}/releases/download/${NEW}/orca-aarch64-apple-darwin\n\n"
          BODY="${BODY}chmod +x orca && mv orca ~/.local/bin/orca\nxattr -d com.apple.quarantine ~/.local/bin/orca\n\`\`\`\n\n"
          BODY="${BODY}**Full diff:** [$PREV → $NEW](https://github.com/${REPO}/compare/${PREV}...${NEW})"

          printf "%b" "$BODY" > /tmp/changelog.md

      - name: Create RC release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.rc_tag }}
          name: orca ${{ needs.version.outputs.rc_tag }}
          body_path: /tmp/changelog.md
          prerelease: true
          # `orca-*` glob covers both the orca server binaries and the
          # `orca-example-*` plugin artifacts.
          files: |
            artifacts/orca-*
            artifacts/checksums.sha256

  # ── Promote to stable (manual approval) ──────────────────────────────────
  publish-stable:
    name: Publish stable (gate)
    needs: [version, publish-rc]
    runs-on: ubuntu-latest
    environment:
      name: release-stable
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.version.outputs.stable_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull RC commit
        run: git fetch origin && git checkout ${{ needs.publish-rc.outputs.commit }}

      - name: Download RC artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          # `orca-*` covers both the orca server binaries and the
          # `orca-example-*` plugin assets uploaded with the RC.
          gh release download "${{ needs.version.outputs.rc_tag }}" \
            --dir artifacts \
            --pattern "orca-*" \
            --pattern "checksums.sha256"
          ls -lh artifacts/

      - name: Write stable version to Cargo.toml
        run: |
          NEW="${{ needs.version.outputs.stable_version }}"
          TOML=projects/server/Cargo.toml
          CURRENT=$(grep '^version' "$TOML" | head -1 | sed 's/version = "\(.*\)"/\1/')
          sed -i "0,/^version = \"${CURRENT}\"/s//version = \"${NEW}\"/" "$TOML"

      - name: Commit and tag stable
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B main
          git add projects/server/Cargo.toml
          git diff --cached --quiet || git commit -m "chore: release ${{ needs.version.outputs.stable_tag }}"
          git tag -a "${{ needs.version.outputs.stable_tag }}" \
            -m "orca ${{ needs.version.outputs.stable_tag }} (promoted from ${{ needs.version.outputs.rc_tag }})"
          git push origin HEAD:main --tags

      - name: Generate stable changelog
        run: |
          STABLE="${{ needs.version.outputs.stable_tag }}"
          RC="${{ needs.version.outputs.rc_tag }}"
          PREV="${{ needs.version.outputs.previous_stable }}"

          [ "$PREV" = "v0.0.0" ] && RANGE="HEAD" || RANGE="${PREV}..HEAD"
          COMMITS=$(git log "$RANGE" --pretty=format:"%s" | head -100)

          section() {
            local title="$1"; shift
            local items=""
            for prefix in "$@"; do
              items="$items$(echo "$COMMITS" | grep -i "^${prefix}[:(]" | sed 's/^/- /' || true)"$'\n'
            done
            [ -n "$(echo "$items" | tr -d '[:space:]')" ] && printf "### %s\n%s\n" "$title" "$items"
          }

          EXTRA="${{ inputs.notes }}"
          HEADER=""; [ -n "$EXTRA" ] && HEADER="${EXTRA}\n\n---\n\n"
          HEADER="${HEADER}> Promoted from \`${RC}\`. Binaries are identical.\n\n"

          BODY="${HEADER}## What's Changed\n\n"
          BODY="${BODY}$(section 'Features'    feat feature)"
          BODY="${BODY}$(section 'Bug Fixes'   fix bug)"
          BODY="${BODY}$(section 'Performance' perf)"
          BODY="${BODY}$(section 'Refactoring' refactor refact)"
          BODY="${BODY}$(section 'Build / CI'  build ci chore)"
          BODY="${BODY}$(section 'Docs'        docs)"

          COUNT=$(printf "%b" "$BODY" | grep -c '^- ' || true)
          if [ "${COUNT:-0}" -eq 0 ]; then
            BODY="${HEADER}## What's Changed\n\n$(echo "$COMMITS" | head -50 | sed 's/^/- /')\n\n"
          fi

          REPO="${{ github.repository }}"
          BODY="${BODY}\n## Installation\n\n\`\`\`sh\n# Apple Silicon\ncurl -Lo orca https://github.com/${REPO}/releases/download/${STABLE}/orca-aarch64-apple-darwin\n\nchmod +x orca && mv orca ~/.local/bin/orca\nxattr -d com.apple.quarantine ~/.local/bin/orca\n\`\`\`\n\n"
          BODY="${BODY}**Full diff:** [$PREV → $STABLE](https://github.com/${REPO}/compare/${PREV}...${STABLE})"

          printf "%b" "$BODY" > /tmp/changelog.md

      - name: Create stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.stable_tag }}
          name: orca ${{ needs.version.outputs.stable_tag }}
          body_path: /tmp/changelog.md
          prerelease: false
          files: |
            artifacts/orca-*
            artifacts/checksums.sha256

      - name: Mark RC as superseded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STABLE="${{ needs.version.outputs.stable_tag }}"
          RC="${{ needs.version.outputs.rc_tag }}"
          gh release edit "$RC" \
            --notes "> **Superseded** — promoted to stable [$STABLE](https://github.com/${{ github.repository }}/releases/tag/${STABLE})." \
            --prerelease
