name: Release

# Orca's release runs on the SHARED Gitea-native pipeline in argyle-labs/.github
# (see [[unified-cicd-pipeline-architecture]]). This file is a thin caller — all
# build/package/publish logic lives in the shared reusable release.yml.
#
# This file owns the GATED release stages ONLY, triggered by operator dispatch:
#   dispatch rc-publish     → cut vX.Y.Z-rc.N → Gitea Releases (canonical) → mirror GitHub
#   dispatch promote-stable → cut vX.Y.Z stable → Gitea → mirror GitHub
#
# The rolling rc-draft on push→main lives in release-draft.yml. Triggers are
# split across two files ON PURPOSE: Gitea does not reliably honor job-level `if`
# on reusable-workflow caller jobs, so a single file with both triggers risks
# firing an rc-publish on every push. One unambiguous trigger per file.
#
# Gates = the operator dispatch itself (Gitea has no environment: reviewers).

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Release gate'
        type: choice
        options: [rc-publish, promote-stable]
        default: rc-publish
      bump:
        description: 'Version bump from latest stable tag'
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  release:
    uses: argyle-labs/.github/.github/workflows/release.yml@main
    with:
      stage: ${{ inputs.stage }}
      bump: ${{ inputs.bump }}
      asset-profile: full
      # Ship ONLY the orca daemon. The workspace also has a `uniffi-bindgen`
      # helper bin (in app-kit); without this the shared pipeline's derive-all-
      # bins logic tries to build it as a release artifact and fails with
      # "no bin target named `uniffi-bindgen` in default-run packages".
      bins: '["orca"]'
      # Orca's proven target set (aarch64-linux + x86_64-darwin can be added later).
      targets: '["x86_64-unknown-linux-gnu","x86_64-unknown-linux-musl","aarch64-apple-darwin"]'
    secrets: inherit
