name: _build-orca-matrix
# Reusable workflow — builds every orca target with a given version baked into
# Cargo.toml. Called from release.yml for both the RC build and (after promote
# approval) the stable rebuild, so RC and stable share one definition.
#
# All build logic lives in .github/actions/build-orca-target, which in turn
# calls scripts/release-lib.sh. Same library used by scripts/release-local.sh.

on:
  workflow_call:
    inputs:
      version:
        description: Version to bake into Cargo.toml (e.g. 0.0.4-rc.1 or 0.0.4).
        required: true
        type: string
      artifact-suffix:
        description: Suffix appended to per-target artifact names (e.g. "" or "-stable").
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        # Gitea Actions runners (releases are cut on Gitea, the canonical forge).
        # `runner` is a PLAIN label, consumed as `runs-on: ${{ matrix.runner }}`
        # — NOT wrapped in fromJSON(): Gitea's act_runner mis-resolves
        # `fromJSON(matrix.runner)` to a bogus "Array" label, so those jobs queue
        # forever with no matching runner. Labels must match REGISTERED runners:
        #   • ubuntu-latest — the Linux Gitea runner (x86_64 gnu+musl).
        #   • macos         — the mint macOS arm64 runner (aarch64-apple-darwin).
        # arm64-linux is intentionally not built — not shipped; add a native row
        # if it is ever needed.
        include:
          - runner: macos
            target: aarch64-apple-darwin
          # x86_64-apple-darwin temporarily disabled — no Intel-mac consumer in
          # the fleet right now, so we skip the cross-build to save runner time.
          # Re-enable this row when an Intel macOS host rejoins.
          # - runner: macos
          #   target: x86_64-apple-darwin
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift
          sudo docker image prune -af || true
          df -h

      - uses: ./.github/actions/setup-rust-release
        with:
          target: ${{ matrix.target }}

      - id: build
        uses: ./.github/actions/build-orca-target
        with:
          version: ${{ inputs.version }}
          target:  ${{ matrix.target }}

      - uses: actions/upload-artifact@v3
        with:
          name: orca-${{ matrix.target }}${{ inputs.artifact-suffix }}
          path: |
            ${{ steps.build.outputs.asset-path }}
            ${{ steps.build.outputs.checksum-path }}
          retention-days: 7
