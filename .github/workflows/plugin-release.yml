name: Plugin Release

# Reusable release pipeline for a STANDALONE single-crate orca plugin repo.
#
# Adapted from orca's release-plugin.yml (the in-tree per-plugin release job)
# for a one-crate-per-repo layout: the plugin id IS the repo name, and the tag
# scheme drops the plugin prefix — `v<version>` (stable) or
# `v<version>-<channel>.N` (pre-release). Examples:
#   v0.1.0
#   v0.1.0-rc.1
#   v0.1.0-alpha.3
#
# Branch routing mirrors orca's release.yml:
#   • RCs / pre-releases (alpha/beta/rc) are cut from `stage`.
#   • stable releases are cut from `main`.
# The guard job enforces this; anything else fails fast.
#
# Plugin repos call this from .github/workflows/release.yml via:
#   uses: argyle-labs/orca/.github/workflows/plugin-release.yml@main
# with `secrets: inherit` (needs GITHUB_TOKEN to tag + publish the release).

on:
  workflow_call:
    inputs:
      bump:
        description: Version bump from latest stable (patch | minor | major).
        required: true
        type: string
        default: patch
      channel:
        description: Release channel (stable | alpha | beta | rc).
        required: true
        type: string
        default: rc
      notes:
        description: Extra release notes (optional, prepended to changelog).
        required: false
        type: string
      working-directory:
        description: Crate directory to build (default repo root).
        required: false
        type: string
        default: '.'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  # ── Branch guard ─────────────────────────────────────────────────────────
  # Pre-releases come from `stage`, stable releases from `main` — same model
  # as orca's release.yml. Anything else is an operator mistake.
  guard:
    name: Guard release branch
    runs-on: ubuntu-latest
    steps:
      - name: Require stage (pre-release) or main (stable)
        run: |
          set -euo pipefail
          ref='${{ github.ref_name }}'
          channel='${{ inputs.channel }}'
          case "$ref:$channel" in
            main:stable)          echo "✓ stable release from main" ;;
            stage:alpha|stage:beta|stage:rc)
                                  echo "✓ $channel pre-release from stage" ;;
            main:*)               echo "::error::main only cuts 'stable' releases, got channel '$channel'"; exit 1 ;;
            stage:stable)         echo "::error::stable releases must run on 'main', not 'stage'"; exit 1 ;;
            *)                    echo "::error::plugin-release must run on 'stage' (pre-release) or 'main' (stable), got ref '$ref'"; exit 1 ;;
          esac

  # ── Compute version from existing v* tags ────────────────────────────────
  # Pure git-tag math (no orca scripts/ dependency — this runs in a standalone
  # plugin repo). Tag scheme: v<version> (stable) / v<version>-<channel>.N.
  version:
    name: Compute version
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      version:    ${{ steps.bump.outputs.version }}
      tag:        ${{ steps.bump.outputs.tag }}
      previous:   ${{ steps.bump.outputs.previous }}
      prerelease: ${{ steps.bump.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute version
        id: bump
        env:
          BUMP:    ${{ inputs.bump }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          git fetch --tags --quiet

          # Latest stable tag of the form vMAJOR.MINOR.PATCH (no suffix).
          LATEST_STABLE=$(git tag -l "v[0-9]*" \
            | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+$" \
            | sort -V | tail -1 || true)
          LATEST_STABLE=${LATEST_STABLE:-v0.0.0}
          PREV_VERSION=${LATEST_STABLE#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$PREV_VERSION"

          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
            *) echo "::error::invalid bump '$BUMP'"; exit 1 ;;
          esac
          NEXT_STABLE="${MAJOR}.${MINOR}.${PATCH}"

          if [ "$CHANNEL" = "stable" ]; then
            VERSION="$NEXT_STABLE"
            PRERELEASE=false
          else
            LATEST_PRE=$(git tag -l "v${NEXT_STABLE}-${CHANNEL}.*" | sort -V | tail -1 || true)
            if [ -z "$LATEST_PRE" ]; then
              N=1
            else
              N=$(echo "$LATEST_PRE" | sed "s/.*${CHANNEL}\.//")
              N=$((N+1))
            fi
            VERSION="${NEXT_STABLE}-${CHANNEL}.${N}"
            PRERELEASE=true
          fi
          TAG="v${VERSION}"

          echo "Latest stable : $LATEST_STABLE"
          echo "Next tag      : $TAG"
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "previous=$LATEST_STABLE"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

  # ── Build the crate across 4 targets ─────────────────────────────────────
  # x86_64 + aarch64 for linux + darwin. The binary name is derived from the
  # repo (plugin id = repo name): orca-plugin-<repo>.
  build:
    name: Build ${{ matrix.target }}
    needs: [guard, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu,  asset_os: linux,  asset_arch: amd64 }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, asset_os: linux,  asset_arch: arm64 }
          - { os: macos-latest,  target: x86_64-apple-darwin,       asset_os: darwin, asset_arch: amd64 }
          - { os: macos-latest,  target: aarch64-apple-darwin,      asset_os: darwin, asset_arch: arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ inputs.working-directory }}
          shared-key: release-${{ matrix.target }}
          cache-on-failure: true

      - name: Install cross-linker for aarch64-linux
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build
        env:
          PLUGIN:     ${{ github.event.repository.name }}
          TARGET:     ${{ matrix.target }}
          ASSET_OS:   ${{ matrix.asset_os }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail
          mkdir -p staging
          cargo build --release --locked --target "$TARGET"
          BIN_NAME="orca-plugin-${PLUGIN}"
          ASSET="orca-plugin-${PLUGIN}-${ASSET_OS}-${ASSET_ARCH}"
          cp "target/${TARGET}/release/${BIN_NAME}" "staging/${ASSET}"
          ( cd staging && shasum -a 256 "$ASSET" > "${ASSET}.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: ${{ inputs.working-directory }}/staging/*
          retention-days: 7

  # ── Publish: tag + create the GitHub release ─────────────────────────────
  # GITEA: replace on migration — this whole job is the only GitHub-API-specific
  # surface. `softprops/action-gh-release` talks to the GitHub Releases API;
  # swap it for the Gitea release-creation equivalent (the tag/checkout/
  # changelog steps above it are portable). Kept isolated as a single job so
  # the migration is a one-job replacement.
  publish:
    name: Tag + publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Merge checksums
        run: |
          set -euo pipefail
          cat artifacts/*.sha256 > artifacts/checksums.sha256
          ls -lh artifacts/

      - name: Generate changelog
        env:
          PREVIOUS: ${{ needs.version.outputs.previous }}
          TAG:      ${{ needs.version.outputs.tag }}
          NOTES:    ${{ inputs.notes }}
          CHANNEL:  ${{ inputs.channel }}
          PLUGIN:   ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          if [ "$PREVIOUS" = "v0.0.0" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREVIOUS}..HEAD"
          fi
          COMMITS=$(git log "$RANGE" --pretty=format:"%s" | head -100 || true)
          {
            if [ -n "$NOTES" ]; then
              printf "%s\n\n---\n\n" "$NOTES"
            fi
            if [ "$CHANNEL" != "stable" ]; then
              printf "> **Pre-release** \`%s\` — pending stable promotion.\n\n" "$CHANNEL"
            fi
            printf "## Changes since %s\n\n" "$PREVIOUS"
            if [ -z "$COMMITS" ]; then
              echo "_No commits since the previous tag._"
            else
              echo "$COMMITS" | sed 's/^/- /'
            fi
            printf "\n## Install\n\nDownload the asset matching your OS/arch below; mark executable; place under \`~/.orca/plugins/%s/bin/\` (or let your orca instance install it via the plugin install flow).\n" "$PLUGIN"
          } > /tmp/changelog.md

      - name: Tag release commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.version.outputs.tag }}" -m "${{ github.event.repository.name }} ${{ needs.version.outputs.tag }}"
          git push origin "refs/tags/${{ needs.version.outputs.tag }}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:         ${{ needs.version.outputs.tag }}
          name:             ${{ needs.version.outputs.tag }}
          body_path:        /tmp/changelog.md
          prerelease:       ${{ needs.version.outputs.prerelease }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/orca-plugin-*
            artifacts/checksums.sha256
