name: Release Draft

# Rolling rc-draft on push→main: the shared Gitea-native pipeline builds all
# release assets into a rolling DRAFT Gitea release (no tag, nothing published)
# so main is always release-ready. Logic lives in the shared reusable
# release.yml in argyle-labs/.github (see [[unified-cicd-pipeline-architecture]]).
#
# This is the ONLY file triggered on push. The gated rc-publish / promote-stable
# stages live in release.yml (workflow_dispatch only). Triggers are split across
# two files because Gitea does not reliably honor job-level `if` on
# reusable-workflow caller jobs — a single combined file risks firing rc-publish
# on every push. One unambiguous trigger per file.

# TEMPORARILY push-disabled: the rolling rc-draft on every merge was flooding the
# runners and competing with the gated rc-publish for capacity while we stabilise
# the pipeline. Manual-only (workflow_dispatch) for now; restore `push` below once
# rc.9 has published cleanly.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

jobs:
  rc-draft:
    uses: argyle-labs/.github/.github/workflows/release.yml@main
    with:
      stage: rc-draft
      asset-profile: full
      # Build the macOS .pkg on our mint mac runner (label `macos`).
      # Without this the shared pipeline skips package-macos-pkg.
      mint-runner-label: macos
      # Ship ONLY the orca daemon (see release.yml — avoids building the
      # app-kit `uniffi-bindgen` helper bin as a release artifact).
      bins: '["orca"]'
      # Linux targets only. The aarch64-apple-darwin binary is built NATIVELY on
      # the mac runner leg (mint-runner-label) — the zigbuild cross-compile emits
      # a duplicate-libiconv Mach-O that macOS dyld refuses to load.
      targets: '["x86_64-unknown-linux-gnu","x86_64-unknown-linux-musl"]'
    secrets: inherit
