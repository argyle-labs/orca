name: Sync plugin catalog

# Keeps projects/system/src/plugin_catalog.json in sync with the argyle-labs org.
# A public, non-archived repo is a first-party plugin iff its root Cargo.toml
# declares `[package.metadata.orca]` — the catalog is DERIVED from that marker,
# never hand-maintained. Runs on a schedule (and on demand / on repository_dispatch
# when a plugin repo is created or cuts a release) and opens a PR when the catalog
# drifts from reality. Main is protected, so it never pushes directly.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {}
  repository_dispatch:
    types: [plugin-catalog-sync]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-plugin-catalog
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate catalog from the org
        env:
          GITEA_TOKEN: ${{ secrets.ORCA_FETCH_TOKEN }}
          GITEA_API_URL: https://gitea.scottkey.me/api/v1
        run: python3 scripts/gen-plugin-catalog.py

      - name: Open PR if the catalog changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/sync-plugin-catalog
          base: main
          commit-message: "chore: sync plugin catalog with argyle-labs org"
          title: "chore: sync plugin catalog"
          body: |
            Automated sync of `projects/system/src/plugin_catalog.json` from the
            argyle-labs org (public, non-archived repos declaring
            `[package.metadata.orca]`). `status` is derived from each repo's
            stable release (`available`) vs prerelease-only/none (`unreleased`).

            Generated by `.github/workflows/sync-plugin-catalog.yml`
            (`scripts/gen-plugin-catalog.py`). Review the diff before merging.
          author: "Scott Key <scottdkey@gmail.com>"
          committer: "Scott Key <scottdkey@gmail.com>"
          delete-branch: true
          add-paths: projects/system/src/plugin_catalog.json
