name: Sync plugin catalog

# Keeps projects/system/src/plugin_catalog.json in sync with the argyle-labs org.
# A public, non-archived repo is a first-party plugin iff its root Cargo.toml
# declares `[package.metadata.orca]` — the catalog is DERIVED from that marker,
# never hand-maintained. Runs on a schedule (and on demand / on repository_dispatch
# when a plugin repo is created or cuts a release) and opens a PR when the catalog
# drifts from reality. Main is protected, so it never pushes directly.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {}
  repository_dispatch:
    types: [plugin-catalog-sync]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-plugin-catalog
  cancel-in-progress: true

jobs:
  sync:
    # Run on the canonical forge (Gitea) only. `github.server_url` is
    # https://gitea.scottkey.me on Gitea and https://github.com on the mirror,
    # where the schedule would otherwise fire against the Gitea API with no
    # matching context.
    if: ${{ !endsWith(github.server_url, 'github.com') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate catalog from the org
        env:
          GITEA_TOKEN: ${{ secrets.ORCA_FETCH_TOKEN }}
          GITEA_API_URL: https://gitea.scottkey.me/api/v1
        run: python3 scripts/gen-plugin-catalog.py

      - name: Open PR if the catalog changed
        env:
          GITEA_TOKEN: ${{ secrets.ORCA_RELEASE_TOKEN }}
          GITEA_API_URL: https://gitea.scottkey.me/api/v1
        run: |
          set -euo pipefail

          # Nothing to sync — the catalog already matches the org. Job succeeds.
          if git diff --quiet -- projects/system/src/plugin_catalog.json; then
            echo "plugin_catalog.json unchanged; nothing to sync."
            exit 0
          fi

          git config user.name "Scott Key"
          git config user.email "scottdkey@gmail.com"

          branch=chore/sync-plugin-catalog
          git checkout -B "$branch"
          git add projects/system/src/plugin_catalog.json
          git commit -m "chore: sync plugin catalog with argyle-labs org"

          # Token-authenticated remote (main is protected — only ever push a branch).
          git push --force "https://${GITEA_TOKEN}@gitea.scottkey.me/argyle-labs/orca.git" "$branch"

          # Open a PR; an already-existing PR (409/422) just tracks the branch we
          # updated above and is not a failure.
          body='Automated sync of `projects/system/src/plugin_catalog.json` from the argyle-labs Gitea org (non-archived repos declaring `[package.metadata.orca]` or `[workspace.metadata.orca]`). `status` is derived from each repo'"'"'s stable release (`available`) vs prerelease-only/none (`unreleased`). Generated by `.github/workflows/sync-plugin-catalog.yml` (`scripts/gen-plugin-catalog.py`). Review the diff before merging.'
          payload=$(printf '{"head":"%s","base":"main","title":"chore: sync plugin catalog","body":"%s"}' "$branch" "$body")
          code=$(curl -sS -o /tmp/pr-resp.json -w '%{http_code}' \
            -X POST "${GITEA_API_URL:-https://gitea.scottkey.me/api/v1}/repos/argyle-labs/orca/pulls" \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "$payload")
          echo "Gitea pulls API returned HTTP $code"
          if [ "$code" = "201" ]; then
            echo "Opened PR."
          elif [ "$code" = "409" ] || [ "$code" = "422" ]; then
            echo "PR already exists for $branch; it now tracks the updated branch."
          else
            echo "Unexpected response:"; cat /tmp/pr-resp.json; exit 1
          fi
