name: Promote — orca

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Pre-release tag to promote (e.g. v0.2.0-rc.2)"
        required: true
        type: string
      notes:
        description: "Additional release notes (optional)"
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  promote:
    name: Promote ${{ inputs.tag }} → stable
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate pre-release tag
        id: validate
        run: |
          TAG="${{ inputs.tag }}"

          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$'; then
            echo "ERROR: '$TAG' is not a valid pre-release tag (expected vX.Y.Z-{alpha|beta|rc}.N)"
            exit 1
          fi

          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "ERROR: tag '$TAG' does not exist"
            exit 1
          fi

          STABLE=$(echo "$TAG" | sed 's/-[a-z]*\.[0-9]*$//')

          if git rev-parse "$STABLE" >/dev/null 2>&1; then
            echo "ERROR: stable tag '$STABLE' already exists"
            exit 1
          fi

          COMMIT=$(git rev-parse "$TAG^{}")
          STABLE_VERSION=${STABLE#v}

          echo "pre_tag=$TAG"              >> $GITHUB_OUTPUT
          echo "stable=$STABLE"            >> $GITHUB_OUTPUT
          echo "stable_version=$STABLE_VERSION" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT"            >> $GITHUB_OUTPUT
          echo "Promoting $TAG → $STABLE at $COMMIT"

      - name: Download pre-release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          gh release download "${{ steps.validate.outputs.pre_tag }}" \
            --dir artifacts \
            --pattern "orca-*" \
            --pattern "checksums.sha256"
          echo "Downloaded:"
          ls -lh artifacts/

      - name: Recompute checksums
        run: |
          cd artifacts
          cat *.sha256 > checksums.sha256 2>/dev/null || sha256sum orca-* > checksums.sha256
          cat checksums.sha256

      - name: Write stable version to Cargo.toml
        run: |
          STABLE_VERSION="${{ steps.validate.outputs.stable_version }}"
          TOML=projects/server/Cargo.toml
          CURRENT=$(grep '^version' "$TOML" | head -1 | sed 's/version = "\(.*\)"/\1/')
          sed -i "0,/^version = \"${CURRENT}\"/s//version = \"${STABLE_VERSION}\"/" "$TOML"

      - name: Generate changelog
        id: changelog
        run: |
          STABLE="${{ steps.validate.outputs.stable }}"
          PRE_TAG="${{ steps.validate.outputs.pre_tag }}"

          PREV_STABLE=$(git tag -l 'v[0-9]*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | grep -v "^${STABLE}$" | tail -1)
          PREV_STABLE=${PREV_STABLE:-v0.0.0}

          [ "$PREV_STABLE" = "v0.0.0" ] && RANGE="HEAD" || RANGE="${PREV_STABLE}..HEAD"
          COMMITS=$(git log "$RANGE" --pretty=format:"%s" | head -100)

          section() {
            local title="$1"; shift
            local items=""
            for prefix in "$@"; do
              items="$items$(echo "$COMMITS" | grep -i "^${prefix}[:(]" | sed 's/^/- /' || true)"
            done
            [ -n "$(echo "$items" | tr -d '[:space:]')" ] && printf "### %s\n%s\n\n" "$title" "$items"
          }

          EXTRA="${{ inputs.notes }}"
          HEADER=""; [ -n "$EXTRA" ] && HEADER="${EXTRA}\n\n---\n\n"
          HEADER="${HEADER}> Promoted from pre-release \`${PRE_TAG}\`. Binaries are identical.\n\n"

          BODY="${HEADER}## What's Changed\n\n"
          BODY="${BODY}$(section 'Features'    feat feature)"
          BODY="${BODY}$(section 'Bug Fixes'   fix bug)"
          BODY="${BODY}$(section 'Performance' perf)"
          BODY="${BODY}$(section 'Refactoring' refactor refact)"
          BODY="${BODY}$(section 'Build / CI'  build ci chore)"
          BODY="${BODY}$(section 'Docs'        docs)"

          COUNT=$(printf "%b" "$BODY" | grep -c '^- ' || true)
          if [ "${COUNT:-0}" -eq 0 ]; then
            BODY="${HEADER}## What's Changed\n\n$(echo "$COMMITS" | head -50 | sed 's/^/- /')\n\n"
          fi

          BODY="${BODY}## Installation\n\n\`\`\`sh\n# Apple Silicon\ncurl -Lo orca https://github.com/\${{ github.repository }}/releases/download/${STABLE}/orca-aarch64-apple-darwin\n\nchmod +x orca && mv orca ~/.local/bin/orca\nxattr -d com.apple.quarantine ~/.local/bin/orca\n\`\`\`\n\n"
          BODY="${BODY}**Full diff:** [$PREV_STABLE → $STABLE](https://github.com/${{ github.repository }}/compare/${PREV_STABLE}...${STABLE})"

          printf "%b" "$BODY" > /tmp/changelog.md

      - name: Commit Cargo.toml + tag stable
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add projects/server/Cargo.toml
          git diff --cached --quiet || git commit -m "chore: release ${{ steps.validate.outputs.stable }}"
          git tag -a "${{ steps.validate.outputs.stable }}" \
            "${{ steps.validate.outputs.commit }}" \
            -m "orca ${{ steps.validate.outputs.stable }} (promoted from ${{ steps.validate.outputs.pre_tag }})"
          git push origin HEAD --tags

      - name: Create stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.validate.outputs.stable }}
          name: orca ${{ steps.validate.outputs.stable }}
          body_path: /tmp/changelog.md
          prerelease: false
          files: |
            artifacts/orca-*
            artifacts/checksums.sha256

      - name: Mark pre-release as superseded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STABLE="${{ steps.validate.outputs.stable }}"
          PRE_TAG="${{ steps.validate.outputs.pre_tag }}"
          gh release edit "$PRE_TAG" \
            --notes "> **Superseded** — promoted to stable release [$STABLE](https://github.com/${{ github.repository }}/releases/tag/${STABLE})." \
            --prerelease
