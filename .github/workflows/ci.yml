name: CI

# Fast feedback on every push: build → upload artifact → download → test
# for each ecosystem. Tests run against the build output, not against
# re-compiled source.
#
# Run the "Release" workflow manually for full validation before a release.

on:
  # Single-branch flow: everything lands on `main`. Gated here on every push
  # to main and on PRs targeting main.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs when a newer commit arrives on the same ref.
# Saves runner minutes on rapid-fire pushes / PR force-pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token. `dorny/paths-filter` reads the PR's changed-file list
# via the API, which needs `pull-requests: read`; without it the detector fails
# with "Resource not accessible by integration" and every downstream job is
# skipped. `contents: read` covers checkout.
permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Disable per-target incremental files. Pointless on CI (each job starts
  # from a Swatinem-restored cache) and inflates the cache by GB.
  CARGO_INCREMENTAL: 0
  # `.cargo/config.toml` commits `rustc-wrapper = "sccache"` for local dev speed.
  # CI runners have no sccache binary, so override it off here (empty disables
  # the wrapper; env beats the config value). Keeps local dev sccache intact.
  RUSTC_WRAPPER: ""

jobs:
  # ── Path-change detector ─────────────────────────────────────────────────
  # Each downstream job gates on the relevant boolean. A change to any
  # workflow YAML forces every job to run.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      workflows:               ${{ steps.filter.outputs.workflows }}
      rust:                    ${{ steps.filter.outputs.rust }}
      frontend:                ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
            frontend:
              - 'projects/frontend/**'

  # ── Rust ─────────────────────────────────────────────────────────────────
  lint-rust:
    name: Lint Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: rui314/setup-mold@v1
        if: runner.os == 'Linux'

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust
          cache-on-failure: true

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: RUSTFLAGS="-D warnings" cargo clippy --tests -- -D warnings

  test-rust:
    name: Test Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: rui314/setup-mold@v1
        if: runner.os == 'Linux'

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust
          cache-on-failure: true

      - name: Unit + integration tests
        run: cargo nextest run --workspace --no-fail-fast

      - name: Doctests
        run: cargo test --doc --workspace --no-fail-fast

  # ── Rust coverage ────────────────────────────────────────────────────────
  # Ratchets up to 100% per docs/coverage-baseline.md.
  # `--fail-under-lines` floor is the recorded baseline; bump it as new tests
  # land. Below the floor = PR fails. A PR may NEVER lower this number.
  coverage-rust:
    name: Coverage Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: rui314/setup-mold@v1
        if: runner.os == 'Linux'

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust
          cache-on-failure: true

      # Baseline 2026-05-19: 44.98% line. 2026-05-20: +2.54% from tools-def
      # host, host_status, system, meta, plugin_runtime, orca_db, infra, engine
      # tests (now 47.52% workspace lines). 2026-05-21b: +3.72% from bear-scan
      # hardening + coverage tasks #13-17 (now 51.24% workspace lines).
      # Raise the floor every time tests land. Use exact-integer floor — never round below.
      - name: Coverage gate (line coverage ≥ 51%)
        run: cargo llvm-cov --workspace --no-fail-fast --fail-under-lines 51

      - name: HTML report
        if: always()
        run: cargo llvm-cov report --html --output-dir target/llvm-cov

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: target/llvm-cov/
          retention-days: 14

  # ── Frontend ─────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: projects/frontend/package-lock.json

      - name: Install + build
        working-directory: projects/frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: projects/frontend/dist/
          retention-days: 7

  test-frontend:
    name: Test Frontend
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: projects/frontend/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: projects/frontend/dist/

      - name: Install + check + test
        working-directory: projects/frontend
        run: |
          npm ci
          npm run check
          npm run format:check
          npm run test:run

      - name: Assert built artifact exists
        run: test -f projects/frontend/dist/index.html
