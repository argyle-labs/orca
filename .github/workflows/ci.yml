name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── 1. Frontend ──────────────────────────────────────────────────────────────
  # Pure Node job — no Rust dependency.
  # Produces the dist/ artifact consumed by the server-ui job.
  frontend:
    name: Frontend — Check, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: projects/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: projects/frontend/dist/
          retention-days: 7

  # ── 2. Server (headless) ──────────────────────────────────────────────────────
  # Pure Rust, no Node dependency, no frontend dist/ required.
  # Validates the SDK / Meerkat / native-app-backend build path.
  # check + clippy + test run here (not duplicated in server-ui).
  server-headless:
    name: Server (headless) — Check, Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-${{ hashFiles('**/Cargo.lock') }}

      - name: Check
        run: cargo check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test

      - name: Build (linux/x86_64-gnu, headless)
        run: cargo build --release --target x86_64-unknown-linux-gnu --manifest-path projects/server/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: orca-headless-x86_64-unknown-linux-gnu-${{ github.sha }}
          path: target/x86_64-unknown-linux-gnu/release/orca
          retention-days: 7

  # ── 3. Server (ui) ───────────────────────────────────────────────────────────
  # Builds the full CLI artifact with the frontend embedded via --features ui.
  # Depends on both the frontend dist artifact and a clean headless build.
  # Restores the same cache saved by server-headless — only the server crate
  # itself needs recompiling for the ui feature; all deps are cache hits.
  server-ui:
    name: Server (ui) — Build with embedded frontend
    runs-on: ubuntu-latest
    needs: [frontend, server-headless]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-${{ hashFiles('**/Cargo.lock') }}

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: projects/frontend/dist/

      - name: Check (ui feature)
        run: cargo check --features ui --manifest-path projects/server/Cargo.toml

      - name: Build (linux/x86_64-gnu, ui)
        run: cargo build --release --target x86_64-unknown-linux-gnu --features ui --manifest-path projects/server/Cargo.toml

      - uses: actions/upload-artifact@v4
        with:
          name: orca-x86_64-unknown-linux-gnu-${{ github.sha }}
          path: target/x86_64-unknown-linux-gnu/release/orca
          retention-days: 7
