name: CI

# Fast feedback on every push: formatting, linting, and unit tests only.
# No release builds, no integration tests, no cargo-chef.
# Run the "Pipeline" workflow manually for full validation before a release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Frontend: type-check + unit tests (no build) ─────────────────────────
  frontend:
    name: Frontend — Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: projects/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm run test:run

  # ── Rust: fmt + clippy + unit tests (no integration tests) ───────────────
  rust:
    name: Rust — Fmt, Clippy & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: RUSTFLAGS="-D warnings" cargo clippy --tests -- -D warnings

      - name: Unit tests
        run: cargo test --lib --workspace
