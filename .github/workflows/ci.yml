  # The required `test*` check: crate jobs are named `build (…)` and test
  # their crate too, so this fails unless every one of them succeeded.
  test:
    name: test
    needs:
      - plan
      - crate-orca-agents
      - crate-orca-app-kit
      - crate-orca-auth
      - crate-orca-config-source
      - crate-orca-containers
      - crate-orca-contract
      - crate-orca-conversation
      - crate-orca-db
      - crate-orca-deploy-target
      - crate-orca-derive
      - crate-orca-dev
      - crate-orca-dispatch
      - crate-orca-files
      - crate-orca-graphql
      - crate-orca-hosts
      - crate-orca-identities
      - crate-orca-inventory
      - crate-orca-inventory-tests
      - crate-orca-macro-runtime
      - crate-orca-mcp
      - crate-orca-media
      - crate-orca-model
      - crate-orca-namespace
      - crate-orca-notifications
      - crate-orca-openapi
      - crate-orca-plugin-abi
      - crate-orca-plugin-loader
      - crate-orca-plugin-proto
