name: CI

# Fast feedback on every push: build → upload artifact → download → test
# for each ecosystem. Tests run against the build output, not against
# re-compiled source.
#
# Run the "Release" workflow manually for full validation before a release.

on:
  # CI is a pre-merge gate: it runs on pull_request (and on-demand via
  # workflow_dispatch). It deliberately does NOT run on push to main — a merge
  # gate belongs before the merge, and re-running the full test+coverage suite
  # on the post-merge push is pure double-work (the PR already proved that exact
  # tree green). Main is protected by requiring green PRs.
  #
  # CI runs on GITEA (canonical), executed by our self-hosted Gitea act_runner.
  # `runs-on: ubuntu-latest` is just the LABEL that runner advertises — it maps
  # to the local Docker runner (frigg LXC), NOT a GitHub-hosted VM. This repo is
  # a Gitea shop; CI must not depend on GitHub-hosted runners.
  pull_request:
  workflow_dispatch:
  # Nightly full-workspace test + coverage on main — the safety net for the
  # selective PR gate. The PR gate runs plain, uninstrumented tests for only the
  # changed crates + their reverse-dependency closure (fast feedback that scales
  # with blast-radius, not repo size); this nightly run re-tests the ENTIRE
  # workspace under coverage instrumentation and enforces the `.coverage-floor`
  # ratchet. See #536.
  schedule:
    - cron: "0 8 * * *" # ~01:00 America/Denver

# Cancel in-flight runs when a newer commit arrives on the same ref.
# Saves runner minutes on rapid-fire pushes / PR force-pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token. The path detector now diffs locally with git (see the
# `changes` job), so no `pull-requests` scope or API access is needed —
# `contents: read` covers checkout, which is all CI requires.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Disable per-target incremental files. Pointless on CI (each job starts
  # from a Swatinem-restored cache) and inflates the cache by GB.
  CARGO_INCREMENTAL: 0
  # Cheap KDF for the test/coverage build only. Honored solely when
  # cfg!(debug_assertions) is true (test/coverage builds) — release binaries
  # ignore it — so it never weakens production. Skips the memory-hard Argon2 +
  # SQLCipher PBKDF2 cost that otherwise makes auth/secrets tests run tens of
  # seconds each under coverage instrumentation.
  ORCA_TEST_FAST_KDF: "1"
  # Shared compilation cache: sccache with a LOCAL-DISK backend on the persistent
  # Gitea LXC runner (frigg) — the exact pattern the fleet's shared `rust-setup`
  # build action uses in production. Local disk (a fixed host path that survives
  # across jobs) needs no cache protocol and no network backend, so it can't fail
  # the way an S3/MinIO backend can. sccache caches individual rustc invocations
  # INCLUDING workspace members (which rust-cache skips), so a fresh checkout
  # skips recompiling unchanged crates. RUSTC_WRAPPER is set CONDITIONALLY in each
  # Rust job (only when sccache actually installed) — never as a hard global env,
  # because a hard global makes every rustc call fail if sccache is ever missing.
  # CARGO_INCREMENTAL=0 (above) is required for sccache.
  SCCACHE_DIR: /root/.cache/sccache
  SCCACHE_CACHE_SIZE: 20G

jobs:
  # ── Path-change detector ─────────────────────────────────────────────────
  # Each downstream job gates on the relevant boolean. A change to any
  # workflow YAML forces every job to run.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      workflows:               ${{ steps.filter.outputs.workflows }}
      rust:                    ${{ steps.filter.outputs.rust }}
    steps:
      # Full history so the detector can diff locally with git and NEVER call
      # the GitHub API. The previous dorny/paths-filter step fetched the
      # changed-file list over the REST API on every PR — a single point of
      # failure that skipped every downstream job whenever the API degraded.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: filter
        name: Detect changed paths (git-native, no API)
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # Resolve the diff range without touching the GitHub API.
          range=""
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
            if base_sha="$(git merge-base "origin/$BASE_REF" HEAD 2>/dev/null)"; then
              range="$base_sha...HEAD"
            fi
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            range="HEAD^...HEAD"
          fi

          # Fail OPEN: if the range can't be determined (first commit, shallow
          # history, detached edge cases), run everything rather than skip.
          if [ -z "$range" ]; then
            echo "Could not resolve diff range — running all jobs (fail-open)."
            {
              echo "workflows=true"
              echo "rust=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$range")"
          echo "Changed files in $range:"
          echo "$changed"

          workflows=false
          rust=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              .github/workflows/*) workflows=true ;;
            esac
            case "$f" in
              *.rs|*/Cargo.toml|Cargo.toml|Cargo.lock) rust=true ;;
            esac
          done <<< "$changed"

          {
            echo "workflows=$workflows"
            echo "rust=$rust"
          } >> "$GITHUB_OUTPUT"

  # ── Sanitize guard ───────────────────────────────────────────────────────
  # Fast, build-free gate: fail if any real fleet address that was sanitized
  # out of the tree returns (the repo mirrors to a PUBLIC GitHub). Scoped to
  # the fully-eliminated real LAN range and Tailscale ULA prefix — see the script.
  guard-no-real-ips:
    name: Guard — no real fleet IPs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check for forbidden real-fleet addresses
        run: ./scripts/check-no-real-ips.sh

  # ── Rust ─────────────────────────────────────────────────────────────────
  lint-rust:
    name: Lint Rust
    needs: changes
    # PR-only merge gate. All Rust gates (lint, test, coverage) run on PRs and
    # NOT on the post-merge push to main — the PR already proved them green, so
    # re-running on main is wasted compute.
    if: github.event_name == 'pull_request' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/isolate-rust-home

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Best-effort sccache install + CONDITIONAL wrapper, mirroring the fleet's
      # shared rust-setup action. Direct tarball download (no GitHub API, no
      # token — which act does not populate); if it fails we skip the wrapper
      # rather than break the build. RUSTC_WRAPPER is exported ONLY when sccache
      # is actually present, so a missing/failed sccache degrades to no-cache.
      - name: Set up sccache (best-effort, conditional wrapper)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v sccache >/dev/null 2>&1; then
            ver=0.8.2
            url="https://github.com/mozilla/sccache/releases/download/v${ver}/sccache-v${ver}-x86_64-unknown-linux-musl.tar.gz"
            if curl -fsSL "$url" -o /tmp/sccache.tgz && tar -xzf /tmp/sccache.tgz -C /tmp; then
              install -m0755 /tmp/sccache-v${ver}-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache \
                2>/dev/null || sudo install -m0755 /tmp/sccache-v${ver}-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache
              echo "sccache $(sccache --version 2>/dev/null || echo '?') installed"
            else
              echo "::warning::sccache download failed — building without compiler cache"
            fi
          fi
          command -v sccache >/dev/null 2>&1 && echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV" || true

      # rust-cache caches DEPENDENCIES (registry + dep artifacts). Lint is a
      # check-only build, so its own cache key keeps it from thrashing the test
      # job's profile.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust-lint
          cache-on-failure: true

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: RUSTFLAGS="-D warnings" cargo clippy --tests --locked -- -D warnings

  # ── Rust tests — fast, selective, uninstrumented (the PR merge gate) ──────
  # Runs plain `cargo nextest run` for only the affected crates (changed crates +
  # their reverse-dependency closure). No coverage instrumentation on the PR path
  # — the nightly `coverage` job owns that + the `.coverage-floor` ratchet. This
  # keeps PR feedback fast and scaling with change blast-radius, not repo size.
  # PR-only merge gate — the post-merge push to main skips it (the PR proved it
  # green). See #536.
  test-rust:
    name: Test Rust
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true')
    runs-on: ubuntu-latest
    steps:
      # Full history so scripts/affected-crates.sh can diff against the PR base.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/isolate-rust-home

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Best-effort mold install. Kept OUT of the install-action list above and
      # made non-fatal: if mold can't be installed on the runner the build still
      # runs (just with the default linker). Debian bookworm ships a `mold`
      # package; fall back to apt, and never fail the job on its absence.
      - name: Set up mold (best-effort)
        shell: bash
        run: |
          set -uo pipefail
          if ! command -v mold >/dev/null 2>&1; then
            (sudo apt-get update -y && sudo apt-get install -y mold) \
              || apt-get install -y mold \
              || echo "::warning::mold install failed — linking with the default linker"
          fi
          command -v mold >/dev/null 2>&1 && mold --version || true

      # Best-effort sccache install + CONDITIONAL wrapper (see lint-rust for
      # rationale). Kept separate from the install-action tools above because
      # sccache is fetched via direct tarball (no GitHub API / token), and the
      # wrapper is exported only when sccache is actually present.
      - name: Set up sccache (best-effort, conditional wrapper)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v sccache >/dev/null 2>&1; then
            ver=0.8.2
            url="https://github.com/mozilla/sccache/releases/download/v${ver}/sccache-v${ver}-x86_64-unknown-linux-musl.tar.gz"
            if curl -fsSL "$url" -o /tmp/sccache.tgz && tar -xzf /tmp/sccache.tgz -C /tmp; then
              install -m0755 /tmp/sccache-v${ver}-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache \
                2>/dev/null || sudo install -m0755 /tmp/sccache-v${ver}-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache
              echo "sccache $(sccache --version 2>/dev/null || echo '?') installed"
            else
              echo "::warning::sccache download failed — building without compiler cache"
            fi
          fi
          command -v sccache >/dev/null 2>&1 && echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV" || true

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust-test
          cache-on-failure: true

      # ── Selective scope ──────────────────────────────────────────────────
      # Compute the affected-crate set (changed crates + their reverse-dependency
      # closure) from the PR diff range, via scripts/affected-crates.sh. It FAILS
      # OPEN: any build-graph-wide change (root Cargo.toml/lock, CI, toolchain,
      # nextest/cargo config), an unmappable file, or an unresolvable range ->
      # the literal `ALL`, which runs the whole workspace. The nightly `coverage`
      # job is the full-workspace safety net regardless. See #536.
      - name: Compute affected crates
        id: scope
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          range=""
          git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
          if base_sha="$(git merge-base "origin/$BASE_REF" HEAD 2>/dev/null)"; then
            range="$base_sha...HEAD"
          fi
          if [ -z "$range" ]; then
            echo "scope=ALL" >> "$GITHUB_OUTPUT"
            echo "Could not resolve diff range — testing ALL crates (fail-open)."
            exit 0
          fi
          scope="$(bash scripts/affected-crates.sh "$range")"
          if [ "$scope" = "ALL" ]; then
            echo "scope=ALL" >> "$GITHUB_OUTPUT"
            echo "Affected: ALL crates (fail-open trigger)."
          elif [ -z "$scope" ]; then
            echo "scope=NONE" >> "$GITHUB_OUTPUT"
            echo "Affected: no crates (no Rust changes in range)."
          else
            # Space-separated `-p a -p b …` for nextest package selection.
            pkgs="$(echo "$scope" | sed 's/^/-p /' | tr '\n' ' ')"
            echo "scope=$pkgs" >> "$GITHUB_OUTPUT"
            echo "Affected crates:"; echo "$scope"
          fi

      # Run the SELECTED tests, uninstrumented (fast). `--workspace` when scope
      # is ALL; the affected `-p …` set otherwise; skip entirely when NONE. No
      # coverage on the PR gate — the nightly `coverage` job owns instrumentation
      # + the `.coverage-floor` ratchet. `mold -run` routes linking through mold
      # when present (best-effort); sccache skips recompiling unchanged crates.
      - name: Selective tests (uninstrumented)
        shell: bash
        env:
          SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          set -euo pipefail
          if [ "$SCOPE" = "NONE" ]; then
            echo "No Rust crates affected — nothing to test."; exit 0
          fi
          # $SCOPE is either `--workspace` (when ALL) or a `-p a -p b …` list;
          # both word-split safely (crate names have no spaces).
          if [ "$SCOPE" = "ALL" ]; then sel="--workspace"; else sel="$SCOPE"; fi
          cmd=(cargo nextest run --profile ci --locked --no-fail-fast $sel)
          if command -v mold >/dev/null 2>&1; then
            mold -run "${cmd[@]}"
          else
            "${cmd[@]}"
          fi

      # sccache hit/miss stats — surfaces cache effectiveness in the run log so a
      # regression in hit rate is visible. Non-fatal.
      - name: sccache stats
        if: ${{ !cancelled() }}
        run: sccache --show-stats || true

  # ── Nightly full-workspace test + coverage (the safety net) ───────────────
  # Runs the ENTIRE workspace under llvm-cov instrumentation and enforces the
  # `.coverage-floor` ratchet. Deliberately NOT on pull_request: the PR gate is
  # the fast selective test above; instrumentation (a separate instrumented
  # build + ~1.5–2× slower tests) belongs off the per-PR critical path. This
  # catches any coverage regression a selective PR could have missed. See #536.
  coverage:
    name: Coverage (nightly, full workspace)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/isolate-rust-home

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov

      - name: Set up mold (best-effort)
        shell: bash
        run: |
          set -uo pipefail
          if ! command -v mold >/dev/null 2>&1; then
            (sudo apt-get update -y && sudo apt-get install -y mold) \
              || apt-get install -y mold \
              || echo "::warning::mold install failed — linking with the default linker"
          fi
          command -v mold >/dev/null 2>&1 && mold --version || true

      - name: Set up sccache (best-effort, conditional wrapper)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v sccache >/dev/null 2>&1; then
            ver=0.8.2
            url="https://github.com/mozilla/sccache/releases/download/v${ver}/sccache-v${ver}-x86_64-unknown-linux-musl.tar.gz"
            if curl -fsSL "$url" -o /tmp/sccache.tgz && tar -xzf /tmp/sccache.tgz -C /tmp; then
              install -m0755 /tmp/sccache-v${ver}-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache \
                2>/dev/null || sudo install -m0755 /tmp/sccache-v${ver}-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache
            fi
          fi
          command -v sccache >/dev/null 2>&1 && echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV" || true

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust-coverage
          cache-on-failure: true

      # Build + run tests once, instrumented. --no-report keeps the raw profile
      # data on disk so the report steps below reuse it instead of rebuilding.
      - name: Unit + integration tests (instrumented, full workspace)
        shell: bash
        run: |
          set -euo pipefail
          if command -v mold >/dev/null 2>&1; then
            mold -run cargo llvm-cov nextest --no-report --locked --workspace --no-fail-fast
          else
            cargo llvm-cov nextest --no-report --locked --workspace --no-fail-fast
          fi

      - name: sccache stats
        if: ${{ !cancelled() }}
        run: sccache --show-stats || true

      # Gate on the already-collected data — no recompile. Floor is the single
      # source of truth in .coverage-floor. Ratchet by editing that file only;
      # raise it every time tests land, never lower.
      - name: Coverage gate (line coverage ≥ floor)
        run: cargo llvm-cov report --fail-under-lines "$(cat .coverage-floor)"

      - name: HTML report
        if: ${{ !cancelled() }}
        run: cargo llvm-cov report --html --output-dir target/llvm-cov

      - uses: actions/upload-artifact@v3
        if: ${{ !cancelled() }}
        with:
          name: coverage-html
          path: target/llvm-cov/
          retention-days: 14
