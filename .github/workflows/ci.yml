name: CI

# Fast feedback on every push: build → upload artifact → download → test
# for each ecosystem. Tests run against the build output, not against
# re-compiled source.
#
# Run the "Release" workflow manually for full validation before a release.

on:
  # CI is a pre-merge gate: it runs on pull_request (and on-demand via
  # workflow_dispatch). It deliberately does NOT run on push to main — a merge
  # gate belongs before the merge, and re-running the full test+coverage suite
  # on the post-merge push is pure double-work (the PR already proved that exact
  # tree green). Main is protected by requiring green PRs.
  #
  # CI runs on GITEA (canonical), executed by our self-hosted Gitea act_runner.
  # `runs-on: ubuntu-latest` is just the LABEL that runner advertises — it maps
  # to the local Docker runner (frigg LXC), NOT a GitHub-hosted VM. This repo is
  # a Gitea shop; CI must not depend on GitHub-hosted runners.
  pull_request:
  workflow_dispatch:

# Cancel in-flight runs when a newer commit arrives on the same ref.
# Saves runner minutes on rapid-fire pushes / PR force-pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token. The path detector now diffs locally with git (see the
# `changes` job), so no `pull-requests` scope or API access is needed —
# `contents: read` covers checkout, which is all CI requires.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Disable per-target incremental files. Pointless on CI (each job starts
  # from a Swatinem-restored cache) and inflates the cache by GB.
  CARGO_INCREMENTAL: 0
  # Cheap KDF for the test/coverage build only. Honored solely when
  # cfg!(debug_assertions) is true (test/coverage builds) — release binaries
  # ignore it — so it never weakens production. Skips the memory-hard Argon2 +
  # SQLCipher PBKDF2 cost that otherwise makes auth/secrets tests run tens of
  # seconds each under coverage instrumentation.
  ORCA_TEST_FAST_KDF: "1"
  # Shared compilation cache: sccache with a LOCAL-DISK backend on the persistent
  # Gitea LXC runner (frigg) — the exact pattern the fleet's shared `rust-setup`
  # build action uses in production. Local disk (a fixed host path that survives
  # across jobs) needs no cache protocol and no network backend, so it can't fail
  # the way an S3/MinIO backend can. sccache caches individual rustc invocations
  # INCLUDING workspace members (which rust-cache skips), so a fresh checkout
  # skips recompiling unchanged crates. RUSTC_WRAPPER is set CONDITIONALLY in each
  # Rust job (only when sccache actually installed) — never as a hard global env,
  # because a hard global makes every rustc call fail if sccache is ever missing.
  # CARGO_INCREMENTAL=0 (above) is required for sccache.
  SCCACHE_DIR: /root/.cache/sccache
  SCCACHE_CACHE_SIZE: 20G

jobs:
  # ── Path-change detector ─────────────────────────────────────────────────
  # Each downstream job gates on the relevant boolean. A change to any
  # workflow YAML forces every job to run.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      workflows:               ${{ steps.filter.outputs.workflows }}
      rust:                    ${{ steps.filter.outputs.rust }}
    steps:
      # Full history so the detector can diff locally with git and NEVER call
      # the GitHub API. The previous dorny/paths-filter step fetched the
      # changed-file list over the REST API on every PR — a single point of
      # failure that skipped every downstream job whenever the API degraded.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: filter
        name: Detect changed paths (git-native, no API)
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # Resolve the diff range without touching the GitHub API.
          range=""
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
            if base_sha="$(git merge-base "origin/$BASE_REF" HEAD 2>/dev/null)"; then
              range="$base_sha...HEAD"
            fi
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            range="HEAD^...HEAD"
          fi

          # Fail OPEN: if the range can't be determined (first commit, shallow
          # history, detached edge cases), run everything rather than skip.
          if [ -z "$range" ]; then
            echo "Could not resolve diff range — running all jobs (fail-open)."
            {
              echo "workflows=true"
              echo "rust=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$range")"
          echo "Changed files in $range:"
          echo "$changed"

          workflows=false
          rust=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              .github/workflows/*) workflows=true ;;
            esac
            case "$f" in
              *.rs|*/Cargo.toml|Cargo.toml|Cargo.lock) rust=true ;;
            esac
          done <<< "$changed"

          {
            echo "workflows=$workflows"
            echo "rust=$rust"
          } >> "$GITHUB_OUTPUT"

  # ── Rust ─────────────────────────────────────────────────────────────────
  lint-rust:
    name: Lint Rust
    needs: changes
    # PR-only merge gate. All Rust gates (lint, test, coverage) run on PRs and
    # NOT on the post-merge push to main — the PR already proved them green, so
    # re-running on main is wasted compute.
    if: github.event_name == 'pull_request' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/isolate-rust-home

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Best-effort sccache install + CONDITIONAL wrapper, mirroring the fleet's
      # shared rust-setup action. Direct tarball download (no GitHub API, no
      # token — which act does not populate); if it fails we skip the wrapper
      # rather than break the build. RUSTC_WRAPPER is exported ONLY when sccache
      # is actually present, so a missing/failed sccache degrades to no-cache.
      - name: Set up sccache (best-effort, conditional wrapper)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v sccache >/dev/null 2>&1; then
            ver=0.8.2
            url="https://github.com/mozilla/sccache/releases/download/v${ver}/sccache-v${ver}-x86_64-unknown-linux-musl.tar.gz"
            if curl -fsSL "$url" -o /tmp/sccache.tgz && tar -xzf /tmp/sccache.tgz -C /tmp; then
              install -m0755 /tmp/sccache-v${ver}-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache \
                2>/dev/null || sudo install -m0755 /tmp/sccache-v${ver}-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache
              echo "sccache $(sccache --version 2>/dev/null || echo '?') installed"
            else
              echo "::warning::sccache download failed — building without compiler cache"
            fi
          fi
          command -v sccache >/dev/null 2>&1 && echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV" || true

      # rust-cache caches DEPENDENCIES (registry + dep artifacts). Lint is a
      # check-only build, so its own cache key keeps it from thrashing the test
      # job's profile.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust-lint
          cache-on-failure: true

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: RUSTFLAGS="-D warnings" cargo clippy --tests --locked -- -D warnings

  # ── Rust tests + coverage — one instrumented flow ─────────────────────────
  # Tests and coverage share ONE build. `cargo llvm-cov nextest` compiles the
  # workspace once, instrumented, and runs nextest against it — so the same
  # binaries produce both the test result and the coverage profile. We used to
  # split these into two jobs (a normal test build + a second instrumented
  # coverage build), which compiled the whole workspace TWICE. Now the test run
  # is the build; coverage is just a report over data already collected.
  # PR-only merge gate — the post-merge push to main skips it (the PR proved it
  # green, re-running on main is wasted compute).
  # Coverage ratchets toward 100% per docs/coverage-baseline.md — raise the
  # floor in `.coverage-floor` as tests land; a change may NEVER lower it.
  test-rust:
    name: Test Rust
    needs: changes
    # PR-only merge gate (matches lint-rust). A merge gate runs BEFORE merge —
    # re-running the full test+coverage suite on the post-merge push to main is
    # pure double-work: the PR already proved this exact tree green. Coverage/
    # tests are validated on the PR; main is protected by requiring green PRs.
    if: github.event_name == 'pull_request' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/isolate-rust-home

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,mold

      # Best-effort sccache install + CONDITIONAL wrapper (see lint-rust for
      # rationale). Kept separate from the install-action tools above because
      # sccache is fetched via direct tarball (no GitHub API / token), and the
      # wrapper is exported only when sccache is actually present.
      - name: Set up sccache (best-effort, conditional wrapper)
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v sccache >/dev/null 2>&1; then
            ver=0.8.2
            url="https://github.com/mozilla/sccache/releases/download/v${ver}/sccache-v${ver}-x86_64-unknown-linux-musl.tar.gz"
            if curl -fsSL "$url" -o /tmp/sccache.tgz && tar -xzf /tmp/sccache.tgz -C /tmp; then
              install -m0755 /tmp/sccache-v${ver}-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache \
                2>/dev/null || sudo install -m0755 /tmp/sccache-v${ver}-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache
              echo "sccache $(sccache --version 2>/dev/null || echo '?') installed"
            else
              echo "::warning::sccache download failed — building without compiler cache"
            fi
          fi
          command -v sccache >/dev/null 2>&1 && echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV" || true

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust-test
          cache-on-failure: true

      # Build + run tests once, instrumented. --no-report keeps the raw profile
      # data on disk so the report steps below reuse it instead of rebuilding.
      #
      # `mold -run` routes every linker invocation (rustc → cc → ld) through mold
      # without depending on the runner gcc supporting `-fuse-ld=mold` directly —
      # it links the ~100 per-crate test binaries far faster than the default ld.
      # sccache (global RUSTC_WRAPPER) skips recompiling unchanged crates; the two
      # are complementary (sccache caches compilation, mold speeds linking).
      - name: Unit + integration tests (instrumented)
        run: mold -run cargo llvm-cov nextest --no-report --locked --workspace --no-fail-fast

      # sccache hit/miss stats — surfaces cache effectiveness in the run log so a
      # regression in hit rate is visible. Non-fatal.
      - name: sccache stats
        if: ${{ !cancelled() }}
        run: sccache --show-stats || true

      # Gate on the already-collected data — no recompile. Floor is the single
      # source of truth in .coverage-floor (shared with the Makefile `coverage`
      # target and the README badge). Ratchet by editing that file only; raise
      # it every time tests land, never lower. Use exact-integer floor.
      # Baseline 2026-05-19: 44.98% line. 2026-05-20: +2.54%. 2026-05-21b: +3.72%
      # (now 51.24% workspace lines).
      - name: Coverage gate (line coverage ≥ floor)
        run: cargo llvm-cov report --fail-under-lines "$(cat .coverage-floor)"

      # Use !cancelled() rather than always(): we still want the HTML report and
      # artifact upload on both success AND genuine failure, but NOT when the run
      # was cancelled by concurrency (a newer push superseding this one). Gitea's
      # artifact API rejects uploads on a cancelled task with a 500 ("task is not
      # running"); running these steps on a doomed run produced spurious red
      # "Create Artifact Container failed" errors. Skipping on cancel is the root
      # fix — the upload is retained for every run that actually completes.
      - name: HTML report
        if: ${{ !cancelled() }}
        run: cargo llvm-cov report --html --output-dir target/llvm-cov

      - uses: actions/upload-artifact@v3
        if: ${{ !cancelled() }}
        with:
          name: coverage-html
          path: target/llvm-cov/
          retention-days: 14
