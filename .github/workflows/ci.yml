      - crate-orca-route
      - crate-orca-secrets
      - crate-orca-server
      - crate-orca-service
      - crate-orca-spec
      - crate-orca-storage
      - crate-orca-system
      - crate-orca-utils
      - crate-plugin-toolkit
      - crate-plugin-toolkit-build
    if: ${{ always() }}
    runs-on: ci-large
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Every crate built and tested
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$RESULTS")"
          if [ -n "$failed" ]; then
            echo "$failed"
            exit 1
          fi
          echo "all crates passed"

  # Summarises line coverage across the per-crate lcov files; report-only.
  # Crates reusing a recorded pass upload none, so the total covers only crates
  # that ran.
  coverage:
    name: coverage
    needs:
      - crate-orca-agents
      - crate-orca-app-kit
      - crate-orca-auth
      - crate-orca-config-source
      - crate-orca-containers
      - crate-orca-contract
      - crate-orca-conversation
      - crate-orca-db
      - crate-orca-deploy-target
      - crate-orca-derive
      - crate-orca-dev
      - crate-orca-dispatch
      - crate-orca-files
      - crate-orca-graphql
      - crate-orca-hosts
      - crate-orca-identities
      - crate-orca-inventory
      - crate-orca-inventory-tests
      - crate-orca-macro-runtime
      - crate-orca-mcp
      - crate-orca-media
      - crate-orca-model
      - crate-orca-namespace
      - crate-orca-notifications
      - crate-orca-openapi
      - crate-orca-plugin-abi
      - crate-orca-plugin-loader
      - crate-orca-plugin-proto
      - crate-orca-plugin-toolkit
      - crate-orca-plugin-toolkit-build
      - crate-orca-plugins
      - crate-orca-route
      - crate-orca-secrets
      - crate-orca-server
      - crate-orca-service
      - crate-orca-spec
      - crate-orca-storage
      - crate-orca-system
      - crate-orca-utils
      - crate-plugin-toolkit
      - crate-plugin-toolkit-build
    if: ${{ always() }}
    runs-on: ci-large
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Download per-crate lcov
        uses: actions/download-artifact@v4
        with:
          pattern: lcov-*
          path: lcov
      - name: Line coverage
        run: |
          shopt -s nullglob globstar
          files=(lcov/**/lcov.info)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No crate produced coverage (all reused recorded passes)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A line counts as hit when any crate's tests executed it.
          awk -F'[:,]' '
            /^SF:/ { sf = substr($0, 4) }
            /^DA:/ { k = sf SUBSEP $2; if (!(k in hit)) hit[k] = 0; if ($3 > 0) hit[k] = 1 }
            END {
              for (k in hit) { total++; covered += hit[k] }
              printf "### Line coverage (all crates)\n\n%d / %d lines (%.2f%%)\n", covered, total, total ? 100 * covered / total : 0
            }' "${files[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          # Concatenated, not merged: a file covered by several crates appears
          # once per crate.
          cat "${files[@]}" > lcov-per-crate-concat.info
      - name: Upload concatenated lcov
        uses: actions/upload-artifact@v4
        if: ${{ hashFiles('lcov-per-crate-concat.info') != '' }}
        with:
          name: lcov-per-crate-concat
          path: lcov-per-crate-concat.info
          retention-days: 7
