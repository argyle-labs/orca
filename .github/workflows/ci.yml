name: CI

# Each job is one shared job action from argyle-labs/.github; add no steps
# here. CI runs on Gitea, on our self-hosted act_runner.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore the pass cache'
        type: boolean
        default: false
  schedule:
    - cron: "17 9 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Cheap KDF for test builds only; release binaries ignore it.
  ORCA_TEST_FAST_KDF: "1"

jobs:
  build:
    runs-on: ci-large
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    steps:
      - name: Build
        uses: argyle-labs/.github/.github/actions/job-rust-build@main
        with:
          extra-paths: "orca-inventory-tests: README.md CRATE_RESPONSIBILITIES.md projects docs"
          features: ""
          force: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          drop-cargo-config: 'false'
          version-env: ORCA_RELEASE_VERSION
          doctests: 'true'
          size-check: 'false'
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}

  test:
    needs: build
    runs-on: ci-large
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    steps:
      - name: Test
        uses: argyle-labs/.github/.github/actions/job-rust-test@main
        with:
          extra-paths: "orca-inventory-tests: README.md CRATE_RESPONSIBILITIES.md projects docs"
          force: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          drop-cargo-config: 'false'
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}

  lint:
    runs-on: ci-large
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    env:
      ORCA_FORBIDDEN_IP_PATTERNS: ${{ secrets.FORBIDDEN_IP_PATTERNS }}
    steps:
      - name: Lint
        uses: argyle-labs/.github/.github/actions/job-rust-lint@main
        with:
          extra-paths: "orca-inventory-tests: README.md CRATE_RESPONSIBILITIES.md projects docs"
          features: ""
          force: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          drop-cargo-config: 'false'
          scripts: ./scripts/check-no-real-ips.sh
          cargo-checks: |
            check -p orca-notifications --no-default-features
            check -p orca-plugin-toolkit --no-default-features --features tools,notify
            test -p orca-plugin-toolkit --features full --test doc_authoring_anchor
          package-publishable: 'true'
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}
