name: CI

# Fast feedback on every push: build → upload artifact → download → test
# for each ecosystem. Tests run against the build output, not against
# re-compiled source.
#
# Run the "Release" workflow manually for full validation before a release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs when a newer commit arrives on the same ref.
# Saves runner minutes on rapid-fire pushes / PR force-pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # sccache requires CARGO_INCREMENTAL=0 to avoid wrapping incremental builds.
  CARGO_INCREMENTAL: 0
  # Per-source-file compile cache backed by GHA cache; complements Swatinem
  # (which caches whole target/ + ~/.cargo). Cross-job dedupe across runs.
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  # ── Path-change detector ─────────────────────────────────────────────────
  # Each downstream job gates on the relevant boolean. A change to any
  # workflow YAML forces every job to run.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      workflows:               ${{ steps.filter.outputs.workflows }}
      rust:                    ${{ steps.filter.outputs.rust }}
      sdk-ts:                  ${{ steps.filter.outputs.sdk-ts }}
      example-hackernews:      ${{ steps.filter.outputs.example-hackernews }}
      sdk-go:                  ${{ steps.filter.outputs.sdk-go }}
      sdk-kotlin:              ${{ steps.filter.outputs.sdk-kotlin }}
      frontend:                ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # `rust` includes every SDK source dir because the cargo
          # workspace's conformance test exercises the Go/TS/Kotlin SDKs;
          # any SDK change must re-run the rust integration tests.
          filters: |
            workflows:
              - '.github/workflows/**'
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'projects/sdk-go/**'
              - 'projects/sdk-ts/**'
              - 'projects/sdk-kotlin/**'
            sdk-ts:
              - 'projects/sdk-ts/**'
            example-hackernews:
              - 'projects/examples/hackernews/**'
              - 'projects/sdk-ts/**'
            sdk-go:
              - 'projects/sdk-go/**'
            sdk-kotlin:
              - 'projects/sdk-kotlin/**'
            frontend:
              - 'projects/frontend/**'

  # ── Rust ─────────────────────────────────────────────────────────────────
  lint-rust:
    name: Lint Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: mozilla-actions/sccache-action@v0.0.6

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust
          cache-on-failure: true

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: RUSTFLAGS="-D warnings" cargo clippy --tests -- -D warnings

      - name: SDK isolation check
        run: |
          if cargo tree -p orca-sdk 2>&1 | grep -E "orca-server|orca-commands|orca-conversation|orca-agents|orca-llm|orca-scanner|rust-embed"; then
            echo "ERROR: server-only crate found in orca-sdk dependency tree"
            exit 1
          fi

  test-rust:
    name: Test Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.6

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: projects/sdk-go/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: projects/sdk-ts/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust
          cache-on-failure: true

      - name: Unit + integration tests
        run: cargo nextest run --workspace --no-fail-fast

      - name: Doctests
        run: cargo test --doc --workspace --no-fail-fast

  # ── TS SDK ───────────────────────────────────────────────────────────────
  build-sdk-ts:
    name: Build TS SDK
    needs: changes
    if: needs.changes.outputs.sdk-ts == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: projects/sdk-ts/package-lock.json

      - name: Build
        working-directory: projects/sdk-ts
        run: |
          npm ci
          npm run build
          npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-ts-dist
          path: |
            projects/sdk-ts/dist/
            projects/sdk-ts/package.json
            projects/sdk-ts/orca-sdk-*.tgz
          retention-days: 7

  test-sdk-ts:
    name: Test TS SDK
    needs: build-sdk-ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: projects/sdk-ts/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: sdk-ts-dist
          path: projects/sdk-ts/

      - name: Install + test against built dist
        working-directory: projects/sdk-ts
        run: |
          npm ci
          node --test --experimental-strip-types test/*.test.ts

  # ── TS example: hackernews ───────────────────────────────────────────────
  build-example-hackernews:
    name: Build TS example (hackernews)
    needs: [changes, build-sdk-ts]
    if: needs.changes.outputs.example-hackernews == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/download-artifact@v4
        with:
          name: sdk-ts-dist
          path: projects/sdk-ts/

      - name: Install SDK tarball + build
        working-directory: projects/examples/hackernews
        run: |
          set -euo pipefail
          npm install ../../sdk-ts/orca-sdk-*.tgz --no-save
          npm install
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: example-hackernews
          path: |
            projects/examples/hackernews/dist/
            projects/examples/hackernews/package.json
            projects/examples/hackernews/package-lock.json
          retention-days: 7

  test-example-hackernews:
    name: Test TS example (hackernews)
    needs: build-example-hackernews
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/download-artifact@v4
        with:
          name: example-hackernews
          path: hackernews/

      - uses: actions/download-artifact@v4
        with:
          name: sdk-ts-dist
          path: sdk-ts/

      - name: Install runtime deps + SDK tarball
        working-directory: hackernews
        run: |
          set -euo pipefail
          npm ci --omit=dev
          npm install ../sdk-ts/orca-sdk-*.tgz --no-save --omit=dev

      - name: Smoke test built artifact
        working-directory: hackernews
        run: |
          set -euo pipefail
          test -f dist/index.js
          node --check dist/index.js
          node -e "require.resolve('@orca/sdk', { paths: ['$(pwd)'] })"

  # ── Go SDK ───────────────────────────────────────────────────────────────
  build-sdk-go:
    name: Build Go SDK
    needs: changes
    if: needs.changes.outputs.sdk-go == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: projects/sdk-go/go.sum

      - name: gofmt
        working-directory: projects/sdk-go
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "Unformatted Go files:"; echo "$diff"; exit 1
          fi

      - name: Compile packages + test binaries
        working-directory: projects/sdk-go
        run: |
          set -euo pipefail
          go build ./...
          mkdir -p ../../sdk-go-tests
          for pkg in $(go list ./...); do
            name=$(echo "$pkg" | tr '/' '_').test
            go test -c -o "../../sdk-go-tests/${name}" "$pkg" || true
          done
          ls -lh ../../sdk-go-tests/

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-go-tests
          path: sdk-go-tests/
          retention-days: 7

  test-sdk-go:
    name: Test Go SDK
    needs: build-sdk-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdk-go-tests
          path: sdk-go-tests/

      - name: Run prebuilt test binaries
        run: |
          set -euo pipefail
          chmod +x sdk-go-tests/*.test || true
          for t in sdk-go-tests/*.test; do
            [ -f "$t" ] || continue
            echo "── $t ──"
            "./$t" -test.v
          done

  # ── Kotlin SDK ───────────────────────────────────────────────────────────
  build-sdk-kotlin:
    name: Build Kotlin SDK
    needs: changes
    if: needs.changes.outputs.sdk-kotlin == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (no test)
        working-directory: projects/sdk-kotlin
        run: gradle --no-daemon build -x test

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-kotlin-jar
          path: |
            projects/sdk-kotlin/build/libs/
            projects/sdk-kotlin/build/classes/
          retention-days: 7

  test-sdk-kotlin:
    name: Test Kotlin SDK
    needs: build-sdk-kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with:
          name: sdk-kotlin-jar
          path: projects/sdk-kotlin/build/

      - name: Test against prebuilt classes
        working-directory: projects/sdk-kotlin
        run: gradle --no-daemon test

  # ── Frontend ─────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: projects/frontend/package-lock.json

      - name: Install + build
        working-directory: projects/frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: projects/frontend/dist/
          retention-days: 7

  test-frontend:
    name: Test Frontend
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: projects/frontend/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: projects/frontend/dist/

      - name: Install + check + test
        working-directory: projects/frontend
        run: |
          npm ci
          npm run check
          npm run test:run

      - name: Assert built artifact exists
        run: test -f projects/frontend/dist/index.html
