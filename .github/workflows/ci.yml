name: CI

# Fast feedback on every push: build → upload artifact → download → test
# for each ecosystem. Tests run against the build output, not against
# re-compiled source.
#
# Run the "Release" workflow manually for full validation before a release.

on:
  # CI is a pre-merge gate: it runs on pull_request. It deliberately does NOT
  # run on push to main — a merge gate belongs before the merge, and re-running
  # it on the post-merge push is pure double-work (the PR already proved that
  # exact tree green). Main is protected by requiring green PRs.
  #
  # A PR tests only the crates its changes touch plus their reverse
  # dependents; the nightly schedule and workflow_dispatch run the full
  # workspace. Coverage is report-only on every trigger.
  #
  # CI runs on GITEA (canonical), executed by our self-hosted Gitea act_runner.
  # `runs-on: ubuntu-latest` is just the LABEL that runner advertises — it maps
  # to the local Docker runner (frigg LXC), NOT a GitHub-hosted VM. This repo is
  # a Gitea shop; CI must not depend on GitHub-hosted runners.
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

# Cancel in-flight runs when a newer commit arrives on the same ref.
# Saves runner minutes on rapid-fire pushes / PR force-pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token. The path detector now diffs locally with git (see the
# `changes` job), so no `pull-requests` scope or API access is needed —
# `contents: read` covers checkout, which is all CI requires.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Disable per-target incremental files. Pointless on CI and MANDATORY for
  # sccache — incremental compilation and sccache are mutually exclusive
  # (leaving it on silently disables every cache hit).
  CARGO_INCREMENTAL: 0
  # Cheap KDF for the test/coverage build only. Honored solely when
  # cfg!(debug_assertions) is true (test/coverage builds) — release binaries
  # ignore it — so it never weakens production. Skips the memory-hard Argon2 +
  # SQLCipher PBKDF2 cost that otherwise makes auth/secrets tests run tens of
  # seconds each under coverage instrumentation.
  ORCA_TEST_FAST_KDF: "1"
  # No DWARF on CI: less compile, link and cache weight. Trade-off:
  # RUST_BACKTRACE frames lose file:line, but a panic still prints its
  # location. Coverage is unaffected (-Cinstrument-coverage emits its own
  # mapping sections). Local dev keeps line tables.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

  # ── Kill vendored OpenSSL on the PR gate (biggest cold-compile win) ────────
  # OpenSSL is pulled in vendored TWICE — via git2's `vendored-openssl` and via
  # rusqlite's `bundled-sqlcipher-vendored-openssl` — so a cold build compiles
  # the whole OpenSSL C source from scratch, the single largest crate cost.
  # OPENSSL_NO_VENDOR=1 overrides the vendored feature at build-script time and
  # links the system OpenSSL (libssl-dev, baked into the ci-rust image) instead.
  # This is CI-ONLY: the release/cross (musl) workflow deliberately does NOT set
  # it, so production keeps statically vendoring OpenSSL for portable binaries.
  OPENSSL_NO_VENDOR: "1"


jobs:
  # Scopes a PR to the crates its changes touch plus their reverse dependents
  # (scripts/ci-affected-crates.sh); schedule and dispatch run the workspace.
  # Runs in ci-rust because crate selection needs cargo metadata.
  changes:
    name: Detect changed paths
    runs-on: ci-large
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    defaults:
      run:
        shell: bash
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
      rust:      ${{ steps.filter.outputs.rust }}
      mode:      ${{ steps.select.outputs.mode }}
      args:      ${{ steps.select.outputs.args }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: filter
        name: Detect changed files
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          # Only a PR is scoped to its changes; schedule and dispatch run the
          # full workspace.
          if [ "$EVENT" != "pull_request" ]; then
            printf 'workflows=true\nrust=true\nfull=true\nchanged=\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Resolve the diff range without touching the GitHub API.
          range=""
          git fetch --no-tags origin "$BASE_REF" >/dev/null 2>&1 || true
          if base_sha="$(git merge-base "origin/$BASE_REF" HEAD 2>/dev/null)"; then
            range="$base_sha...HEAD"
          fi

          # Fail OPEN: if the range can't be determined (first commit, shallow
          # history, detached edge cases), run everything rather than skip.
          if [ -z "$range" ]; then
            echo "Could not resolve diff range — running all jobs (fail-open)."
            {
              echo "workflows=true"
              echo "rust=true"
              echo "full=true"
              echo "changed="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only --no-renames "$range")"
          echo "Changed files in $range:"
          echo "$changed"

          workflows=false
          rust=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              .github/workflows/*) workflows=true ;;
            esac
            # Any path but a LICENSE can affect a Rust test (inventory-tests
            # checks paths cited from docs, hooks/ and .github/), so gate on
            # exclusion and let ci-affected-crates.sh pick the crates.
            case "$f" in
              LICENSE*) ;;
              *) rust=true ;;
            esac
          done <<< "$changed"

          {
            echo "workflows=$workflows"
            echo "rust=$rust"
            echo "full=false"
            echo "changed_count=$(printf '%s\n' "$changed" | grep -c .)"
            echo "changed<<CHANGED_EOF"
            echo "$changed"
            echo "CHANGED_EOF"
          } >> "$GITHUB_OUTPUT"

      # mode=all on schedule/dispatch or when a change maps to no crate;
      # mode=none skips build/test/lint Rust steps.
      - name: Select crates
        id: select
        env:
          FULL: ${{ steps.filter.outputs.full }}
          CHANGED: ${{ steps.filter.outputs.changed }}
          # A mismatch means the list was truncated in transit: test everything.
          CI_EXPECTED_COUNT: ${{ steps.filter.outputs.changed_count }}
        run: |
          set -euo pipefail
          if [ "$FULL" = "true" ]; then
            printf 'mode=all\nargs=--workspace\npackages=\nignore_regex=\n' | tee -a "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$CHANGED" | scripts/ci-affected-crates.sh | tee -a "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: |
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
        (github.event_name == 'pull_request'
          && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true')))
      && needs.changes.outputs.mode != 'none'
    runs-on: ci-large
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Rust
        uses: argyle-labs/.github/.github/actions/rust-setup@main
        with:
          drop-cargo-config: 'false'
          wrap-cc: 'true'
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}
      # server/system build scripts derive ORCA_VERSION from git; a fixed
      # version keeps them cached. The -dev suffix keeps dev-build behaviour.
      - name: Pin orca version
        run: |
          v="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          [ -n "$v" ] || exit 1
          echo "ORCA_RELEASE_VERSION=${v}-dev+gci" >> "$GITHUB_ENV"
      - name: Build test archive
        uses: argyle-labs/.github/.github/actions/cargo-build@main
        with:
          args: ${{ needs.changes.outputs.args }}
      - name: CI summary
        uses: argyle-labs/.github/.github/actions/ci-summary@main
        if: ${{ !cancelled() }}

  # Runs the build's instrumented archive once; coverage is report-only.
  test:
    needs: [changes, build]
    if: |
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' ||
        (github.event_name == 'pull_request'
          && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true')))
      && needs.changes.outputs.mode != 'none'
    runs-on: ci-large
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Rust
        uses: argyle-labs/.github/.github/actions/rust-setup@main
        with:
          drop-cargo-config: 'false'
          wrap-cc: 'true'
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}
      # server/system build scripts derive ORCA_VERSION from git; a fixed
      # version keeps them cached. The -dev suffix keeps dev-build behaviour.
      - name: Pin orca version
        run: |
          v="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          [ -n "$v" ] || exit 1
          echo "ORCA_RELEASE_VERSION=${v}-dev+gci" >> "$GITHUB_ENV"
      - name: Test + coverage
        uses: argyle-labs/.github/.github/actions/cargo-test@main
        with:
          args: ${{ needs.changes.outputs.args }}
          doctests: 'false'
      - name: CI summary
        uses: argyle-labs/.github/.github/actions/ci-summary@main
        if: ${{ !cancelled() }}

  lint:
    needs: changes
    runs-on: ci-large
    container:
      image: ${{ vars.CI_REGISTRY || 'gitea.scottkey.me' }}/argyle-labs/ci-rust:1.95.0
      credentials:
        username: ${{ secrets.CI_REGISTRY_USER }}
        password: ${{ secrets.CI_REGISTRY_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Fails if a real fleet address returns (the repo mirrors to a PUBLIC
      # GitHub). The patterns are a secret so the guard does not leak the range
      # it protects; unset, the allowlist sweep still runs.
      - name: Check for forbidden real-fleet addresses
        env:
          ORCA_FORBIDDEN_IP_PATTERNS: ${{ secrets.FORBIDDEN_IP_PATTERNS }}
        run: ./scripts/check-no-real-ips.sh

      - name: CI script tests
        if: ${{ !cancelled() }}
        run: time scripts/ci-affected-crates.test.sh

      - name: Set up Rust

        uses: argyle-labs/.github/.github/actions/rust-setup@main
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true') && needs.changes.outputs.mode != 'none' }}
        with:
          drop-cargo-config: 'false'
          wrap-cc: 'true'
          sccache-endpoint: ${{ vars.SCCACHE_ENDPOINT }}
          sccache-access-key: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
          sccache-secret-key: ${{ secrets.SCCACHE_S3_SECRET_KEY }}
      - name: Format
        uses: argyle-labs/.github/.github/actions/cargo-fmt@main
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true') && needs.changes.outputs.mode != 'none' }}
      - name: Clippy
        uses: argyle-labs/.github/.github/actions/cargo-clippy@main
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true') && needs.changes.outputs.mode != 'none' }}
        with:
          args: ${{ needs.changes.outputs.args }} --tests
      # Last: it deletes .cargo/config.toml, which the cargo steps above need.
      - name: Lock file check
        uses: argyle-labs/.github/.github/actions/cargo-lock-check@main
        if: ${{ !cancelled() }}
      - name: CI summary
        uses: argyle-labs/.github/.github/actions/ci-summary@main
        if: ${{ !cancelled() }}
