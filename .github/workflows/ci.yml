name: CI

# Fast feedback on every push: build → upload artifact → download → test
# for each ecosystem. Tests run against the build output, not against
# re-compiled source.
#
# Run the "Release" workflow manually for full validation before a release.

on:
  # Single-branch flow: everything lands on `main`. Gated here on every push
  # to main and on PRs targeting main.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs when a newer commit arrives on the same ref.
# Saves runner minutes on rapid-fire pushes / PR force-pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token. `dorny/paths-filter` reads the PR's changed-file list
# via the API, which needs `pull-requests: read`; without it the detector fails
# with "Resource not accessible by integration" and every downstream job is
# skipped. `contents: read` covers checkout.
permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Disable per-target incremental files. Pointless on CI (each job starts
  # from a Swatinem-restored cache) and inflates the cache by GB.
  CARGO_INCREMENTAL: 0
  # sccache caches compilation PER CRATE — including the 63 workspace crates that
  # Swatinem/rust-cache deliberately strips out (it only caches dependencies). So
  # a no-change run recompiles nothing instead of rebuilding every workspace
  # crate (~1 min). Backed by the GitHub Actions cache; the sccache binary is
  # installed per job by mozilla-actions/sccache-action. `.cargo/config.toml`
  # already sets this wrapper for local dev — CI now matches instead of disabling.
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # ── Path-change detector ─────────────────────────────────────────────────
  # Each downstream job gates on the relevant boolean. A change to any
  # workflow YAML forces every job to run.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      workflows:               ${{ steps.filter.outputs.workflows }}
      rust:                    ${{ steps.filter.outputs.rust }}
      frontend:                ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
            frontend:
              - 'projects/frontend/**'

  # ── Rust ─────────────────────────────────────────────────────────────────
  lint-rust:
    name: Lint Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: rui314/setup-mold@v1
        if: runner.os == 'Linux'

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      # rust-cache caches DEPENDENCIES (registry + dep artifacts); sccache (above)
      # caches workspace-crate compilation. Lint is a check-only build, so its own
      # cache key keeps it from thrashing the test job's profile.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust-lint
          cache-on-failure: true

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: RUSTFLAGS="-D warnings" cargo clippy --tests -- -D warnings

  # ── Rust tests — the fast PR gate ─────────────────────────────────────────
  # PRs run a NORMAL (non-instrumented) build so sccache + rust-cache stay warm
  # and a no-change run recompiles almost nothing. Coverage instrumentation is a
  # separate, slower, poorly-cacheable profile — it is NOT on the PR hot path
  # (see coverage-rust, which runs on push to main only).
  test-rust:
    name: Test Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: rui314/setup-mold@v1
        if: runner.os == 'Linux'

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust-test
          cache-on-failure: true

      - name: Unit + integration tests
        run: cargo nextest run --workspace --no-fail-fast

      - name: Doctests
        run: cargo test --doc --workspace --no-fail-fast

  # ── Rust coverage — off the PR hot path ───────────────────────────────────
  # Runs only on push to main (not on PRs), because the instrumented build is the
  # slow, hard-to-cache profile and we want PR feedback fast. Still gates: a drop
  # below the floor fails the main build. Coverage ratchets toward 100% per
  # docs/coverage-baseline.md — raise `--fail-under-lines` as tests land; a change
  # may NEVER lower it.
  coverage-rust:
    name: Coverage Rust
    needs: changes
    if: github.event_name == 'push' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: rui314/setup-mold@v1
        if: runner.os == 'Linux'

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-rust-cov
          cache-on-failure: true

      # Baseline 2026-05-19: 44.98% line. 2026-05-20: +2.54%. 2026-05-21b: +3.72%
      # (now 51.24% workspace lines). Raise the floor every time tests land. Use
      # exact-integer floor — never round below.
      - name: Coverage gate (line coverage ≥ 51%)
        run: cargo llvm-cov --workspace --no-fail-fast --fail-under-lines 51

      - name: HTML report
        if: always()
        run: cargo llvm-cov report --html --output-dir target/llvm-cov

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: target/llvm-cov/
          retention-days: 14

  # ── Frontend ─────────────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: projects/frontend/package-lock.json

      - name: Install + build
        working-directory: projects/frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: projects/frontend/dist/
          retention-days: 7

  test-frontend:
    name: Test Frontend
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: projects/frontend/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: projects/frontend/dist/

      - name: Install + check + test
        working-directory: projects/frontend
        run: |
          npm ci
          npm run check
          npm run format:check
          npm run test:run

      - name: Assert built artifact exists
        run: test -f projects/frontend/dist/index.html
