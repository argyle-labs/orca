[package]
name = "brain-utils"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
colored = "2"
tracing = "0.1"
glob = "0.3"
dirs = "5"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
