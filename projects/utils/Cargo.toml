[package]
name = "utils"
version.workspace = true
edition.workspace = true

[lib]
name = "utils"
path = "src/lib.rs"

[dependencies]
# Standard
anyhow     = { workspace = true }
thiserror  = { workspace = true }
chrono     = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
url        = { workspace = true }
dirs       = { workspace = true }
glob       = { workspace = true }
sha2       = { workspace = true }
tempfile   = { workspace = true }

# Async
tokio = { workspace = true }

# HTTP/TLS (http module)
reqwest = { workspace = true }
rustls  = { workspace = true }

# Embedded assets (config module)
rust-embed = { workspace = true }

# Hashing (fs module)
blake3 = "1"

# Markdown stripping (markdown module)
regex = { workspace = true }

# Filesystem watch (fs module)
notify = "8"

# libgit2 (git module) — vendored static
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2", "vendored-openssl"] }

# Schema decoration on TreeNode (tree module)
utoipa = { workspace = true }

[dev-dependencies]
tokio    = { workspace = true }
tempfile = { workspace = true }
wiremock = "0.6"

[lints]
workspace = true
