[package]
name = "orca-fs"
version = "0.1.0"
edition.workspace = true

[lib]
name = "orca_fs"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
glob = "0.3"
notify = "6"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "sync", "rt", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
