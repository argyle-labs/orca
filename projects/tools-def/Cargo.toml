[package]
name = "orca-tools-def"
version.workspace = true
edition.workspace = true

[lib]
name = "orca_tools_def"
path = "src/lib.rs"

# Feature flavors:
#   - default (none): metadata only (Args + unit structs + Defs).
#   - native:         pulls `OrcaTool::run` impls (db, integrations, utils).
#   - cli:            emits clap-driven CLI subcommands; implies native.
#
# Server enables `native`. CLI binary enables `cli`.

[features]
default = []
native = [
    "dep:orca-utils",
    "dep:orca-db",
    "dep:orca-integrations",
    "dep:async-trait",
    "dep:anyhow",
    "dep:tokio",
    "dep:chrono",
    "dep:cron",
]
cli = [
    "native",
    "dep:clap",
    "dep:colored",
]

[dependencies]
orca-tool-trait  = { path = "../tool-trait" }
orca-tools-macro = { path = "../tools-macro" }
schemars         = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }

# Inventory powers the `ORCA_TOOLS` registration slice that `#[orca_tool]`
# submits into.
inventory       = { workspace = true }

# Native-only deps.
orca-utils        = { path = "../utils",        optional = true }
orca-db           = { package = "orca-db", path = "../db", optional = true }
orca-integrations = { path = "../integrations", optional = true }
async-trait       = { workspace = true,         optional = true }
anyhow            = { workspace = true,         optional = true }
tokio             = { workspace = true,         optional = true }
chrono            = { workspace = true,         optional = true }
cron              = { workspace = true,         optional = true }

# CLI-only deps.
clap              = { workspace = true,         optional = true }
colored           = { workspace = true,         optional = true }
