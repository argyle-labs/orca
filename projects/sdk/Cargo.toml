[package]
name    = "orca-sdk"
version = "0.1.0"
edition.workspace = true

# orca-sdk is a headless library crate.
# It MUST NOT depend on orca-server, orca-commands, orca-agents, orca-conversation,
# or anything that pulls in the ui feature or server-only deps.
# Allowed: orca-config, orca-db, orca-state, orca-fs, orca-tool — core primitives only.
#
# This is enforced by the build-sdk CI job which builds this crate in isolation.

[lib]
name = "orca_sdk"

[dependencies]
anyhow     = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime (net + io-util for TCP streams; sync for Mutex)
tokio = { version = "1", features = ["net", "io-util", "sync"] }

# TLS
rustls          = { version = "0.23", default-features = false, features = ["ring"] }
rustls-pki-types = "1"
rustls-pemfile  = "2"
tokio-rustls    = "0.26"

# Cert generation (pem + x509-parser required for from_ca_cert_pem)
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }

[dev-dependencies]
tempfile = "3"
tokio    = { version = "1", features = ["rt", "macros"] }
