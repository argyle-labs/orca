[package]
name    = "orca-sdk"
version.workspace = true
edition.workspace = true

# orca-sdk is a headless library crate.
# It MUST NOT depend on orca-server, orca-commands, orca-agents, orca-conversation,
# or anything that pulls in the ui feature or server-only deps.
# Allowed: orca-config, orca-db, orca-state, orca-fs, orca-tool — core primitives only.
#
# This is enforced by the build-sdk CI job which builds this crate in isolation.

[lib]
name = "orca_sdk"

[dependencies]
anyhow     = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
# Manifest format. The orca-plugin manifest IS part of the contract, so
# the parser lives here in the SDK alongside the protocol types.
toml       = { workspace = true }

tokio    = { workspace = true }

# TLS
rustls           = { workspace = true }
rustls-pki-types = { workspace = true }
rustls-pemfile   = { workspace = true }
tokio-rustls     = { workspace = true }

# Cert generation (pem + x509-parser required for from_ca_cert_pem)
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }

# Direct cert parsing: needed to read the peer's CN out of the leaf cert
# during the mTLS handshake so the plugin host can bind plugin_id → cert.
x509-parser = "0.18"

# Conformance suite uses tempdirs to stage PKI material and the manifest
# fixture before spawning the candidate plugin binary.
tempfile = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { workspace = true }
