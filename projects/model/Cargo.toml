[package]
name = "orca-model"
publish = false
version.workspace = true
edition.workspace = true

[lib]
name = "model"
path = "src/lib.rs"

[dependencies]
# THIN PROFILE: this core crate uses `#[orca_tool]` only → just the `tools` feature.
# Drops the `full` default's containers(bollard)/graphql/notify/openapi bloat.
plugin-toolkit = { workspace = true, features = ["tools"] }
# macro-runtime is the absolute-path landing crate for code emitted by
# our derive/`endpoint_resource!` macros. Hand-written `use serde::*`,
# `anyhow::bail!`, `tokio::*` still resolve against direct deps because
# serde-derive / anyhow! / tokio! emit `::serde::…` / `::anyhow::…` /
# `::tokio::…` at the call site (the proc-macro layer can't re-route
# them through a re-export without `#[serde(crate = "...")]`-style
# per-item annotations). See [[project-orca-macro-runtime-migration]].
contract  = { workspace = true, default-features = true }
derive    = { workspace = true }

utils    = { workspace = true, default-features = true }
files    = { workspace = true }
db       = { workspace = true, default-features = true }

anyhow       = { workspace = true }
rusqlite = { workspace = true }
clap         = { workspace = true }
colored      = { workspace = true }
futures-util = { workspace = true }
schemars     = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
tokio        = { workspace = true }
tokio-util   = { workspace = true }

[dev-dependencies]
db = { workspace = true, default-features = true, features = ["test-util"] }
tempfile = { workspace = true }

[lints]
workspace = true
