[package]
name = "system"
version.workspace = true
edition.workspace = true

[lib]
name = "system"
path = "src/lib.rs"

[features]
default = []
native = [
    "orca-contract/native",
    "dep:orca-utils",
    "dep:orca-sdk",
    "dep:agents",
    "dep:db",
    "dep:anyhow",
    "dep:async-trait",
    "dep:tokio",
    "dep:tracing",
    "dep:sysinfo",
    "dep:if-addrs",
    "dep:chrono",
    "dep:dirs",
    "dep:sha2",
]
cli = [
    "native",
    "dep:clap",
]
# Marker feature mirroring `orca/ui` — flips `system_detail`'s `frontend`
# field to "embedded". Pure cfg flag; pulls no extra deps.
ui = []

[dependencies]
orca-dispatch   = { path = "../orca-dispatch" }
orca-contract  = { path = "../orca-contract", default-features = false }
orca-macro     = { path = "../orca-macro" }
schemars       = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
inventory      = { workspace = true }

orca-utils   = { path = "../utils", optional = true }
orca-sdk     = { path = "../sdk/rust", optional = true }
agents       = { path = "../agents", default-features = false, optional = true }
db           = { package = "orca-db", path = "../db", optional = true }
anyhow       = { workspace = true, optional = true }
async-trait  = { workspace = true, optional = true }
tokio        = { workspace = true, optional = true }
tracing      = { workspace = true, optional = true }
clap         = { workspace = true, optional = true }
sysinfo      = { workspace = true, optional = true }
if-addrs     = { version = "0.14", optional = true }
chrono       = { workspace = true, optional = true }
dirs         = { workspace = true, optional = true }
sha2         = { workspace = true, optional = true }
cron         = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
