[package]
name = "orca-system"
publish = false
version.workspace = true
edition.workspace = true

[lib]
name = "system"
path = "src/lib.rs"

[dependencies]
# `db-incore`: `managed_mounts` uses `endpoint_resource!` compiled INTO the
# daemon, so its CRUD needs the in-process pooled-connection fallback (no
# capability sink / host FFI channel in-core). Plugins never enable this.
plugin-toolkit = { workspace = true, default-features = true, features = ["db-incore"] }
dispatch   = { workspace = true, default-features = true }
plugin-loader = { workspace = true }
contract  = { workspace = true }
derive     = { workspace = true }
schemars       = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }

utils = { workspace = true, default-features = true }
files = { workspace = true }
agents = { workspace = true }
db = { workspace = true, default-features = true }
hosts = { workspace = true }
identities = { workspace = true }
secrets = { workspace = true }
notifications = { workspace = true, default-features = true }
# Core container reconciler (auto-start + crashloop breaker + wedge recovery).
# The `container_reconcile` driver schedules its `reconcile()` and gates the
# state-changing actions on the host remediation policy. No cycle: `containers`
# depends on none of the higher-level crates.
containers = { workspace = true }
auth = { workspace = true }
dev = { workspace = true }
# Mesh transport (folded in from the former mesh crate): mTLS over
# SNI=mesh.orca.local, mDNS discovery, and the concurrent fleet fan-out.
futures = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
mdns-sd = { workspace = true }
rand = { workspace = true }
rustls-pemfile = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
clap         = { workspace = true }
sysinfo = { workspace = true }
if-addrs = { workspace = true }
sha2 = { workspace = true }
md-5 = { workspace = true }
colored      = { workspace = true }
regex        = { workspace = true }

# `orca logs` TUI. ratatui/crossterm are already workspace deps (the
# conversation TUI uses them); base64 is for the OSC 52 clipboard escape, which
# is how a copy reaches the OPERATOR's clipboard when the log is read over SSH.
ratatui = { workspace = true }
crossterm = { workspace = true }
base64 = { workspace = true }

# macOS self-restart detaches the launchctl-kickstart helper into its own
# session via `setsid(2)` so the supervisor killing THIS daemon's job (which
# SIGKILLs the whole job process tree) can't take the helper down mid-restart.
# No `setsid` binary ships on macOS, so we call it through `pre_exec`. The
# crontab helper (`cron.rs`) also needs getpwnam_r/geteuid/kill on Linux. libc
# is already present transitively; declared direct for every unix target.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
serial_test = { workspace = true }
wiremock = { workspace = true }
db = { workspace = true, default-features = true, features = ["test-util"] }
# A hook test drives libc fork/dup2/waitpid directly.
libc = { workspace = true }

[lints]
workspace = true
