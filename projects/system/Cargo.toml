[package]
name = "system"
version.workspace = true
edition.workspace = true

[lib]
name = "system"
path = "src/lib.rs"

[features]
cli = [
    "dep:clap",
    "dep:axum",
    "dep:regex",
]
# Marker feature mirroring `orca/ui` — flips `system_detail`'s `frontend`
# field to "embedded". Pure cfg flag; pulls no extra deps.
ui = []
[dependencies]
dispatch   = { path = "../dispatch" }
contract  = { path = "../contract", default-features = false }
derive     = { path = "../derive" }
schemars       = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
inventory      = { workspace = true }

utils = { path = "../utils" }
files = { path = "../files" }
orca-sdk = { path = "../sdk/rust" }
agents = { path = "../plugins/agents", default-features = false }
db = { package = "db", path = "../db" }
rusqlite = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
clap         = { workspace = true, optional = true }
sysinfo = { workspace = true }
if-addrs = { version = "0.14" }
chrono = { workspace = true }
dirs = { workspace = true }
sha2 = { workspace = true }
cron         = { workspace = true }
colored      = { workspace = true }
axum         = { workspace = true, optional = true }
regex        = { workspace = true, optional = true }
docker = { path = "../plugins/docker", default-features = false }

[dev-dependencies]
tempfile = { workspace = true }
serial_test = { workspace = true }

[lints]
workspace = true
