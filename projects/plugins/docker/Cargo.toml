[package]
name = "docker"
version.workspace = true
edition.workspace = true

[lib]
name = "docker"
path = "src/lib.rs"

[dependencies]
# THIN PROFILE: docker uses `#[orca_tool]` only and defines its own
# ContainerSummary DTO → just the `tools` feature. The `full` default was
# pulling bollard via plugin_toolkit::containers even though docker never
# imports it; flipping drops bollard/graphql/notify/openapi(progenitor).
plugin-toolkit = { path = "../../plugin-toolkit", default-features = false, features = ["tools"] }
macro-runtime = { path = "../../macro-runtime" }
anyhow      = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tokio       = { workspace = true }

dispatch        = { path = "../../dispatch" }
contract    = { path = "../../contract", default-features = false }
derive       = { path = "../../derive" }
schemars         = { workspace = true }
inventory        = { workspace = true }

db = { package = "db", path = "../../db" }
async-trait = { workspace = true }
clap        = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
