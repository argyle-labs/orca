[package]
name = "smb"
version.workspace = true
edition.workspace = true

[lib]
name = "smb"
path = "src/lib.rs"

# Per [[feedback-plugin-toolkit-only-no-exceptions]]: this plugin reaches the
# whole orca system — infra AND the `storage` domain — through `plugin-toolkit`
# alone. The storage domain is reachable as `plugin_toolkit::storage`.
#
# THIN PROFILE (`default-features = false`): smb is a storage adapter that uses
# only `#[plugin_struct]` + the always-on `storage` domain + native `path`.
# It invokes no `#[orca_tool]`/`endpoint_resource!`, so it drops the toolkit's
# heavy `full` facade (containers/db/dispatch/openapi/graphql/http →
# bollard/axum/libgit2/rusqlite/progenitor). Single orca dep preserved; just
# the minimal slice of it.
[dependencies]
plugin-toolkit = { path = "../../plugin-toolkit", default-features = false }

[dev-dependencies]
tempfile   = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true }

[lints]
workspace = true
