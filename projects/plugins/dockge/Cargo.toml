[package]
name = "dockge"
version.workspace = true
edition.workspace = true

[lib]
name = "dockge"
path = "src/lib.rs"

[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
urlencoding = { workspace = true }
utils  = { path = "../../utils" }

# Toolkit prelude + endpoint_resource! macro.
orca-plugin-toolkit = { path = "../orca-plugin-toolkit" }

# Used directly by stack-op tools' #[orca_tool] expansions.
dispatch    = { path = "../../dispatch" }
contract    = { path = "../../contract", default-features = false }
derive      = { path = "../../derive" }
schemars    = { workspace = true }
inventory   = { workspace = true }

# Toolkit-generated code uses these at expansion sites:
db = { package = "db", path = "../../db" }
rusqlite = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }

clap = { workspace = true }

[dev-dependencies]
tokio       = { workspace = true }
wiremock    = "0.6"

[lints]
workspace = true
