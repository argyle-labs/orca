[package]
name = "proxmox"
version.workspace = true
edition.workspace = true
build = "build.rs"

[lib]
name = "proxmox"
path = "src/lib.rs"

[dependencies]
macro-runtime = { path = "../../macro-runtime" }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
urlencoding = { workspace = true }
utils  = { path = "../../utils" }

dispatch        = { path = "../../dispatch" }
contract    = { path = "../../contract", default-features = false }
derive       = { path = "../../derive" }
schemars         = { workspace = true }
inventory        = { workspace = true }

db = { package = "db", path = "../../db" }
rusqlite    = { workspace = true }
plugin-toolkit = { path = "../../plugin-toolkit" }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap        = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }
# join_all the per-guest config fan-out. Needed by topology.rs only — the
# rest of the crate is sequential. Workspace alias is `futures-util`.
futures-util = { workspace = true }
# Runtime deps for the progenitor-generated client (see build.rs).
reqwest     = { workspace = true, features = ["multipart", "cookies"] }
chrono      = { workspace = true }
uuid        = { workspace = true, features = ["serde"] }
progenitor-client = "0.14"
futures-core = "0.3"
bytes       = "1"
regress     = "0.10"

[build-dependencies]
plugin-toolkit-build = { path = "../../plugin-toolkit-build" }

[dev-dependencies]
tokio    = { workspace = true }
wiremock = "0.6"

[lints]
workspace = true
