[package]
name = "ntfy"
version.workspace = true
edition.workspace = true

[lib]
name = "ntfy"
path = "src/lib.rs"

# Per [[feedback-plugin-toolkit-only-no-exceptions]]: ALL orca capabilities
# — infra AND domain contracts — reach this plugin through `plugin-toolkit`
# alone. No direct deps on `notifications`/`containers`/`db`/etc.; the
# notifications domain is reachable as `plugin_toolkit::notifications`.
# Allowed deps:
#   1. plugin-toolkit (the only gateway)
#   2. niche third-party transport bits not common enough to live in the toolkit
[dependencies]
plugin-toolkit = { path = "../../plugin-toolkit" }
urlencoding    = { workspace = true }

[dev-dependencies]
tokio    = { workspace = true }
wiremock = "0.6"

[lints]
workspace = true
