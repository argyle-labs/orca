[package]
name = "ntfy"
version.workspace = true
edition.workspace = true

[lib]
name = "ntfy"
path = "src/lib.rs"

# Plugin reaches EVERY orca capability — including the notifications
# domain it registers against — through `plugin_toolkit::prelude::*`.
# Only deps allowed:
#   1. plugin-toolkit (the gateway, exposes notifications + http + db)
#   2. niche transport bits not common enough to live in the toolkit
[dependencies]
plugin-toolkit = { path = "../../plugin-toolkit" }
notifications  = { path = "../../notifications" }
urlencoding    = { workspace = true }

[dev-dependencies]
tokio    = { workspace = true }
wiremock = "0.6"

[lints]
workspace = true
