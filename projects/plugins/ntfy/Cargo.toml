[package]
name = "ntfy"
version.workspace = true
edition.workspace = true

[lib]
name = "ntfy"
path = "src/lib.rs"

# Plugin reaches orca infra through `plugin_toolkit::prelude::*` (db,
# http, derives, runtime). Integration deps are explicit: per the
# domain-adapter model, depending directly on the domain crate you
# register with is the contract — not a leak past the toolkit.
# Allowed deps:
#   1. plugin-toolkit (the gateway: infra + transport + derives)
#   2. the DOMAIN crates this plugin registers with (notifications)
#   3. niche transport bits not common enough to live in the toolkit
[dependencies]
plugin-toolkit = { path = "../../plugin-toolkit" }
notifications  = { path = "../../notifications" }
urlencoding    = { workspace = true }

[dev-dependencies]
tokio    = { workspace = true }
wiremock = "0.6"

[lints]
workspace = true
