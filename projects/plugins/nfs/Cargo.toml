[package]
name = "nfs"
version.workspace = true
edition.workspace = true

[lib]
name = "nfs"
path = "src/lib.rs"
# `cdylib` is the orca plugin artifact orca's `plugin-loader` `dlopen`s;
# `rlib` retains the in-crate `#[cfg(test)]` harness + lets the workspace use it
# as a normal Rust lib.
crate-type = ["cdylib", "rlib"]

# Per [[feedback-plugin-toolkit-only-no-exceptions]]: this plugin reaches the
# whole orca system — infra AND the `storage` domain — through `plugin-toolkit`
# alone. The storage domain is reachable as `plugin_toolkit::storage`.
[dependencies]
plugin-toolkit = { path = "../../plugin-toolkit" }

# The ONE genuine non-orca dep: `#[export_root_module]` expands to bare
# `::abi_stable` paths in this crate's root (the cdylib FFI boundary the loader
# dlopens), so it can't route through the toolkit. Pinned to the orca workspace
# version so the layout hash baked into the cdylib matches what the
# plugin-loader checks at load time.
abi_stable = { workspace = true }

[dev-dependencies]
tempfile   = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true }

[lints]
workspace = true
