[package]
name = "integrations-sonarr"
version.workspace = true
edition.workspace = true
build = "build.rs"

[lib]
name = "integrations_sonarr"
path = "src/lib.rs"

# Typed Sonarr API client. The client is fully generated by progenitor
# in build.rs from the vendored `sonarr.openapi.json`. Update the spec by
# overwriting that file (e.g. `curl http://sonarr.local/api/v3/openapi.json`
# -o sonarr.openapi.json`). The runtime view of the spec (operations list
# for MCP/UI) is served by `integrations/openapi`.

[dependencies]
anyhow      = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
reqwest     = { workspace = true }
chrono      = { workspace = true }
uuid        = { workspace = true }
# progenitor's generated client uses these at runtime
progenitor-client = "0.14"
futures-core = "0.3"
bytes       = "1"
regress     = "0.10"

[build-dependencies]
openapi = { path = "../openapi" }
progenitor  = "0.14"
openapiv3   = "2"
serde_json  = { workspace = true }
prettyplease = "0.2"
syn         = { version = "2", features = ["full"] }

[lints]
workspace = true
