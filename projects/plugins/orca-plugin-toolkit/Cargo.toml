[package]
name = "orca-plugin-toolkit"
version.workspace = true
edition.workspace = true

[lib]
name = "orca_plugin_toolkit"
path = "src/lib.rs"

[dependencies]
orca-macro-runtime = { path = "../../orca-macro-runtime" }
# Re-exports for the prelude.
serde      = { workspace = true }
serde_json = { workspace = true }
schemars   = { workspace = true }
async-trait = { workspace = true }
anyhow      = { workspace = true }
clap        = { workspace = true }
inventory   = { workspace = true }

# Macros and trait anchors the toolkit primitives expand to.
contract    = { path = "../../contract", default-features = false }
dispatch    = { path = "../../dispatch" }
derive      = { path = "../../derive" }
db          = { package = "db", path = "../../db" }
rusqlite    = { workspace = true }

# Runtime primitives — plugins reach these through the toolkit, never directly.
utils       = { path = "../../utils" }
graphql     = { path = "../graphql" }
openapi     = { path = "../openapi" }

[lints]
workspace = true
