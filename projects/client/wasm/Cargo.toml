[package]
name = "orca-client-wasm"
version = "0.1.0"
edition.workspace = true

[lib]
name = "orca_client_wasm"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

# wasm-pack's bundled wasm-opt is too old for the bulk-memory ops the modern
# wasm-bindgen runtime emits. Skip it; size shrinks via release profile + LTO.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[dependencies]
orca-client-core = { path = "../core" }

async-trait           = { workspace = true }
serde                 = { workspace = true }
serde_json            = { workspace = true }

# Wasm-only deps (declared locally — not used elsewhere in the workspace).
wasm-bindgen          = "0.2"
wasm-bindgen-futures  = "0.4"
js-sys                = "0.3"
serde-wasm-bindgen    = "0.6"

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
]
