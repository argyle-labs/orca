[package]
name = "orca-client-wasm"
version = "0.1.0"
edition.workspace = true

[lib]
name = "orca_client_wasm"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

# wasm-pack's bundled wasm-opt is too old for the bulk-memory ops the modern
# wasm-bindgen runtime emits. Skip it; size shrinks via release profile + LTO.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[dependencies]
# Single dep — tools-def's `wasm` feature emits OrcaClient + every per-tool
# method. This crate is just the wasm-pack-buildable cdylib wrapper.
orca-tools-def = { path = "../../tools-def", features = ["wasm"] }
wasm-bindgen   = "0.2"
