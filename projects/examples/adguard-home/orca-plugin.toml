[plugin]
id               = "adguard-home"
version          = "0.1.0"
min_orca_version = "0.1.0"

[runtime]
binary = "./bin/orca-example-adguard-home"
mode   = "process"
eager  = false

[surfaces]
mcp = false

[[capabilities]]
name        = "context.publish"
sensitivity = "general"

[[capabilities]]
name        = "adguard.read"
sensitivity = "general"
