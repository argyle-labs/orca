[package]
name = "inventory-tests"
version.workspace = true
edition.workspace = true
publish = false

# Sibling test-only crate that links every #[orca_tool] bucket and verifies
# the inventory graph end-to-end. Lives in its own crate so it can dev-dep
# every domain crate at once without any one of them having to dev-dep the
# others (which would link a bucket twice — once as the lib under test, once
# transitively — duplicating every inventory::submit! and panicking
# orca_dispatch::cache() with "duplicate tool name").

[lib]
path = "src/lib.rs"

[dependencies]
serde_json    = { workspace = true }

[dev-dependencies]
dispatch = { path = "../dispatch" }
contract  = { path = "../contract" }
clap      = { workspace = true }
tokio     = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
inventory     = { workspace = true }
anyhow        = { workspace = true }
async-trait   = { workspace = true }
tempfile      = { workspace = true }

# Link every bucket so its inventory::submit! statics are pulled in.
agents        = { path = "../agents" }
auth          = { path = "../auth" }
plugins       = { path = "../runtime" }
system        = { path = "../system" }
notifications = { path = "../notifications" }
files         = { path = "../files" }
orca-inventory = { path = "../orca-inventory" }
# The rest of the tool-hosting crates. Needed so the OpenAPI shape guards in
# tests/openapi_surface.rs walk the WHOLE surface — a bucket that isn't linked
# here is silently exempt from them.
db            = { path = "../db" }
spec          = { path = "../spec" }
model         = { path = "../model" }
namespace     = { path = "../namespace" }
conversation  = { path = "../conversation" }
config-source = { path = "../config-source" }
containers    = { path = "../containers" }
dev           = { path = "../dev" }
mcp           = { path = "../mcp" }
plugin-toolkit = { path = "../plugin-toolkit" }
# `spec.detail` is an #[orca_tool] hosted in the server crate itself.
server        = { path = "../server" }

[lints]
workspace = true
