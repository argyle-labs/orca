[package]
name = "orca-inventory-tests"
version.workspace = true
edition.workspace = true
publish = false

# Sibling test-only crate that links every #[orca_tool] bucket and verifies
# the inventory graph end-to-end. Lives in its own crate so it can dev-dep
# every domain crate at once without any one of them having to dev-dep the
# others (which would link a bucket twice — once as the lib under test, once
# transitively — duplicating every inventory::submit! and panicking
# orca_dispatch::cache() with "duplicate tool name").

[lib]
name = "inventory_tests"
path = "src/lib.rs"

[dependencies]
serde_json    = { workspace = true }

[dev-dependencies]
dispatch = { workspace = true, default-features = true }
contract  = { workspace = true, default-features = true }
clap      = { workspace = true }
tokio     = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
inventory     = { workspace = true }
anyhow        = { workspace = true }
async-trait   = { workspace = true }
tempfile      = { workspace = true }

# Link every bucket so its inventory::submit! statics are pulled in.
agents        = { workspace = true, default-features = true }
auth          = { workspace = true }
plugins       = { workspace = true }
system        = { workspace = true }
notifications = { workspace = true, default-features = true }
files         = { workspace = true }
orca-inventory = { workspace = true }
# The rest of the tool-hosting crates. Needed so the OpenAPI shape guards in
# tests/openapi_surface.rs walk the WHOLE surface — a bucket that isn't linked
# here is silently exempt from them.
db            = { workspace = true, default-features = true }
spec          = { workspace = true }
model         = { workspace = true }
namespace     = { workspace = true }
conversation  = { workspace = true }
config-source = { workspace = true }
containers    = { workspace = true }
dev           = { workspace = true }
mcp           = { workspace = true }
plugin-toolkit = { workspace = true, default-features = true }
# `spec.detail` is an #[orca_tool] hosted in the server crate itself.
orca          = { workspace = true }

[lints]
workspace = true
