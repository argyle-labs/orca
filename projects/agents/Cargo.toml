[package]
name = "orca-agents"
publish = false
version.workspace = true
edition.workspace = true
build = "build.rs"

[lib]
name = "agents"
path = "src/lib.rs"

[dependencies]
# `#[orca_tool]` emits `::plugin_toolkit::{contract,dispatch,reactor,time,...}`
# paths, so the toolkit is the macro anchor. `tools` pulls the contract/dispatch
# re-exports the macro needs; the heavy `full` default (containers/graphql/
# notify/openapi) is off.
plugin-toolkit = { workspace = true, features = ["tools"] }
contract    = { workspace = true }
derive       = { workspace = true }
schemars         = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
sha2             = { workspace = true }
hex              = { workspace = true }
tempfile         = { workspace = true }

db = { workspace = true, default-features = true }
anyhow = { workspace = true }
clap        = { workspace = true }
namespace = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
uuid = { workspace = true }
