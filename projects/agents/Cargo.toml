[package]
name = "agents"
version.workspace = true
edition.workspace = true
build = "build.rs"

[lib]
name = "agents"
path = "src/lib.rs"

[features]
default = ["native"]
native = [
    "orca-contract/native",
    "dep:orca-utils",
    "dep:orca-db",
    "dep:anyhow",
    "dep:async-trait",
    "dep:tokio",
    "dep:chrono",
    "dep:llm",
    "dep:platform",
]
cli = [
    "native",
    "dep:clap",
    "dep:colored",
]

[dependencies]
orca-dispatch        = { path = "../orca-dispatch" }
orca-contract    = { path = "../orca-contract", default-features = false }
orca-macro       = { path = "../orca-macro" }
schemars         = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
inventory        = { workspace = true }

orca-utils  = { path = "../utils",        optional = true }
orca-db     = { package = "orca-db", path = "../db", optional = true }
anyhow      = { workspace = true,         optional = true }
async-trait = { workspace = true,         optional = true }
tokio       = { workspace = true,         optional = true }
chrono      = { workspace = true,         optional = true }
clap        = { workspace = true,         optional = true }
colored     = { workspace = true,         optional = true }
llm         = { path = "../llm",          optional = true }
platform    = { path = "../platform",     optional = true }

[lints]
workspace = true
