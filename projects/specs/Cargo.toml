[package]
name = "specs"
version.workspace = true
edition.workspace = true

[lib]
name = "specs"
path = "src/lib.rs"

[features]
cli = ["dep:clap"]
[dependencies]
orca-dispatch = { path = "../orca-dispatch" }
orca-contract = { path = "../orca-contract", default-features = false }
orca-macro    = { path = "../orca-macro" }
schemars      = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
inventory     = { workspace = true }

orca-utils = { path = "../utils" }
db = { package = "orca-db", path = "../db" }
anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
clap       = { workspace = true,         optional = true }
scanner = { path = "../scanner" }
mcp = { path = "../mcp" }
reqwest = { workspace = true }
dirs = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
