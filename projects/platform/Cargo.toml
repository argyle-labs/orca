[package]
name = "platform"
version.workspace = true
edition.workspace = true

[lib]
name = "platform"
path = "src/lib.rs"

[features]
default = []
native = [
    "orca-tool/native",
    "orca-contract/native",
    "dep:orca-utils",
    "dep:orca-db",
    "dep:anyhow",
    "dep:async-trait",
    "dep:tokio",
    "dep:chrono",

    "dep:cron",
]
cli = [
    "native",
    "orca-tool/cli",

    "dep:clap",
    "dep:colored",
]

[dependencies]
orca-tool        = { path = "../orca-tool", default-features = false }
orca-contract    = { path = "../orca-contract", default-features = false }
orca-macro       = { path = "../orca-macro" }
schemars         = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
inventory        = { workspace = true }

orca-utils        = { path = "../utils",        optional = true }
orca-db           = { package = "orca-db", path = "../db", optional = true }
anyhow            = { workspace = true,         optional = true }
async-trait       = { workspace = true,         optional = true }
tokio             = { workspace = true,         optional = true }
chrono            = { workspace = true,         optional = true }
cron              = { workspace = true,         optional = true }
clap              = { workspace = true,         optional = true }
colored           = { workspace = true,         optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
