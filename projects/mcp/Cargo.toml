[package]
name = "orca-mcp"
publish = false
version.workspace = true
edition.workspace = true

[lib]
name = "mcp"
path = "src/lib.rs"

[dependencies]
# Serving core only — the federation `#[orca_tool]` surface moved to the
# external `argyle-labs/mcp` cdylib, so the macro toolchain deps
# (plugin-toolkit / derive / dispatch / macro-runtime / inventory) are gone.
contract   = { workspace = true }
schemars        = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }

utils = { workspace = true, default-features = true }
db = { workspace = true, default-features = true }
anyhow = { workspace = true }
rusqlite = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
clap          = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
db = { workspace = true, default-features = true, features = ["test-util"] }
rustls = { workspace = true }
