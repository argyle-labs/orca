[package]
name = "orca-tool"
version.workspace = true
edition.workspace = true

[lib]
name = "orca_tool"
path = "src/lib.rs"

# Feature flavors:
#   - default (none): wasm-safe metadata only — OrcaToolDef + OrcaOp + JsonAny
#                     + the `openapi` spec injector (pure JSON schema munging).
#   - native:         pulls the runtime (OrcaTool runner, ToolRegistry, ToolCtx,
#                     ErasedTool, axum router, inventory-driven
#                     `native_register`). Brings orca-utils for Config.
#   - cli:            unified clap-driven CLI surface (`register_op!` macro +
#                     `CliOp` inventory + dispatcher). Implies `native`.

[features]
default = []
native = [
    "dep:orca-utils",
    "dep:anyhow",
    "dep:async-trait",
    "dep:axum",
    "dep:futures",
    "dep:tokio",
    "dep:tower",
]
cli = [
    "native",
    "dep:clap",
    "dep:colored",
]

[dependencies]
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# `inventory` powers the cross-crate `#[orca_tool]` registration slice — used
# by `inventory.rs`, `openapi.rs`, and (under `cli`) `cli.rs`. Default-feature
# so the OpenAPI spec injector works in wasm builds too.
inventory = { workspace = true }

# native-only
orca-utils  = { path = "../utils", optional = true }
anyhow      = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
axum        = { workspace = true, optional = true }
futures     = { version = "0.3", optional = true }
tokio       = { workspace = true, optional = true }
tower       = { workspace = true, optional = true }

# cli-only
clap        = { workspace = true, optional = true }
colored     = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
tower = { workspace = true }
