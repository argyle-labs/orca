[plugin]
id                = "context7"
version           = "1.0.0"
tier              = "external"
context_injection = "minimal"

[plugin.mcp]
command = "npx"
args    = ["-y", "@upstash/context7-mcp"]

# context7's tool names don't carry a context7_ prefix, so auto-strip produces nothing.
# Explicit mapping required for all exposed tools.
[plugin.commands]
resolve_library  = "resolve-library-id"
get_library_docs = "get-library-docs"
