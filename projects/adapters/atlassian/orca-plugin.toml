[plugin]
id      = "atlassian"
version = "1.0.0"
tier    = "external"
# Default standalone mode — overridden to the parent's mode when used as a dependency
mode    = "atlassian"
context_injection = "minimal"

[plugin.mcp]
# Atlassian MCP server (claude.ai integration)
# Override with a self-hosted server if needed
command = "npx"
args    = ["-y", "@anthropic/mcp-server-atlassian"]

# Nav links contributed when this plugin's mode is active
[[plugin.nav_links]]
href  = "/jira"
label = "Jira"

[[plugin.nav_links]]
href  = "/confluence"
label = "Confluence"

[[plugin.nav_links]]
href  = "/bitbucket"
label = "Bitbucket"

[[plugin.search_tools]]
tool = "atlassian_search"
arg  = "query"
root = "atlassian"
