[plugin]
id                = "rebuy"
version           = "1.0.0"
tier              = "external"
mode              = "rebuy"
context_injection = "full"

[plugin.mcp]
command = "node"
args    = ["/Users/scottkey/code/rebuy/rebuy-cli-mcp-server/build/index.js"]

[plugin.specs]
dir = "~/code/rebuy/rebuy-docs/docs/gen"

# Nav links rendered in the rebuy sidebar section
[[plugin.nav_links]]
href  = "/jira"
label = "Jira"

[[plugin.nav_links]]
href  = "/confluence"
label = "Confluence"

[[plugin.nav_links]]
href  = "/bitbucket"
label = "Bitbucket"

# Sidebar panels declared by this plugin
[[plugin.nav_links]]
panel = "specs"

[[plugin.nav_links]]
panel = "schema"

[[plugin.nav_links]]
panel = "services"

# Search tools — exposed to orca's unified search (Cmd+K)
[[plugin.nav_links]]
panel = "projects"

[[plugin.search_tools]]
tool = "rebuy_docs_search"
arg  = "query"
root = "rebuy"
