[plugin]
id                = "rebuy"
version           = "1.0.0"
tier              = "external"
mode              = "rebuy"
context_injection = "full"

[plugin.mcp]
command = "node"
args    = ["/Users/scottkey/code/rebuy/rebuy-cli-mcp-server/build/index.js"]
# url — HTTP/SSE endpoint used instead of stdio in deploy mode (orca plugin add will store this)
# url = "https://mcp.your-domain.com/rebuy"

[plugin.specs]
dir = "~/code/rebuy/rebuy-docs/docs/gen"

# Plugins that extend the rebuy workspace — installed automatically and inherit rebuy's mode
[[plugin.uses]]
path = "../atlassian/orca-plugin.toml"

# Sidebar panels declared by this plugin
[[plugin.nav_links]]
panel = "specs"

[[plugin.nav_links]]
panel = "schema"

[[plugin.nav_links]]
panel = "services"

# Search tools — exposed to orca's unified search (Cmd+K)
[[plugin.nav_links]]
panel = "projects"

[[plugin.search_tools]]
tool = "rebuy_docs_search"
arg  = "query"
root = "rebuy"
