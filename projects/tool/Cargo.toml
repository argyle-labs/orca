[package]
name = "orca-tool"
version = "0.1.0"
edition = "2024"

[lib]
name = "tool"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[dependencies]
# Orca layer 0-1 only — never import orca-core, orca-agents, etc. here
config = { package = "orca-config", path = "../config" }

async-trait = "0.1"
schemars    = { version = "0.8", features = ["derive"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
futures     = "0.3"
