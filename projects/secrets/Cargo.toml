[package]
name = "secrets"
version.workspace = true
edition.workspace = true

[lib]
name = "secrets"
path = "src/lib.rs"

[dependencies]
# Low crate: depends on `db` only (pool/Connection/seam + settings inline
# store). `db` does NOT depend on plugin-toolkit/plugin-loader/auth, so this
# crate can sit BELOW auth and be consumed by plugin-toolkit (`db-incore`) and
# plugin-loader without forming a cycle.
db          = { package = "db", path = "../db" }
plugin-abi  = { path = "../plugin-abi" }

anyhow      = { workspace = true }
rusqlite    = { workspace = true }
tracing     = { workspace = true }

[dev-dependencies]
db = { path = "../db", features = ["test-util"] }

[lints]
workspace = true
