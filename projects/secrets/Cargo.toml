[package]
name = "orca-secrets"
version.workspace = true
publish = ["gitea"]
edition.workspace = true

[lib]
name = "secrets"
path = "src/lib.rs"

[dependencies]
# Low crate: depends on `db` only (pool/Connection/seam + settings inline
# store). `db` does NOT depend on plugin-toolkit/plugin-loader/auth, so this
# crate can sit BELOW auth and be consumed by plugin-toolkit (`db-incore`) and
# plugin-loader without forming a cycle.
db          = { workspace = true, default-features = true }
plugin-abi  = { workspace = true }
contract    = { workspace = true }
utils       = { workspace = true, features = ["reactor"] }

anyhow      = { workspace = true }
rusqlite    = { workspace = true }
tracing     = { workspace = true }

[dev-dependencies]
db = { workspace = true, default-features = true, features = ["test-util"] }
async-trait = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
