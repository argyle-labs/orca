[package]
name    = "orca-conformance-plugin"
version = "0.1.0"
edition.workspace = true

# The Rust reference conformance plugin. Run by the SDK conformance suite via
# `orca_sdk::conformance::run_subprocess` to verify the wire contract end-to-end.
# Every other language SDK port (Go, Kotlin, TypeScript) ships an analogous
# binary that must produce the same observations against the same scenario.

[[bin]]
name = "orca-conformance-plugin"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "net", "io-util", "sync"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
orca-sdk = { path = "../sdk" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
