[package]
name    = "orca-ntfy"
version = "0.1.0"
edition.workspace = true

[lib]
name = "orca_ntfy"
path = "src/lib.rs"

[dependencies]
anyhow      = "1"
orca-http   = { path = "../../http" }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
urlencoding = "2"

[dev-dependencies]
tokio    = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
