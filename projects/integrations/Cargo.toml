[package]
name    = "orca-integrations"
version = "0.1.0"
edition.workspace = true

[lib]
name = "orca_integrations"
path = "src/lib.rs"

[dependencies]
anyhow      = { workspace = true }
async-trait = { workspace = true }
schemars    = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tokio       = { workspace = true }
urlencoding = { workspace = true }

orca-utils = { path = "../utils" }
# Aliased as `db` to match call-site convention across the workspace. Used by
# the integration-owned OrcaTool impls to resolve endpoints by name.
db         = { package = "orca-db", path = "../db" }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = "0.6"
