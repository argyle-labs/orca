[package]
name    = "orca-smb"
version = "0.1.0"
edition.workspace = true

[lib]
name = "orca_smb"
path = "src/lib.rs"

[dependencies]
anyhow    = "1"
serde     = { version = "1", features = ["derive"] }
thiserror = "2"
tokio     = { version = "1", features = ["fs", "process", "time", "rt", "macros"] }

[dev-dependencies]
tempfile = "3"
