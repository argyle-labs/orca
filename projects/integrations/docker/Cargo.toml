[package]
name    = "orca-docker"
version = "0.1.0"
edition.workspace = true

[lib]
name = "orca_docker"
path = "src/lib.rs"

[dependencies]
anyhow     = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "1"
tokio      = { version = "1", features = ["process", "fs", "rt", "macros"] }

[dev-dependencies]
tempfile = "3"
