[package]
name = "homeassistant"
version.workspace = true
edition.workspace = true

[lib]
name = "homeassistant"
path = "src/lib.rs"

# Feature flavors:
#   - cli: adds clap derives on Args so the tools surface in the unified
#          `orca` CLI binary.
[features]
cli = [
    "dep:clap",
]
[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
urlencoding = { workspace = true }
orca-utils  = { path = "../../utils" }

# `#[orca_tool]` machinery — default tier carries the wasm-safe metadata
# impls so anyone consuming this crate gets the tool Args/Output schema even
# without the runtime.
orca-dispatch        = { path = "../../orca-dispatch" }
orca-contract    = { path = "../../orca-contract", default-features = false }
orca-macro       = { path = "../../orca-macro" }
schemars         = { workspace = true }
inventory        = { workspace = true }

# native-only — DB lookup for registered HA endpoints + error type +
# async-trait used by the macro-generated OrcaTool impl.
orca-db = { package = "orca-db", path = "../../db" }
anyhow = { workspace = true }
async-trait = { workspace = true }

# cli-only — clap derives on Args.
clap = { workspace = true, optional = true }

[dev-dependencies]
tokio    = { workspace = true }
wiremock = "0.6"

[lints]
workspace = true
