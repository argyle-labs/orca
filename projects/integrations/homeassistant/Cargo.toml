[package]
name = "homeassistant"
version.workspace = true
edition.workspace = true

[lib]
name = "homeassistant"
path = "src/lib.rs"

# Feature flavors mirror orca-tool's tiers:
#   - default (none): wasm-safe — HA REST client + Arg/Output metadata structs.
#   - native:         pulls runtime — orca-tool/native + orca-db lookup of
#                     registered HA endpoints, anyhow for tool body errors.
#   - cli:            adds clap derives on Args so the tools surface in the
#                     unified `orca` CLI binary. Implies `native`.
[features]
default = []
native = [
    "orca-tool/native",
    "dep:orca-db",
    "dep:anyhow",
    "dep:async-trait",
]
cli = [
    "native",
    "orca-tool/cli",
    "dep:clap",
]

[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
urlencoding = { workspace = true }
orca-utils  = { path = "../../utils" }

# `#[orca_tool]` machinery — default tier carries the wasm-safe metadata
# impls so anyone consuming this crate gets the tool Args/Output schema even
# without the runtime.
orca-tool        = { path = "../../orca-tool", default-features = false }
orca-tools-macro = { path = "../../tools-macro" }
schemars         = { workspace = true }
inventory        = { workspace = true }

# native-only — DB lookup for registered HA endpoints + error type +
# async-trait used by the macro-generated OrcaTool impl.
orca-db     = { package = "orca-db", path = "../../db", optional = true }
anyhow      = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }

# cli-only — clap derives on Args.
clap = { workspace = true, optional = true }

[dev-dependencies]
tokio    = { workspace = true }
wiremock = "0.6"

[lints]
workspace = true
