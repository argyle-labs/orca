[package]
name = "orca"
version = "0.1.0"
edition.workspace = true

[lib]
name = "orca"
path = "src/lib.rs"

[[bin]]
name = "orca"
path = "src/main.rs"

[features]
# Embed the compiled frontend (projects/frontend/dist/) into the binary.
# Off by default — headless builds (Meerkat, workers, native app backends) never set this.
# Only the CLI release artifact enables it via `--features ui`.
ui = ["dep:rust-embed", "dep:mime_guess"]

# Enable the /api/pdf endpoint — markdown → PDF rendering via typst.
# Off by default; pulls ~10 MB of typst + font + WASM crates into the binary.
pdf = ["dep:typst", "dep:typst-pdf", "dep:typst-assets", "dep:zip"]

[dependencies]
# Workspace crates
orca-sdk      = { path = "../sdk" }
orca-agents   = { path = "../agents" }
orca-commands = { path = "../commands" }
orca-docs     = { path = "../docs" }
orca-jobs     = { path = "../jobs" }
orca-scanner  = { path = "../scanner", features = ["php-ast"] }
llm           = { package = "orca-llm", path = "../llm" }
config        = { package = "orca-config", path = "../config" }
db            = { package = "orca-db", path = "../db" }
orca_fs       = { package = "orca-fs", path = "../fs" }
orca-docker   = { path = "../integrations/docker" }
orca-proxmox  = { path = "../integrations/proxmox" }
orca-homeassistant = { path = "../integrations/homeassistant" }
profile       = { package = "orca-profile", path = "../profile" }
state         = { package = "orca-state", path = "../state" }

# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP + streaming
# rustls-no-provider = no aws-lc; ring is installed as the process-default
# crypto provider at startup (see main.rs).
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider", "form", "query"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
serde_yaml = "0.9"

# Async traits
async-trait = "0.1"

# Schema derivation for OrcaTool impls
schemars = { version = "1", features = ["derive"] }

# Runtime JSON-Schema validation: applied to TypedValue payloads on
# orca/context.publish so declarations from orca/types.declare are enforced.
jsonschema = { version = "0.30", default-features = false }
tool    = { package = "orca-tool",    path = "../tool" }
conversation = { package = "orca-conversation", path = "../conversation" }

# Error handling
anyhow = "1"

# Terminal / readline
rustyline = "18"
colored = "3"

# Cancellation
tokio-util = "0.7"

# Utilities
dirs = "6"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
regex = "1"
pulldown-cmark = "0.13"

# Web server
axum = { version = "0.8", features = ["macros", "ws"] }
# Dev proxy only connects to ws://localhost — no TLS needed here.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
tower-http = { version = "0.6", features = ["cors"] }
http-body-util = "0.1"

# TLS (for plugin host — shared version with rustls already in the tree)
rustls          = { version = "0.23", default-features = false, features = ["ring"] }
tokio-rustls    = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pki-types = "1"
rustls-pemfile  = "2"

# Optional — only compiled when `--features ui` embeds the frontend dist/
mime_guess = { version = "2", optional = true }
rust-embed = { version = "8", optional = true }

# PDF generation — gated behind `pdf` feature (off by default, ~10 MB).
typst        = { version = "0.14", optional = true }
typst-pdf    = { version = "0.14", optional = true }
typst-assets = { version = "0.14", features = ["fonts"], optional = true }
zip          = { version = "8", default-features = false, features = ["deflate"], optional = true }

# Database drivers (schema introspection — pure Rust, no CLI dependency)
mysql_async    = { version = "0.36", default-features = false, features = ["default-rustls-ring"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
rusqlite       = { version = "0.39", features = ["bundled-sqlcipher"] }

# OpenAPI
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"

# TUI
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

# Logging (off by default, enabled via ORCA_LOG=debug)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
db = { package = "orca-db", path = "../db" }
