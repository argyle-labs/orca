[package]
name = "orca"
version = "0.1.0"
edition.workspace = true

[lib]
name = "orca"
path = "src/lib.rs"

[[bin]]
name = "orca"
path = "src/main.rs"

[features]
# Embed the compiled frontend (projects/frontend/dist/) into the binary.
# Off by default — headless builds (Meerkat, workers, native app backends) never set this.
# Only the CLI release artifact enables it via `--features ui`.
ui = ["dep:mime_guess"]

# Enable the /api/pdf endpoint — markdown → PDF rendering via typst.
# Off by default; pulls ~10 MB of typst + font + WASM crates into the binary.
pdf = ["dep:typst", "dep:typst-pdf", "dep:typst-assets", "dep:zip"]

# Enable AST-based PHP analysis via tree-sitter-php (was scanner's php-ast feature).
php-ast = ["dep:tree-sitter", "dep:tree-sitter-php"]

[dependencies]
# Workspace crates
orca-sdk           = { path = "../sdk/rust" }
orca-utils         = { path = "../utils" }
db                 = { package = "orca-db", path = "../db" }
orca-integrations  = { path = "../integrations" }
orca-tools         = { path = "../tools" }
orca-tools-def     = { path = "../tools-def", features = ["native", "cli"] }

# CLI
clap = { workspace = true }

# Async runtime
tokio        = { workspace = true }
tokio-util   = { workspace = true }
futures-util = { workspace = true }

# HTTP + streaming
# rustls-no-provider = no aws-lc; ring is installed as the process-default
# crypto provider at startup (see main.rs).
reqwest = { workspace = true, features = ["blocking"] }
url     = { workspace = true }

# Serialization
serde      = { workspace = true }
serde_json = { workspace = true }
toml       = { workspace = true }
serde_yaml = { workspace = true }

# Async traits
async-trait = { workspace = true }

# Schema derivation for OrcaTool impls
schemars = { workspace = true }

# Runtime JSON-Schema validation: applied to TypedValue payloads on
# orca/context.publish so declarations from orca/types.declare are enforced.
jsonschema = { workspace = true }

# Error handling
anyhow    = { workspace = true }
thiserror = { workspace = true }

# Crypto / encoding (from merged commands + scanner)
sha2   = { workspace = true }
rand   = { workspace = true }
base64 = "0.22"

# Text width measurement (TUI from merged conversation)
unicode-width = "0.2"

# Scanner deps (from merged scanner crate)
graphql-parser  = "0.4"
tree-sitter     = { version = "0.24", optional = true }
tree-sitter-php = { version = "0.24", optional = true }

# Terminal / readline
rustyline = { workspace = true }
colored   = { workspace = true }

# Utilities
dirs           = { workspace = true }
uuid           = { workspace = true }
chrono         = { workspace = true }
glob           = { workspace = true }
regex          = { workspace = true }
pulldown-cmark = { workspace = true }

# Web server
axum = { workspace = true }
# Dev proxy only connects to ws://localhost — no TLS needed here.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
tower-http = { version = "0.6", features = ["cors"] }
http-body-util = "0.1"

# TLS (for plugin host — shared version with rustls already in the tree)
rustls           = { workspace = true }
tokio-rustls     = { workspace = true }
rustls-pki-types = { workspace = true }
rustls-pemfile   = { workspace = true }

# rust-embed: now always built — needed by docs/agents modules for embedded
# assets. mime_guess stays gated to the `ui` feature (serves frontend dist).
rust-embed = { workspace = true }
mime_guess = { workspace = true, optional = true }

# PDF generation — gated behind `pdf` feature (off by default, ~10 MB).
typst        = { version = "0.14", optional = true }
typst-pdf    = { version = "0.14", optional = true }
typst-assets = { version = "0.14", features = ["fonts"], optional = true }
zip          = { version = "8", default-features = false, features = ["deflate"], optional = true }

# Database drivers (schema introspection — pure Rust, no CLI dependency)
mysql_async    = { version = "0.36", default-features = false, features = ["default-rustls-ring"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
rusqlite       = { workspace = true }

# OpenAPI
utoipa = { workspace = true }
utoipa-axum = "0.2"

# TUI
ratatui   = { workspace = true }
crossterm = { workspace = true }

# Logging (off by default, enabled via ORCA_LOG=debug)
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile   = { workspace = true }
tower      = { workspace = true }
serde_json = { workspace = true }
db = { package = "orca-db", path = "../db" }
