[package]
name = "orca"
version = "0.1.0"
edition = "2024"

[lib]
name = "orca"
path = "src/lib.rs"

[[bin]]
name = "orca"
path = "src/main.rs"

[dependencies]
# Workspace crates
brain-agents   = { path = "../agents" }
brain-commands = { path = "../commands" }
brain-core     = { path = "../core" }
brain-docs     = { path = "../docs" }
brain-jobs     = { path = "../jobs" }
brain-scanner  = { path = "../scanner", features = ["php-ast"] }
brain-utils    = { path = "../utils" }

# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP + streaming
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Async traits
async-trait = "0.1"

# Error handling
anyhow = "1"

# Terminal / readline
rustyline = "14"
colored = "2"

# Cancellation
tokio-util = "0.7"


# Utilities
dirs = "5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
regex = "1"

# Web server
axum = { version = "0.8", features = ["macros", "ws"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tower-http = { version = "0.6", features = ["cors"] }
http-body-util = "0.1"
mime_guess = "2"
rust-embed = "8"
serde_yaml = "0.9"
pulldown-cmark = "0.12"

# PDF generation (pure Rust, no external binary required)
typst        = "0.14"
typst-pdf    = "0.14"
typst-assets = { version = "0.14", features = ["fonts"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# OpenAPI
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"

# TUI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Logging (off by default, enabled via BRAIN_LOG=debug)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3"
