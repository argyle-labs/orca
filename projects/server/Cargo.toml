[package]
name = "orca"
version.workspace = true
edition.workspace = true

[lib]
name = "orca"
path = "src/lib.rs"

[[bin]]
name = "orca"
path = "src/main.rs"

[features]
default = ["ui", "native", "cli"]

# No-op feature flags expected by `#[orca_tool]` codegen — the macro emits
# `#[cfg(feature = "native")]` / `cfg(feature = "cli")]` on its generated
# items. The server binary is always native+cli, so we just enable them.
native = []
cli = []

# Embed the compiled frontend (projects/frontend/dist/) into the binary.
# On by default. Disable with `--no-default-features` for a true headless build.
# Runtime serving is additionally gated by the `ui.enabled` DB setting.
ui = ["dep:mime_guess", "system/ui"]

# Enable the /api/pdf endpoint — markdown → PDF rendering via typst.
# Off by default; pulls ~10 MB of typst + font + WASM crates into the binary.
pdf = ["dep:typst", "dep:typst-pdf", "dep:typst-assets", "dep:zip"]

[dependencies]
# Workspace crates
orca-sdk   = { path = "../sdk/rust" }
orca-utils = { path = "../utils" }
orca-dispatch = { path = "../orca-dispatch" }
orca-macro    = { path = "../orca-macro" }
inventory     = { workspace = true }
orca-contract = { path = "../orca-contract", features = ["native"] }
db         = { package = "orca-db", path = "../db" }
# Domain crates
auth     = { path = "../auth",     features = ["native", "cli"] }
fleet    = { path = "../fleet",    features = ["native", "cli"] }
system   = { path = "../system",   features = ["native", "cli"] }
platform = { path = "../platform", features = ["native", "cli"] }
agents   = { path = "../agents",   features = ["native", "cli"] }
plugins  = { path = "../plugins",  features = ["native", "cli"] }
docs     = { path = "../docs",     features = ["native", "cli"] }
mcp      = { path = "../mcp",      features = ["native", "cli"] }
llm      = { path = "../llm" }
scanner  = { path = "../scanner" }
schema   = { path = "../schema",   features = ["native", "cli"] }
# Integration crates (flat names, no facade)
docker        = { path = "../integrations/docker",        features = ["native", "cli"] }
dockge        = { path = "../integrations/dockge" }
homeassistant = { path = "../integrations/homeassistant", features = ["native", "cli"] }
nfs           = { path = "../integrations/nfs" }
ntfy          = { path = "../integrations/ntfy" }
proxmox       = { path = "../integrations/proxmox",       features = ["native", "cli"] }
smb           = { path = "../integrations/smb" }
unraid        = { path = "../integrations/unraid" }

# CLI
clap = { workspace = true }

# Async runtime
tokio        = { workspace = true }
tokio-util   = { workspace = true }
futures-util = { workspace = true }

# HTTP + streaming
# rustls-no-provider = no aws-lc; ring is installed as the process-default
# crypto provider at startup (see main.rs).
reqwest = { workspace = true, features = ["blocking"] }
url     = { workspace = true }

# Serialization
serde      = { workspace = true }
serde_json = { workspace = true }
toml       = { workspace = true }
serde_yaml = { workspace = true }

# Async traits
async-trait = { workspace = true }

# Schema derivation for OrcaTool impls
schemars = { workspace = true }

# Runtime JSON-Schema validation: applied to TypedValue payloads on
# orca/context.publish so declarations from orca/types.declare are enforced.
jsonschema = { workspace = true }

# Error handling
anyhow    = { workspace = true }
thiserror = { workspace = true }

# Crypto / encoding (from merged commands + scanner)
sha2   = { workspace = true }
rand   = { workspace = true }
base64 = "0.22"
# Argon2id for web-UI password hashing (auth.signup / signin / reset_password).
argon2 = "0.5"
# TTY echo-off password prompt for `orca admin reset-password`.
rpassword = "7"

# Bootstrap signing for pod offer / join-confirm frames.
ed25519-dalek = { workspace = true }

# mDNS for pod peer discovery on the LAN. Pure-Rust, no avahi/bonjour dep.
# We bridge its flume::Receiver<ServiceEvent> into a tokio task at startup.
mdns-sd = "0.19"

# Enumerate local network interfaces for host addressing autodetect
# (host_identity::detect_all). Pure Rust, cross-platform.
if-addrs = "0.14"

# Cross-platform system snapshot for system.runtime-spec / pod.list.
sysinfo = { workspace = true }

# Text width measurement (TUI from merged conversation)
unicode-width = "0.2"

# Terminal / readline
rustyline = { workspace = true }
colored   = { workspace = true }

# Utilities
dirs           = { workspace = true }
uuid           = { workspace = true }
chrono         = { workspace = true }
cron           = { workspace = true }
glob           = { workspace = true }
regex          = { workspace = true }
pulldown-cmark = { workspace = true }

# Web server
axum = { workspace = true }
# rustls-no-provider matches the workspace ring-only stance; main.rs installs the process default.
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
# Dev proxy only connects to ws://localhost — no TLS needed here.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
tower-http = { version = "0.6", features = ["cors"] }
http-body-util = "0.1"

# TLS (for plugin host — shared version with rustls already in the tree)
rustls           = { workspace = true }
tokio-rustls     = { workspace = true }
rustls-pki-types = { workspace = true }
rustls-pemfile   = { workspace = true }

# rust-embed: now always built — needed by docs/agents modules for embedded
# assets. mime_guess stays gated to the `ui` feature (serves frontend dist).
rust-embed = { workspace = true }
mime_guess = { workspace = true, optional = true }

# PDF generation — gated behind `pdf` feature (off by default, ~10 MB).
typst        = { version = "0.14", optional = true }
typst-pdf    = { version = "0.14", optional = true }
typst-assets = { version = "0.14", features = ["fonts"], optional = true }
zip          = { version = "8", default-features = false, features = ["deflate"], optional = true }

# Database drivers (schema introspection — pure Rust, no CLI dependency)
mysql_async    = { version = "0.36", default-features = false, features = ["default-rustls-ring"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
rusqlite       = { workspace = true }

# OpenAPI
utoipa = { workspace = true }
utoipa-axum = "0.2"

# TUI
ratatui   = { workspace = true }
crossterm = { workspace = true }

# Logging (off by default, enabled via ORCA_LOG=debug)
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile   = { workspace = true }
tower      = { workspace = true }
serde_json = { workspace = true }
db = { package = "orca-db", path = "../db" }

[lints]
workspace = true
