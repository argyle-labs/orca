[package]
name = "orca"
version = "0.1.0"
edition.workspace = true

[lib]
name = "orca"
path = "src/lib.rs"

[[bin]]
name = "orca"
path = "src/main.rs"

[features]
# Embed the compiled frontend (projects/frontend/dist/) into the binary.
# Off by default — headless builds (Meerkat, workers, native app backends) never set this.
# Only the CLI release artifact enables it via `--features ui`.
ui = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
# Workspace crates
orca-agents   = { path = "../agents" }
orca-commands = { path = "../commands" }
orca-docs     = { path = "../docs" }
orca-jobs     = { path = "../jobs" }
orca-scanner  = { path = "../scanner", features = ["php-ast"] }
llm           = { package = "orca-llm", path = "../llm" }
config        = { package = "orca-config", path = "../config" }
db            = { package = "orca-db", path = "../db" }
orca_fs       = { package = "orca-fs", path = "../fs" }
state         = { package = "orca-state", path = "../state" }

# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP + streaming
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "form", "query"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
serde_yaml = "0.9"

# Async traits
async-trait = "0.1"

# Schema derivation for OrcaTool impls
schemars = { version = "1", features = ["derive"] }
tool    = { package = "orca-tool",    path = "../tool" }
conversation = { package = "orca-conversation", path = "../conversation" }

# Error handling
anyhow = "1"

# Terminal / readline
rustyline = "18"
colored = "3"

# Cancellation
tokio-util = "0.7"

# Utilities
dirs = "6"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
regex = "1"
pulldown-cmark = "0.13"

# Web server
axum = { version = "0.8", features = ["macros", "ws"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tower-http = { version = "0.6", features = ["cors"] }
http-body-util = "0.1"

# Optional — only compiled when `--features ui` embeds the frontend dist/
mime_guess = { version = "2", optional = true }
rust-embed = { version = "8", optional = true }

# PDF generation (pure Rust, no external binary required)
typst        = "0.14"
typst-pdf    = "0.14"
typst-assets = { version = "0.14", features = ["fonts"] }
zip = { version = "8", default-features = false, features = ["deflate"] }

# Database drivers (schema introspection — pure Rust, no CLI dependency)
mysql_async    = { version = "0.36", default-features = false, features = ["default-rustls"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
rusqlite       = { version = "0.39", features = ["bundled-sqlcipher"] }

# OpenAPI
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"

# TUI
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

# Logging (off by default, enabled via ORCA_LOG=debug)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
