[package]
name = "fleet"
version.workspace = true
edition.workspace = true

[lib]
name = "fleet"
path = "src/lib.rs"

[features]
cli = [
    "dep:clap",
    "dep:colored",
]
# Marker feature mirroring `orca/ui` — runtime check via `cfg!(feature = "ui")`.
ui = []
[dependencies]
orca-dispatch        = { path = "../orca-dispatch" }
orca-contract    = { path = "../orca-contract", default-features = false }
orca-macro       = { path = "../orca-macro" }
system           = { path = "../system" }
schemars         = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
inventory        = { workspace = true }

orca-utils = { path = "../utils" }
db = { package = "orca-db", path = "../db" }
anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
cron              = { workspace = true,         optional = true }
clap              = { workspace = true,         optional = true }
colored           = { workspace = true,         optional = true }
docker = { path = "../integrations/docker", default-features = false }
orca-sdk = { path = "../sdk/rust" }
tracing = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rusqlite = { workspace = true }
mdns-sd = { version = "0.19" }
sha2 = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
if-addrs = { version = "0.14" }
rustls-pemfile = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
# NOTE: cross-bucket inventory smoke tests moved to `projects/inventory-tests/`
# (sibling crate). They can't live here because `plugins` depends on `fleet`,
# so adding `plugins` as a dev-dep would link fleet twice in the test binary
# (once as the lib under test, once via plugins), duplicating every
# `#[orca_tool]` inventory registration and panicking `orca_dispatch::cache()`.

[lints]
workspace = true
