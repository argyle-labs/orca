[package]
name = "fleet"
version.workspace = true
edition.workspace = true

[lib]
name = "fleet"
path = "src/lib.rs"

[features]
default = []
native = [
    "orca-contract/native",
    "dep:orca-utils",
    "dep:orca-db",
    "dep:anyhow",
    "dep:async-trait",
    "dep:tokio",
    "dep:chrono",
    "dep:docker",
    "docker/native",
]
cli = [
    "native",
    "dep:clap",
    "dep:colored",
]

[dependencies]
orca-dispatch        = { path = "../orca-dispatch" }
orca-contract    = { path = "../orca-contract", default-features = false }
orca-macro       = { path = "../orca-macro" }
system           = { path = "../system" }
schemars         = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
inventory        = { workspace = true }

orca-utils        = { path = "../utils",        optional = true }
orca-db           = { package = "orca-db", path = "../db", optional = true }
anyhow            = { workspace = true,         optional = true }
async-trait       = { workspace = true,         optional = true }
tokio             = { workspace = true,         optional = true }
chrono            = { workspace = true,         optional = true }
cron              = { workspace = true,         optional = true }
clap              = { workspace = true,         optional = true }
colored           = { workspace = true,         optional = true }
docker            = { path = "../integrations/docker", optional = true, default-features = false }

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
# Inventory cross-bucket smoke tests link every domain in so the full
# `#[orca_tool]` graph is exercised end-to-end in one test binary.
auth          = { path = "../auth",     features = ["native"] }
platform      = { path = "../platform", features = ["native"] }
agents        = { path = "../agents",   features = ["native"] }
plugins       = { path = "../plugins",  features = ["native"] }
docs          = { path = "../docs",     features = ["native"] }
mcp           = { path = "../mcp",      features = ["native"] }
homeassistant = { path = "../integrations/homeassistant", features = ["native"] }
proxmox       = { path = "../integrations/proxmox",       features = ["native"] }
system        = { path = "../system",                     features = ["native"] }

[lints]
workspace = true
