[package]
name = "orca-notifications"
version.workspace = true
publish = ["gitea"]
edition.workspace = true

[lib]
name = "notifications"
path = "src/lib.rs"

[features]
# Default-on so the daemon is unchanged; opt-out so a thin plugin carries no
# TOML parser. Gates `RoutingConfig::from_toml`.
default = ["config", "store"]
config = ["dep:toml"]
store = ["dep:db", "dep:rusqlite", "dep:lettre"]

[dependencies]
macro-runtime = { workspace = true }
db          = { workspace = true, optional = true }
rusqlite    = { workspace = true, optional = true }
# Light core only (`utils::time` — the sole module this crate uses). Taking
# `utils`' `full` default here re-enabled `config_format` for the WHOLE graph via
# feature unification, so every thin plugin linked an XML parser again even after
# #606 opted `contract` and `containers` out. Measured on proxmox at v0.2.1-rc.3.
utils       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
# Drives the cdylib JSON-proxy backend (`NotifyProxy`) off the async runtime via
# `spawn_blocking`, mirroring `storage::StorageProxy`. Runtime-only use.
tokio       = { workspace = true }
thiserror   = { workspace = true }
toml        = { workspace = true, optional = true }
anyhow      = { workspace = true }
lettre      = { workspace = true, optional = true }
tracing     = { workspace = true }

# `#[orca_tool]` machinery.
derive      = { workspace = true }
schemars    = { workspace = true }

clap        = { workspace = true }

[dev-dependencies]
db = { workspace = true, default-features = true, features = ["test-util"] }
tokio = { workspace = true }

[lints]
workspace = true
