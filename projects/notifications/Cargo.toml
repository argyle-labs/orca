[package]
name = "notifications"
version.workspace = true
edition.workspace = true

[lib]
name = "notifications"
path = "src/lib.rs"

[dependencies]
macro-runtime = { path = "../macro-runtime" }
db          = { package = "db", path = "../db" }
rusqlite    = { workspace = true }
# Light core only (`utils::time` — the sole module this crate uses). Taking
# `utils`' `full` default here re-enabled `config_format` for the WHOLE graph via
# feature unification, so every thin plugin linked an XML parser again even after
# #606 opted `contract` and `containers` out. Measured on proxmox at v0.2.1-rc.3.
utils       = { path = "../utils", default-features = false }
serde       = { workspace = true }
serde_json  = { workspace = true }
# Drives the cdylib JSON-proxy backend (`NotifyProxy`) off the async runtime via
# `spawn_blocking`, mirroring `storage::StorageProxy`. Runtime-only use.
tokio       = { workspace = true }
thiserror   = { workspace = true }
toml        = { workspace = true }
anyhow      = { workspace = true }
lettre      = { workspace = true }
tracing     = { workspace = true }

# `#[orca_tool]` machinery.
derive      = { path = "../derive" }
schemars    = { workspace = true }

clap        = { workspace = true }

[dev-dependencies]
db = { path = "../db", features = ["test-util"] }
tokio = { workspace = true }

[lints]
workspace = true
