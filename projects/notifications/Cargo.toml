[package]
name = "notifications"
version.workspace = true
edition.workspace = true

[lib]
name = "notifications"
path = "src/lib.rs"

[dependencies]
macro-runtime = { path = "../macro-runtime" }
db          = { package = "db", path = "../db" }
rusqlite    = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
# Drives the cdylib JSON-proxy backend (`NotifyProxy`) off the async runtime via
# `spawn_blocking`, mirroring `storage::StorageProxy`. Runtime-only use.
tokio       = { workspace = true }
thiserror   = { workspace = true }
toml        = { workspace = true }
anyhow      = { workspace = true }

# `#[orca_tool]` machinery.
derive      = { path = "../derive" }
schemars    = { workspace = true }

clap        = { workspace = true }

[dev-dependencies]
db = { path = "../db", features = ["test-util"] }
tokio = { workspace = true }

[lints]
workspace = true
