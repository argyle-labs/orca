[package]
name = "notifications"
version.workspace = true
edition.workspace = true

[lib]
name = "notifications"
path = "src/lib.rs"

[features]
# Default-on so the daemon is unchanged; opt-out so a thin plugin carries no
# TOML parser. Gates `RoutingConfig::from_toml`.
default = ["config"]
config = ["dep:toml"]

[dependencies]
macro-runtime = { path = "../macro-runtime" }
# `default-features = false` drops `db`'s `http` feature, and with it reqwest.
# This edge is the ONLY path by which `db` reaches a thin plugin's graph
# (`db` -> `notifications` -> `containers` -> `plugin-toolkit`), so taking `db`'s
# defaults here linked the whole HTTP + TLS stack into every plugin — including
# ones that never make an outbound request. This crate uses only
# `db::{pool, settings::get, settings::secret_get}`, none of which need http.
# The daemon is unaffected: server/runtime/mcp/spec still take `db`'s defaults,
# and cargo unifies the feature back on for that build.
db          = { package = "db", path = "../db", default-features = false }
rusqlite    = { workspace = true }
# Light core only (`utils::time` — the sole module this crate uses). Taking
# `utils`' `full` default here re-enabled `config_format` for the WHOLE graph via
# feature unification, so every thin plugin linked an XML parser again even after
# #606 opted `contract` and `containers` out. Measured on proxmox at v0.2.1-rc.3.
utils       = { path = "../utils", default-features = false }
serde       = { workspace = true }
serde_json  = { workspace = true }
# Drives the cdylib JSON-proxy backend (`NotifyProxy`) off the async runtime via
# `spawn_blocking`, mirroring `storage::StorageProxy`. Runtime-only use.
tokio       = { workspace = true }
thiserror   = { workspace = true }
# Optional, behind the default-on `config` feature. Only `RoutingConfig::from_toml`
# uses it — a daemon-side config concern. This crate sits in every THIN plugin's
# graph (`notifications` -> `containers` -> `plugin-toolkit`), so a non-optional
# toml here put a parser in plugins that never read a config file.
toml        = { workspace = true, optional = true }
anyhow      = { workspace = true }
lettre      = { workspace = true }
tracing     = { workspace = true }

# `#[orca_tool]` machinery.
derive      = { path = "../derive" }
schemars    = { workspace = true }

clap        = { workspace = true }

[dev-dependencies]
db = { path = "../db", features = ["test-util"] }
tokio = { workspace = true }

[lints]
workspace = true
