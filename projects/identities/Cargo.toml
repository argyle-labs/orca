[package]
name = "orca-identities"
publish = false
version.workspace = true
edition.workspace = true

[lib]
name = "identities"
path = "src/lib.rs"

# The `identities` domain: WHO exists — user/account storage (mesh-replicated)
# and the claim-identity mint (stable UUIDv7 per claimed child). Low domain:
# depends only on db (pool + replication engine) + the derive/replication
# machinery. Schema (CREATE TABLE) stays in db::apply_schema.
[dependencies]
db            = { workspace = true, default-features = true }
derive        = { workspace = true }
macro-runtime = { workspace = true }
utils         = { workspace = true, default-features = true }

anyhow   = { workspace = true }
rusqlite = { workspace = true }
serde    = { workspace = true }
tracing  = { workspace = true }

[dev-dependencies]
db = { workspace = true, default-features = true, features = ["test-util"] }

[lints]
workspace = true
