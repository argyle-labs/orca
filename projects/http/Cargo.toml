[package]
name    = "orca-http"
version = "0.1.0"
edition.workspace = true

[lib]
name = "orca_http"
path = "src/lib.rs"

[dependencies]
anyhow     = "1"
reqwest    = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "stream", "query", "form"] }
rustls     = { version = "0.23", default-features = false, features = ["ring"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "1"
tokio      = { version = "1", features = ["sync", "time"] }
url        = "2"

[dev-dependencies]
tokio  = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
