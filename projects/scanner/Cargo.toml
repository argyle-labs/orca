[package]
name = "brain-scanner"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
graphql-parser = "0.4"
utoipa = { version = "4", features = ["axum_extras"] }
