[package]
name = "brain-scanner"
version = "0.1.0"
edition = "2024"

[features]
# Enable AST-based PHP analysis via tree-sitter-php.
# Without this feature the php_parse module compiles but PhpFile::parse()
# always returns None — callers degrade gracefully.
php-ast = ["dep:tree-sitter", "dep:tree-sitter-php"]

[dependencies]
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
graphql-parser = "0.4"
utoipa = { version = "5", features = ["axum_extras"] }

# PHP AST parsing — optional, gated behind the `php-ast` feature
tree-sitter = { version = "0.24", optional = true }
tree-sitter-php = { version = "0.24", optional = true }
