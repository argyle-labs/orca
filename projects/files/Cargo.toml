[package]
name = "orca-files"
publish = false
version.workspace = true
edition.workspace = true

[lib]
name = "files"
path = "src/lib.rs"

[dependencies]
plugin-toolkit = { workspace = true, default-features = true }
contract = { workspace = true }
derive    = { workspace = true }
db        = { workspace = true, default-features = true }
utils     = { workspace = true, default-features = true }

schemars      = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }

anyhow = { workspace = true }
# Forced-past-validation writes must leave a trace (#563): an unparseable
# config written deliberately and one written by accident look identical later.
tracing = { workspace = true }
rusqlite = { workspace = true }
thiserror   = { workspace = true }
tokio = { workspace = true }
clap        = { workspace = true }

# Embedded docs
rust-embed  = { workspace = true }

# Tree schemas
utoipa      = { workspace = true }

# Markdown stripping
regex       = { workspace = true }

# Atomic writes
tempfile    = { workspace = true }

# Filesystem watch
notify      = { workspace = true }

# Glob ignore patterns

[lints]
workspace = true

[dev-dependencies]
db = { workspace = true, default-features = true, features = ["test-util"] }
