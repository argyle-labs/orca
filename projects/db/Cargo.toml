[package]
name = "orca-db"
version = "0.1.0"
edition.workspace = true

[lib]
name = "db"
path = "src/lib.rs"

[dependencies]
config  = { package = "orca-config", path = "../config" }

anyhow     = "1"
tracing    = "0.1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
chrono     = { version = "0.4", features = ["serde"] }
rusqlite   = { version = "0.39", features = ["bundled-sqlcipher-vendored-openssl"] }
rand       = "0.8"
dirs       = "6"
toml       = "1"
