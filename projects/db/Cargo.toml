[package]
name = "orca-db"
version.workspace = true
publish = ["gitea"]
edition.workspace = true

[lib]
name = "db"
path = "src/lib.rs"

[features]
default = ["http", "config"]
http = ["dep:reqwest"]
config = ["dep:toml"]
# Exposes `db::testing::test_conn` (an in-memory schema+migrations connection)
# to downstream crates' test binaries. Enabled by domain crates that own query
# helpers moved out of `db` (auth/model/files/mcp) via a `[dev-dependencies]`
# entry, so it never enters a production build.
test-util = []

[dependencies]
macro-runtime = { workspace = true, features = ["replication"] }
plugin-abi  = { workspace = true }
# `rt` only (for `utils::shutdown`); the rest of what this crate uses —
# hash/id/path/reachability/route/time/url — is ungated. `utils`' `full` default
# pulled yaml/toml/xml/git/http, and feature unification pushed that onto every
# thin plugin through `contract`, undoing #606. Measured on proxmox at v0.2.1-rc.3.
utils       = { workspace = true, features = ["rt"] }
contract    = { workspace = true, default-features = true }
derive       = { workspace = true }

anyhow      = { workspace = true }
tracing     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
rusqlite    = { workspace = true }
include_dir = { workspace = true }
getrandom   = { workspace = true }
toml        = { workspace = true, optional = true }
schemars    = { workspace = true }
sha2        = { workspace = true }
async-trait = { workspace = true }
inventory   = { workspace = true }
reqwest     = { workspace = true, features = ["blocking"], optional = true }
# Foreign-database schema introspection (`db::schema`) — connects to external
# MySQL/Postgres engines to render the `schema.*` tabbed view. Folded in from
# the former standalone `database` crate (2026-07-01).
mysql_async    = { workspace = true }
tokio-postgres = { workspace = true }

# In-memory cache for hot reads (host_status latest, runtime spec). Sits
# above the connection pool — sub-µs hit, falls through to SQLite on miss.
# TTL + max_capacity bounded so it cannot grow unbounded.
moka        = { workspace = true }

clap        = { workspace = true }
# Used only for `task_local!` — the right primitive for scoping a DB path
# override across `.await` points and worker threads. Cheap: `rt` feature
# alone, no runtime is constructed in this crate.
tokio      = { workspace = true, features = ["rt"] }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }
tokio    = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
rustls   = { workspace = true }

# `cargo run --release --example db_bench` to run the perf microbench. See
# the file header for baseline-vs-current measurement methodology.
[[example]]
name = "db_bench"
path = "examples/db_bench.rs"

[lints]
workspace = true
