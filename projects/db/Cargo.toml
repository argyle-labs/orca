[package]
name = "db"
version.workspace = true
edition.workspace = true

[lib]
name = "db"
path = "src/lib.rs"

[dependencies]
macro-runtime = { path = "../macro-runtime" }
utils       = { path = "../utils" }
dispatch    = { path = "../dispatch" }
contract    = { path = "../contract" }
derive       = { path = "../derive" }
db-types    = { path = "../db-types" }

anyhow      = { workspace = true }
tracing     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
chrono      = { workspace = true }
rusqlite    = { workspace = true }
include_dir = "0.7"
getrandom   = "0.3"
dirs        = { workspace = true }
toml        = { workspace = true }
schemars    = { workspace = true }
sha2        = { workspace = true }
async-trait = { workspace = true }
cron        = { workspace = true }
inventory   = { workspace = true }
reqwest     = { workspace = true, features = ["blocking"] }

clap        = { workspace = true }
# Used only for `task_local!` — the right primitive for scoping a DB path
# override across `.await` points and worker threads. Cheap: `rt` feature
# alone, no runtime is constructed in this crate.
tokio      = { workspace = true, features = ["rt"] }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = "0.6"
tokio    = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
rustls   = { workspace = true }

# `cargo run --release --example db_bench` to run the perf microbench. See
# the file header for baseline-vs-current measurement methodology.
[[example]]
name = "db_bench"
path = "examples/db_bench.rs"

[lints]
workspace = true
