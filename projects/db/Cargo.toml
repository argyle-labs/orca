[package]
name = "orca-db"
version.workspace = true
edition.workspace = true

[lib]
name = "db"
path = "src/lib.rs"

[dependencies]
orca-utils = { path = "../utils" }

anyhow     = { workspace = true }
tracing    = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
chrono     = { workspace = true }
rusqlite   = { workspace = true }
getrandom  = "0.3"
dirs       = { workspace = true }
toml       = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# `cargo run --release --example db_bench` to run the perf microbench. See
# the file header for baseline-vs-current measurement methodology.
[[example]]
name = "db_bench"
path = "examples/db_bench.rs"
