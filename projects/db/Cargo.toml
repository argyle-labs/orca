[package]
name = "orca-db"
version = "0.1.0"
edition = "2024"

[lib]
name = "db"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
rand = "0.8"
dirs = "5"
