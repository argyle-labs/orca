[package]
name = "orca-namespace"
publish = false
version.workspace = true
edition.workspace = true

[lib]
name = "namespace"
path = "src/lib.rs"

# Namespace (formerly "profile") domain — per-user, shareable workspaces.
# Each namespace owns filesystem content (`~/.orca/profiles/<id>/`) and
# metadata in orca.db. Free fns called directly by `#[orca_tool]` sites
# (no service trait, per feedback_no_indirection).

[dependencies]
plugin-toolkit = { workspace = true, default-features = true }
contract = { workspace = true }
derive    = { workspace = true }
schemars      = { workspace = true }
serde         = { workspace = true }

utils = { workspace = true, default-features = true }
db         = { workspace = true, default-features = true }
anyhow     = { workspace = true }
rusqlite   = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
clap       = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
