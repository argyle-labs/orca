[package]
name    = "orca-git"
version = "0.1.0"
edition.workspace = true

[lib]
name = "orca_git"
path = "src/lib.rs"

[dependencies]
anyhow    = { workspace = true }
serde     = { workspace = true }
thiserror = { workspace = true }
# libgit2 binding. Vendored static link so the orca host binary stays
# self-contained without an external libgit2.
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2", "vendored-openssl"] }

[dev-dependencies]
tempfile = { workspace = true }
