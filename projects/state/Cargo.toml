[package]
name = "orca-state"
version = "0.1.0"
edition = "2024"

[lib]
name = "state"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "5"

[dev-dependencies]
tempfile = "3"
