[package]
name = "auth"
version.workspace = true
edition.workspace = true

[lib]
name = "auth"
path = "src/lib.rs"

[features]
default = []
native = [
    "orca-contract/native",
    "dep:orca-utils",
    "dep:db",
    "dep:orca-sdk",
    "dep:anyhow",
    "dep:async-trait",
    "dep:tokio",
    "dep:dirs",
    "dep:base64",
    "dep:rand",
    "dep:sha2",
    "dep:url",
    "dep:hex",
    "dep:chrono",
    "dep:uuid",
    "dep:rusqlite",
    "dep:argon2",
    "dep:reqwest",
    "dep:tracing",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:rustls-pki-types",
]
cli = [
    "native",
    "dep:clap",
    "dep:colored",
]

[dependencies]
orca-dispatch        = { path = "../orca-dispatch" }
orca-contract    = { path = "../orca-contract", default-features = false }
orca-macro       = { path = "../orca-macro" }
schemars         = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
inventory        = { workspace = true }

orca-utils  = { path = "../utils", optional = true }
db          = { package = "orca-db", path = "../db", optional = true }
orca-sdk    = { path = "../sdk/rust", optional = true }
dirs        = { workspace = true, optional = true }
anyhow      = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
tokio       = { workspace = true, optional = true }
clap        = { workspace = true, optional = true }
colored     = { workspace = true, optional = true }
base64      = { version = "0.22", optional = true }
rand        = { workspace = true, optional = true }
sha2        = { workspace = true, optional = true }
url         = { workspace = true, optional = true }
hex         = { version = "0.4", optional = true }
chrono      = { workspace = true, optional = true }
uuid        = { workspace = true, optional = true }
rusqlite    = { workspace = true, optional = true }
argon2      = { version = "0.5", optional = true }
reqwest     = { workspace = true, optional = true }
tracing     = { workspace = true, optional = true }
rustls      = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
