[package]
name = "orca-auth"
publish = false
version.workspace = true
edition.workspace = true

[lib]
name = "auth"
path = "src/lib.rs"

[dependencies]
plugin-toolkit = { workspace = true, default-features = true }
macro-runtime = { workspace = true }
contract    = { workspace = true }
derive       = { workspace = true }
schemars         = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }

utils = { workspace = true, default-features = true }
files = { workspace = true }
db = { workspace = true, default-features = true }
identities = { workspace = true }
secrets = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
clap        = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
rusqlite = { workspace = true }
argon2 = { workspace = true }
reqwest = { workspace = true }
rpassword = { workspace = true }

[dev-dependencies]
db = { workspace = true, default-features = true, features = ["test-util"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
model      = { workspace = true }

[lints]
workspace = true
