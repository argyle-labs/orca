[package]
name = "orca-media"
version.workspace = true
publish = ["gitea"]
edition.workspace = true

[lib]
name = "media"
path = "src/lib.rs"

# ── Feature surface ─────────────────────────────────────────────────────
#
# Mirrors `storage`: `in-process` carries the tokio reactor + the host-side
# loaded-plugin proxy (`MediaProxy`/`register_from_def`/`InvokeThunk`) that drives
# a *loaded* plugin over the FFI boundary via `spawn_blocking`. Only the daemon
# does that, so it folds into `full`/default. A THIN subprocess plugin sets
# `default-features = false`: it keeps the always-on domain model + trait +
# registry + the plugin-side `dispatch_op`. tokio stays linked for `Budget`
# pacing; plugin-toolkit hard-links it already.
[features]
default = ["full"]
full = ["in-process"]
in-process = ["utils/reactor"]

[dependencies]
utils = { workspace = true, features = ["clock"] }
derive = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
schemars    = { workspace = true }
tokio       = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
