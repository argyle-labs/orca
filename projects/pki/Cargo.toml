[package]
name = "pki"
version.workspace = true
edition.workspace = true

[lib]
name = "pki"
path = "src/lib.rs"

# Federation PKI — CA generation, peer cert issuance, mTLS verification,
# signed envelopes, bootstrap channel keys. Sole consumer concern is the
# pod-mesh federation layer (peer-to-peer auth) plus the auth crate's
# capability-token signing. No plugin/SDK concept lives here.

[dependencies]
anyhow = { workspace = true }
serde  = { workspace = true }
serde_json = { workspace = true }
tokio  = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
rustls-pemfile   = { workspace = true }
tokio-rustls     = { workspace = true }
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
time = { version = "0.3", default-features = false, features = ["std"] }
base64 = "0.22"
x509-parser = "0.18"
tempfile = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { workspace = true }

[lints]
workspace = true
