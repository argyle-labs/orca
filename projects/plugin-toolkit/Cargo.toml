[package]
name = "plugin-toolkit"
version.workspace = true
edition.workspace = true

[lib]
name = "plugin_toolkit"
path = "src/lib.rs"

[dependencies]
# Ecosystem deps re-exported so macro emissions (#[orca_tool],
# endpoint_resource!, dispatch's register_op!) reach them via
# ::plugin_toolkit::*. Keeps plugin Cargo.tomls down to one orca dep.
anyhow      = { workspace = true }
async-trait = { workspace = true }
clap        = { workspace = true }
inventory   = { workspace = true }
abi_stable  = { workspace = true }
rusqlite    = { workspace = true }
schemars    = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }
# graphql_client's derive + the build-time codegen (plugin-toolkit-build) emit
# `::plugin_toolkit::graphql_client::*` paths, so the trait crate is re-exported
# here. Plugins never dep it directly. Default-features off (no reqwest client;
# transport is `plugin_toolkit::graphql`/`http`).
graphql_client = { workspace = true }
# Hashing primitive — re-exported via `plugin_toolkit::hash::sha256_hex` so
# plugins drop their own `sha2` dep.
sha2        = { workspace = true }

# Internal infra re-exported (trait anchors, macro definitions, db).
contract    = { path = "../contract", default-features = false }
db          = { package = "db", path = "../db" }
derive      = { path = "../derive" }
dispatch    = { path = "../dispatch" }
macro-runtime = { path = "../macro-runtime" }
notifications = { path = "../notifications" }
containers = { path = "../containers" }

# Runtime primitives — plugins reach these through the toolkit, never directly.
utils       = { path = "../utils" }
graphql     = { path = "../graphql" }
openapi     = { path = "../openapi" }
reqwest     = { workspace = true, features = ["cookies", "multipart"] }
regex       = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

[dev-dependencies]
tokio    = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
rustls   = { workspace = true }

[lints]
workspace = true
