[package]
name = "plugin-toolkit"
version.workspace = true
edition.workspace = true

[lib]
name = "plugin_toolkit"
path = "src/lib.rs"

[dependencies]
# Ecosystem deps re-exported so macro emissions (#[orca_tool],
# endpoint_resource!, dispatch's register_op!) reach them via
# ::plugin_toolkit::*. Keeps plugin Cargo.tomls down to one orca dep.
anyhow      = { workspace = true }
async-trait = { workspace = true }
clap        = { workspace = true }
inventory   = { workspace = true }
rusqlite    = { workspace = true }
schemars    = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }

# Internal infra re-exported (trait anchors, macro definitions, db).
contract    = { path = "../contract", default-features = false }
db          = { package = "db", path = "../db" }
db-types    = { path = "../db-types" }
derive      = { path = "../derive" }
dispatch    = { path = "../dispatch" }

# Runtime primitives — plugins reach these through the toolkit, never directly.
utils       = { path = "../utils" }
graphql     = { path = "../plugins/graphql" }
openapi     = { path = "../plugins/openapi" }

[lints]
workspace = true
