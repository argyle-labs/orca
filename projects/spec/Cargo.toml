[package]
name = "orca-spec"
publish = false
version.workspace = true
edition.workspace = true

[lib]
name = "spec"
path = "src/lib.rs"

# `spec.*` tool surface — OpenAPI + GraphQL specs registered in orca.db.
# First-class objects that assign to a namespace via `namespace_id`; not
# children of the namespace crate.

[dependencies]
plugin-toolkit = { workspace = true, default-features = true }
contract = { workspace = true }
derive   = { workspace = true }
db       = { workspace = true, default-features = true }
graphql  = { workspace = true, default-features = true }
mcp      = { workspace = true }


schemars   = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
anyhow     = { workspace = true }
utils      = { workspace = true, default-features = true }
clap       = { workspace = true }

[lints]
workspace = true
