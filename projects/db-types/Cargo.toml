[package]
name = "db-types"
version.workspace = true
edition.workspace = true

[lib]
name = "db_types"
path = "src/lib.rs"

# Domain: macro-emission target types for db-flavoured derive macros
# (`#[derive(Replicated)]` and `endpoint_resource!`). Lives BELOW `db` so
# the macro paths resolve without a cycle through `db` itself.
#
# This is a deliberate consolidation crate per
# `feedback-no-re-export-layers` — it owns ONE domain (db-target types
# for derive macros) and nothing else.

[dependencies]
anyhow      = { workspace = true }
inventory   = { workspace = true }
rusqlite    = { workspace = true }
serde_json  = { workspace = true }


[lints]
workspace = true
