[package]
name = "orca-conversation"
version = "0.1.0"
edition = "2024"

[lib]
name = "conversation"

[dependencies]
# Workspace crates
orca-agents = { path = "../agents" }
orca-jobs   = { path = "../jobs" }
llm         = { package = "orca-llm",     path = "../llm" }
config      = { package = "orca-config",  path = "../config" }
db          = { package = "orca-db",      path = "../db" }
# Async
anyhow      = "1"
async-trait = "0.1"
tokio       = { version = "1", features = ["full"] }
tokio-util  = "0.7"
futures-util = "0.3"

# Serialization
chrono     = { version = "0.4", features = ["serde"] }
serde_json = "1"
uuid       = { version = "1", features = ["v4"] }

# Terminal
colored         = "2"
rustyline       = "14"
crossterm       = { version = "0.28", features = ["event-stream"] }
ratatui         = "0.29"
dirs            = "5"
unicode-width   = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
