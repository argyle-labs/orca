[package]
name = "orca-profile"
version = "0.1.0"
edition.workspace = true

[lib]
name = "profile"
path = "src/lib.rs"

[dependencies]
config       = { package = "orca-config", path = "../config" }
db           = { package = "orca-db",     path = "../db" }
orca-agents  = { path = "../agents" }

anyhow   = "1"
thiserror = "2"
rusqlite = { version = "0.39", features = ["bundled-sqlcipher"] }
uuid     = { version = "1", features = ["v4"] }
tracing  = "0.1"

[dev-dependencies]
tempfile = "3"
