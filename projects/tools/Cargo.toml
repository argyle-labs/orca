[package]
name = "orca-tools"
version.workspace = true
edition.workspace = true

[lib]
name = "orca_tools"
path = "src/lib.rs"

[dependencies]
orca-tool      = { path = "../orca-tool", features = ["native"] }
# `native` feature pulls in the OrcaTool::run impls. Server-side consumers
# need this; the wasm client uses orca-tools-def directly without it.
orca-tools-def = { path = "../tools-def", features = ["native"] }
