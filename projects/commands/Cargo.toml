[package]
name = "orca-commands"
version = "0.1.0"
edition.workspace = true

[dependencies]
orca-sdk     = { path = "../sdk" }
orca-agents  = { path = "../agents" }
orca-scanner = { path = "../scanner", features = ["php-ast"] }
config       = { package = "orca-config", path = "../config" }
db           = { package = "orca-db", path = "../db" }
orca_fs      = { package = "orca-fs", path = "../fs" }
orca-http    = { path = "../http" }
profile      = { package = "orca-profile", path = "../profile" }
state        = { package = "orca-state", path = "../state" }

anyhow     = { workspace = true }
clap       = { workspace = true }
colored    = { workspace = true }
chrono     = { workspace = true }
# `blocking` is on top of the workspace base feature set.
reqwest    = { workspace = true, features = ["blocking"] }
tokio      = { workspace = true }
tokio-util = { workspace = true }
serde_json = { workspace = true }
serde      = { workspace = true }
toml       = { workspace = true }
sha2       = { workspace = true }
rusqlite   = { workspace = true }
dirs       = { workspace = true }
rand       = { workspace = true }
regex      = { workspace = true }
url        = { workspace = true }
base64     = "0.22"

[dev-dependencies]
tempfile = { workspace = true }
