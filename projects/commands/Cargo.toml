[package]
name = "brain-commands"
version = "0.1.0"
edition = "2024"

[dependencies]
brain-utils   = { path = "../utils" }
brain-agents  = { path = "../agents" }
brain-scanner = { path = "../scanner", features = ["php-ast"] }
brain-core    = { path = "../core" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
rand = "0.8"
base64 = "0.22"
keyring = "3"
url = "2"

[dev-dependencies]
tempfile = "3"
