[package]
name = "brain-commands"
version = "0.1.0"
edition = "2024"

[dependencies]
brain-utils   = { path = "../utils" }
brain-agents  = { path = "../agents" }
brain-scanner = { path = "../scanner" }
brain-core    = { path = "../core" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
