[package]
name = "orca-inventory"
version.workspace = true
edition.workspace = true

[lib]
name = "orca_inventory"
path = "src/lib.rs"

# Server-side pod-topology aggregator. Unifies pod members, (future)
# containers, (future) vms, and (future) network edges into the typed shapes
# the systems UI renders directly. This crate hosts `pod.detail` (the pod
# topology tree) and the future `network.topology_view` slice.
#
# Crate is named `orca-inventory` because the `inventory` package name on
# crates.io belongs to the linker-collection crate every `#[orca_tool]` site
# depends on (workspace dep `inventory = "0.3"`). Lib name is `orca_inventory`.

[dependencies]
plugin-toolkit = { path = "../plugin-toolkit" }
contract       = { path = "../contract", default-features = false }
derive         = { path = "../derive" }

pod    = { path = "../pod" }
system = { path = "../system" }

schemars   = { workspace = true }
serde      = { workspace = true }

anyhow      = { workspace = true }
clap        = { workspace = true }
tracing     = { workspace = true }

[lints]
workspace = true
