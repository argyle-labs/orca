[package]
name = "orca-inventory"
publish = false
version.workspace = true
edition.workspace = true

[lib]
name = "orca_inventory"
path = "src/lib.rs"

# Server-side topology aggregator. Unifies mesh members, (future)
# containers, (future) vms, and (future) network edges into the typed shapes
# the systems UI renders directly. This crate hosts `system.topology` (the mesh
# topology tree) and the future `network.topology_view` slice.
#
# Crate is named `orca-inventory` because the `inventory` package name on
# crates.io belongs to the linker-collection crate every `#[orca_tool]` site
# depends on (workspace dep `inventory = "0.3"`). Lib name is `orca_inventory`.

[dependencies]
plugin-toolkit = { workspace = true, default-features = true }
contract       = { workspace = true }
derive         = { workspace = true }

system = { workspace = true }

schemars   = { workspace = true }
serde      = { workspace = true }

anyhow      = { workspace = true }
clap        = { workspace = true }
tracing     = { workspace = true }

[lints]
workspace = true
