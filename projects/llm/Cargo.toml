[package]
name = "orca-llm"
version = "0.1.0"
edition.workspace = true

[lib]
name = "llm"

[dependencies]
config   = { package = "orca-config", path = "../config" }
db       = { package = "orca-db",     path = "../db" }
tool     = { package = "orca-tool",   path = "../tool" }
orca_fs  = { package = "orca-fs",     path = "../fs" }

anyhow       = "1"
async-trait  = "0.1"
tokio        = { version = "1", features = ["full"] }
tokio-util   = "0.7"
reqwest      = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
futures-util = "0.3"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
colored      = "2"
uuid         = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
