[package]
name = "orca-llm"
version = "0.1.0"
edition.workspace = true

[lib]
name = "llm"

[dependencies]
config   = { package = "orca-config", path = "../config" }
db       = { package = "orca-db",     path = "../db" }
tool     = { package = "orca-tool",   path = "../tool" }
orca_fs  = { package = "orca-fs",     path = "../fs" }

anyhow       = { workspace = true }
async-trait  = { workspace = true }
tokio        = { workspace = true }
tokio-util   = { workspace = true }
reqwest      = { workspace = true }
# rustls is a direct dep so we can install ring as the process-default crypto
# provider before reqwest first builds a client (required by rustls-no-provider).
rustls       = { workspace = true }
futures-util = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
colored      = { workspace = true }
uuid         = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
