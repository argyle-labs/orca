[package]
name = "orca-session"
version = "0.1.0"
edition = "2024"

[lib]
name = "session"

[dependencies]
# Workspace crates
orca-agents = { path = "../agents" }
orca-core   = { path = "../core" }
orca-jobs   = { path = "../jobs" }
config      = { package = "orca-config",  path = "../config" }
db          = { package = "orca-db",      path = "../db" }
ledger      = { package = "orca-ledger",  path = "../ledger" }
log         = { package = "orca-log",     path = "../log" }

# Async
anyhow      = "1"
async-trait = "0.1"
tokio       = { version = "1", features = ["full"] }
tokio-util  = "0.7"
futures-util = "0.3"

# Serialization
serde_json = "1"

# Terminal
colored    = "2"
rustyline  = "14"
crossterm  = { version = "0.28", features = ["event-stream"] }
ratatui    = "0.29"
dirs       = "5"
