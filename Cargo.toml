[workspace]
members = [
    "projects/agents",
    "projects/commands",
    "projects/config",
    "projects/db",
    "projects/docs",
    "projects/fs",
    "projects/jobs",
    "projects/llm",
    "projects/scanner",
    "projects/sdk",
    "projects/server",
    "projects/conversation",
    "projects/state",
    "projects/tool",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev]
opt-level = 0
