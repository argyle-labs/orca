[workspace.package]
edition = "2024"

# Single source of truth for shared external crate versions. Every member
# crate that uses one of these MUST declare it as `dep = { workspace = true }`
# (with optional `features = [...]` additions) — never re-pin a version
# locally. This prevents the "we have rand 0.8 and rand 0.9 in the binary"
# class of bug.
[workspace.dependencies]
# Standard
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
url = "2"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
regex = "1"
toml = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Async
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"

# Tracing & terminal
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
colored = "3"

# HTTP & TLS
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-no-provider", "form", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pki-types = "1"
rustls-pemfile = "2"

# DB
rusqlite = { version = "0.39", features = ["bundled-sqlcipher-vendored-openssl"] }

# Web framework / API
axum = { version = "0.8", features = ["macros", "ws"] }
utoipa = { version = "5", features = ["axum_extras"] }
schemars = { version = "1", features = ["derive"] }
jsonschema = { version = "0.30", default-features = false }

# Hashing & RNG
sha2 = "0.10"
rand = "0.9"

# REPL/TUI
rustyline = "18"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Optional binary embedding (frontend dist/)
rust-embed = "8"
mime_guess = "2"

# Test
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# Misc
glob = "0.3"
pulldown-cmark = "0.13"

[workspace]
members = [
    "projects/agents",
    "projects/commands",
    "projects/config",
    "projects/db",
    "projects/docs",
    "projects/fs",
    "projects/jobs",
    "projects/llm",
    "projects/scanner",
    "projects/sdk",
    "projects/profile",
    "projects/conformance-plugin",
    "projects/examples/system-info",
    "projects/server",
    "projects/conversation",
    "projects/state",
    "projects/tool",
    "projects/http",
    "projects/graphql",
    "projects/git",
    "projects/integrations/ntfy",
    "projects/integrations/dockge",
    "projects/integrations/smb",
    "projects/integrations/docker",
    "projects/integrations/proxmox",
    "projects/integrations/homeassistant",
    "projects/integrations/nfs",
    "projects/integrations/unraid",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0

# Proc-macro crates run AT compile time — optimizing them speeds up every
# incremental build even after sccache has them cached, because the proc-macro
# binary still re-executes on each compile that uses it.
[profile.dev.package.syn]
opt-level = 3
[profile.dev.package.proc-macro2]
opt-level = 3
[profile.dev.package.quote]
opt-level = 3
[profile.dev.package.serde_derive]
opt-level = 3
[profile.dev.package.utoipa-gen]
opt-level = 3
[profile.dev.package.clap_derive]
opt-level = 3
[profile.dev.package.async-trait]
opt-level = 3

# Heavy pure-Rust deps: compile once (cached by sccache), run fast in tests.
# opt-level=1 = single optimization pass — much better runtime than 0 with
# only marginally slower compile; the extra time is paid once and cached.
[profile.dev.package.tokio]
opt-level = 1
[profile.dev.package.rustls]
opt-level = 1
[profile.dev.package.ring]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 1
[profile.dev.package.regex-syntax]
opt-level = 1
[profile.dev.package.futures-util]
opt-level = 1
