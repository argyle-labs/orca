[workspace]
members = [
    "projects/agents",
    "projects/auth",
    "projects/commands",
    "projects/config",
    "projects/db",
    "projects/core",
    "projects/fs",
    "projects/ledger",
    "projects/log",
    "projects/docs",
    "projects/jobs",
    "projects/scanner",
    "projects/server",
    "projects/session",
    "projects/state",
    "projects/tool",
    "projects/types",
    "projects/utils",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev]
opt-level = 0
